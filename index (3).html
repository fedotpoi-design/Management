ии, приоритет организационной формы над содержанием и большая доля непроизводственной сферы?","options":[{"label":"А","text":"Снижение ставок по банковским кредитам, сокращение административного аппарата и ускорение вывода инновационных товаров на рынок","isCorrect":false},{"label":"Б","text":"Рост лояльности покупателей, увеличение маржинальности продаж и победа во всех государственных тендерах","isCorrect":false},{"label":"В","text":"Полноценная цифровизация производственных цехов, снижение себестоимости единицы продукции и ликвидация брака","isCorrect":false},{"label":"Г","text":"Бюрократизация в принятии решений, запоздалые реакции, утрата ключевых деловых партнеров, отсутствие обратной связи, ощущение малозначимости у персонала и высокая доля непроизводительных расходов","isCorrect":true}],"explanation":"Согласно слайду 27 Лекции 1, симптомами нарушения организационной иерархии и неадаптивности оргструктуры выступают: бюрократизация в принятии решений, запоздалые реакции, утрата ключевых деловых партнеров, отсутствие обратной связи, ощущение малозначимости у персонала, безынициативность, увольнение ведущих сотрудников и высокая доля непроизводительных расходов."},{"id":62,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Кризис в области рыночного положения и маркетинга","slideRef":"Лекция 1, слайд 28","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие явления в таблице диагностики (Лекция 1, слайд 28) относятся к СИМПТОМАМ (проявлениям) кризиса в области рыночного положения и маркетинга, вызванного неконкурентоспособным положением на рынке?","options":[{"label":"А","text":"Снижение объемов продаж, перепроизводство и увеличение запасов готовой продукции на складах; неэффективная реклама, неузнаваемость товара и фирмы, постоянные проигрыши в торгах; рекламации, возврат продукции, претензии, судебные иски, низкая лояльность клиентов и низкая клиентская конверсия","isCorrect":true},{"label":"Б","text":"Снижение объемов продаж, перепроизводство и увеличение запасов готовой продукции на складах; неэффективная реклама, неузнаваемость товара и фирмы, постоянные проигрыши в торгах; нарушение единоначалия и субординации, отсутствие должностных инструкций и кадровый «голод» в бухгалтерии","isCorrect":false},{"label":"В","text":"Снижение объемов продаж, перепроизводство и увеличение запасов готовой продукции на складах; рекламации, возврат продукции, претензии, судебные иски, низкая лояльность клиентов и низкая клиентская конверсия; нарушение единоначалия и субординации, отсутствие должностных инструкций и кадровый «голод» в бухгалтерии","isCorrect":false},{"label":"Г","text":"Неэффективная реклама, неузнаваемость товара и фирмы, постоянные проигрыши в торгах; рекламации, возврат продукции, претензии, судебные иски, низкая лояльность клиентов и низкая клиентская конверсия; нарушение единоначалия и субординации, отсутствие должностных инструкций и кадровый «голод» в бухгалтерии","isCorrect":false}],"explanation":"Согласно слайду 28 Лекции 1, симптомами кризиса в области рыночного положения и маркетинга являются: снижение объемов продаж, увеличение запасов готовой продукции, увеличение дебиторской задолженности и сроков ее оборачиваемости, перепроизводство, недозагрузка мощностей, неэффективная реклама, неузнаваемость товара/фирмы, рекламации и возврат продукции, постоянные проигрыши в торгах, слишком высокие/низкие цены, низкая лояльность и конверсия."},{"id":63,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Причины и симптомы финансового кризиса","slideRef":"Лекция 1, слайд 29","isFromOriginal40":false,"isMultiSelect":false,"question":"Что в таблице диагностики финансового кризиса в организации (Лекция 1, слайд 29) относится к ПРИЧИНАМ кризиса (неэффективности организации финансовой работы), а не к его внешним симптомам?","options":[{"label":"А","text":"Падение выручки, непропорциональный рост затрат, снижение прибыли и убытки, кассовые разрывы и задержки в выплате заработной платы","isCorrect":false},{"label":"Б","text":"Бессистемность бюджетирования, рискованные инвестиции, дефицит собственных финансовых ресурсов, ошибки в налоговом планировании, отсутствие управленческого учета и неразвитая функция внутреннего аудита и контроллинга","isCorrect":true},{"label":"В","text":"Отказ коммерческих банков в выдаче кредитов, проигрыш в тендерах, налоговые проверки, предписания, штрафы и пени","isCorrect":false},{"label":"Г","text":"Высокий уровень производственного травматизма, срыв сроков поставки продукции и разрыв договоров по инициативе клиентов","isCorrect":false}],"explanation":"На слайде 29 Лекции 1 четко разграничены причины финансового кризиса (бессистемность бюджетирования, рискованные инвестиции, дефицит собственных ресурсов, ошибки в налоговом планировании, отсутствие системы управленческого учета, отсутствие регулярного анализа финпоказателей, нецелевое использование ресурсов, неразвитый внутренний аудит и контроллинг) и его симптомы (падение выручки, кассовые разрывы, задержки зарплаты и др.)."},{"id":64,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Кризис управления человеческим капиталом","slideRef":"Лекция 1, слайд 30","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие факторы выступают ПРИЧИНАМИ кризиса управления человеческим капиталом (бессистемности управления персоналом) согласно слайду 30 Лекции 1?","options":[{"label":"А","text":"Зависимость от иностранных поставщиков комплектующих, ошибки при формировании отпускных цен и сложности с логистическими каналами сбыта","isCorrect":false},{"label":"Б","text":"Отсутствие или неполная конструкторская и технологическая документация и неразвитая производственная инфраструктура цехов","isCorrect":false},{"label":"В","text":"Неэффективный подбор, квалификационный и возрастной дисбаланс, кадровый «голод» или избыточная численность, отсутствие программ развития, устаревшие директивные методы, токсичная культура и трудоустройство вне принципов профессионализма","isCorrect":true},{"label":"Г","text":"Нецелевое использование заемных средств, кассовые разрывы и ошибки в расчете амортизации основных средств","isCorrect":false}],"explanation":"На слайде 30 Лекции 1 в колонке «Причины кризиса» (Бессистемность управления персоналом) указаны: неэффективный подбор персонала, неэффективный состав и структура, кадровый «голод», слишком большая численность, отсутствие программ развития, устаревшие директивные методы управления, некомфортная токсичная корпоративная культура, отсутствие стратегии развития персонала и трудоустройство вне принципов профессионализма."},{"id":65,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Причины и симптомы производственного кризиса","slideRef":"Лекция 1, слайд 31","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие проявления в организации свидетельствуют о наступлении ПРОИЗВОДСТВЕННОГО кризиса, вызванного дезорганизацией производственной системы?","options":[{"label":"А","text":"Высокая производственная себестоимость, брак, срыв сроков поставки и разрыв договоров по инициативе клиентов, высокий уровень производственного травматизма, низкая зарплата рабочих и нехватка производственного персонала","isCorrect":true},{"label":"Б","text":"Увеличение доли собственного капитала в балансе, снижение постоянных издержек и профицит платежного календаря","isCorrect":false},{"label":"В","text":"Избыточная узнаваемость бренда на внешних рынках и рост конверсии рекламных кампаний свыше нормативного уровня","isCorrect":false},{"label":"Г","text":"Сокращение числа иерархических уровней управления и делегирование полномочий автономным проектным командам","isCorrect":false}],"explanation":"Согласно слайду 31 Лекции 1, симптомами производственного кризиса являются: высокая производственная себестоимость, некачественная продукция (брак), срыв с :"Меркантилистская школа, физиократическая школа, маржиналистская школа, историческая школа, институциональная школа, монетаристская школа","isCorrect":false},{"label":"Б","text":"Школа бережливого производства, школа партизанского маркетинга, школа венчурного инвестирования, школа биржевого арбитража, школа налогового права, школа контроллинга","isCorrect":false},{"label":"В","text":"Операционно-административная школа, школа человеческих отношений и поведения, количественная школа, системно-ситуационная школа, школа организационной культуры, процессуальная школа","isCorrect":true},{"label":"Г","text":"Классическая политэкономия, кейнсианство, неолиберализм, эволюционная экономика, эконометрика, поведенческие финансы","isCorrect":false}],"explanation":"На слайде 34 Лекции 1 перечислены 6 школ менеджмента, присутствующих в АУ: 1) операционно-административная школа; 2) школа человеческих отношений и поведения; 3) количественная школа; 4) системно-ситуационная школа; 5) школа организационной культуры; 6) процессуальная."},{"id":71,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Операционно-административная школа (Тейлор и Файоль)","slideRef":"Лекция 1, слайд 35","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие выводы и практические рекомендации Ф.У. Тейлора в рамках операционно-административной школы особенно актуальны для антикризисного управления производственной деятельностью?","options":[{"label":"А","text":"Согласование взаимно стимулирующих интересов собственников и работников, а также повышение производительности труда организационными мерами в условиях дефицита ресурсов; перераспределение задач между работниками так, чтобы каждый сосредоточился на тех функциях, с которыми он справляется лучше всех (так как в кризис нет времени на переподготовку кадров); полная отмена материального стимулирования и задержка выплаты вознаграждения на срок до окончания процедуры финансового оздоровления","isCorrect":false},{"label":"Б","text":"Согласование взаимно стимулирующих интересов собственников и работников, а также повышение производительности труда организационными мерами в условиях дефицита ресурсов; вознаграждение должно следовать очень быстро за выполнением работы, а там, где это не вредит делу, надо идти на уступки рабочим для сплочения коллектива; полная отмена материального стимулирования и задержка выплаты вознаграждения на срок до окончания процедуры финансового оздоровления","isCorrect":false},{"label":"В","text":"Перераспределение задач между работниками так, чтобы каждый сосредоточился на тех функциях, с которыми он справляется лучше всех (так как в кризис нет времени на переподготовку кадров); вознаграждение должно следовать очень быстро за выполнением работы, а там, где это не вредит делу, надо идти на уступки рабочим для сплочения коллектива; полная отмена материального стимулирования и задержка выплаты вознаграждения на срок до окончания процедуры финансового оздоровления","isCorrect":false},{"label":"Г","text":"Согласование взаимно стимулирующих интересов собственников и работников, а также повышение производительности труда организационными мерами в условиях дефицита ресурсов; перераспределение задач между работниками так, чтобы каждый сосредоточился на тех функциях, с которыми он справляется лучше всех (так как в кризис нет времени на переподготовку кадров); вознаграждение должно следовать очень быстро за выполнением работы, а там, где это не вредит делу, надо идти на уступки рабочим для сплочения коллектива","isCorrect":true}],"explanation":"На слайде 35 Лекции 1 приведены все 6 актуальных выводов Тейлора для АУ: согласование интересов собственников и персонала; рост производительности труда организационными мерами; научный подход к анализу динамических процессов; перераспределение задач по принципу «кто что умеет делать лучше всех» без затрат времени на переподготовку; быстрое вознаграждение вслед за работой; разумные уступки рабочим для сплочения коллектива."},{"id":72,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Количественная школа в АУ","slideRef":"Лекция 1, слайды 36–37","isFromOriginal40":false,"isMultiSelect":false,"question":"К какому историческому периоду относится зарождение количественной школы менеджмента и какие четыре ее положения находят наиболее широкое применение в антикризисном управлении?","options":[{"label":"А","text":"К 50–60-м годам XX в.; применяются: экономико-математический анализ генезиса событий, методы количественных измерений в оценке решений, экономико-математическое моделирование развития кризиса и «дерево целей»","isCorrect":true},{"label":"Б","text":"К 90-м годам XIX в.; применяются: хронометраж рабочих операций, конвейерная сборка, сдельная оплата труда и цеховой контроль мастеров","isCorrect":false},{"label":"В","text":"К 20-м годам XX в.; применяются: Хоторнские эксперименты, неформальное лидерство, социально-психологический климат и групповая динамика","isCorrect":false},{"label":"Г","text":"К началу XXI в.; применяются: исключительно облачные CRM-системы, таргетированная реклама в соцсетях и аутстаффинг персонала","isCorrect":false}],"explanation":"Согласно слайдам 36–37 Лекции 1, зарождение количественной школы относят к 50–60-м годам XX в. В АУ широко применяются 4 ее приема: 1) экономико-математический анализ генезиса событий в кризисной организации; 2) методы количественных измерений в оценке решений; 3) экономико-математическое моделирование развития кризисной ситуации; 4) разделение процесса разработки решений на серию последовательных шагов («дерево целей»)."},{"id":73,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Системно-ситуационная школа","slideRef":"Лекция 1, слайды 38–39","isFromOriginal40":false,"isMultiSelect":false,"question":"Почему согласно слайду 39 Лекции 1 в антикризисном управлении недопустим чисто ситуационный подход в отрыве от системного подхода и что предполагает системно-ситуационный подход в АУ?","options":[{"label":"А","text":"Ситуационный подход запрещен Федеральным законом № 127-ФЗ «О несостоятельности (банкротстве)» при проведении процедуры наблюдения","isCorrect":false},{"label":"Б","text":"Системный подход полностью игнорирует изменения внешней среды и рассматривает предприятие как закрытую неизменную структуру","isCorrect":false},{"label":"В","text":"Недоучет качества целостной системы, которую представляет собой кризисная фирма, чреват неточными решениями и крупными потерями; подход предполагает мониторинг среды, экспресс-анализ состояния системы, прогнозы развития ситуации и разработку многовариантных решений","isCorrect":true},{"label":"Г","text":"Системно-ситуационный подход применяется только в стабильно растущих корпорациях и теряет актуальность при появлении признаков неплатежеспособности","isCorrect":false}],"explanation":"На слайде 39 Лекции 1 подчеркнуто: если в общем менеджменте можно допустить чисто ситуационный подход, то в АУ недоучет качества системы чреват неточными решениями и крупными потерями. Системно-ситуационный подход предполагает мониторинг внутренней и внешней среды, экспресс-анализ состояния системы, составление прогнозов и разработку многовариантных управленческих решений."},{"id":74,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Процессуальная школа в АУ","slideRef":"Лекция 1, слайд 40","isFromOriginal40":false,"isMultiSelect":false,"question":"Какую последовательность из пяти функций призван выполнять антикризисный управляющий через призму процессного подхода (процессуальной школы менеджмента)?","options":[{"label":"А","text":"Инвентаризация -> оценка имущества -> публикация объявления о торгах -> проведение аукциона -> ликвидация юридического лица","isCorrect":false},{"label":"Б","text":"Наблюдение -> финансовое оздоровление -> внешнее управление -> конкурсное производство -> заключение мирового соглашения","isCorrect":false},{"label":"В","text":"Анализ остатка денег на счетах -> проверка отчета о прибылях и убытках -> расчет коэффициентов баланса -> подготовка презентации собственнику","isCorrect":false},{"label":"Г","text":"Планирование -> организация (формирование структуры и распорядительство) -> мотивация -> контроль -> корректировки курса (внесение изменений в ранее принятые решения)","isCorrect":true}],"explanation":"Согласно слайду 40 Лекции 1, через призму процессного подхода антикризисный управляющий последовательно выполняет: планирование; организацию (формирование структуры и распорядительство); мотивацию; контроль; корректировки курса (внесение изменений в ранее принятые решения) ввиду высокой изменчивости среды."},{"id":75,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Два типа антикризисного управления","slideRef":"Лекция 1, слайд 41","isFromOriginal40":false,"isMultiSelect":false,"question":"На какие два основных типа подразделяется антикризисное управление в зависимости от текущего состояния предприятия и каково их содержание?","options":[{"label":"А","text":"АУ нормально функционирующим предприятием (профилактика кризиса, сглаживание циклических колебаний, отслеживание факторов и превентивные меры) и АУ предприятием, уже находящимся в кризисе (вывод из кризиса, реализация антикризисной стратегии, возврат на нормальный уровень)","isCorrect":true},{"label":"Б","text":"АУ государственными казенными учреждениями (бюджетное финансирование) и АУ частными индивидуальными предпринимателями (микрокредитование)","isCorrect":false},{"label":"В","text":"Добровольное антикризисное управление (по инициативе профсоюза) и принудительное антикризисное управление (по решению налоговой инспекции)","isCorrect":false},{"label":"Г","text":"Внутреннее бухгалтерское управление (сдача баланса) и внешнее аудиторское управление (подтверждение достоверности отчетности)","isCorrect":false}],"explanation":"Слайд 41 Лекции 1 выделяет два типа АУ: 1) Антикризисное управление нормально функционирующим предприятием (профилактика, недопущение кризиса, сглаживание циклических колебаний, превентивные меры); 2) Антикризисное управление предприятием, уже находящимся в кризисе (вывод из кризиса, разработка и реализация антикризисной стратегии, вывод на нормальный уровень функционирования)."},{"id":76,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Инструменты механизма АУ","slideRef":"Лекция 1, слайд 42","isFromOriginal40":false,"isMultiSelect":false,"question":"Посредством каких десяти комплексных инструментов, охватывающих все сферы управленческой деятельности, реализуется механизм антикризисного управления на предприятии?","options":[{"label":"А","text":"Диагностика финансового состояния и оценка перспектив развития бизнеса, коррекция системы управления, внедрение управленческого учета и контроллинга; маркетинговые антикризисные мероприятия, антикризисная инвестиционная политика, антикризисное управление персоналом, стратегическое планирование; уклонение от налоговых платежей, фиктивное дробление бизнеса и вывод ликвидных активов на аффилированных лиц","isCorrect":false},{"label":"Б","text":"Диагностика финансового состояния и оценка перспектив развития бизнеса, коррекция системы управления, внедрение управленческого учета и контроллинга; маркетинговые антикризисные мероприятия, антикризисная инвестиционная политика, антикризисное управление персоналом, стратегическое планирование; антикризисная инновационная политика, антикризисный реинжиниринг бизнес-процессов, реструктуризация предприятия","isCorrect":true},{"label":"В","text":"Диагностика финансового состояния и оценка перспектив развития бизнеса, коррекция системы управления, внедрение управленческого учета и контроллинга; антикризисная инновационная политика, антикризисный реинжиниринг бизнес-процессов, реструктуризация предприятия; уклонение от налоговых платежей, фиктивное дробление бизнеса и вывод ликвидных активов на аффилированных лиц","isCorrect":false},{"label":"Г","text":"Маркетинговые антикризисные мероприятия, антикризисная инвестиционная политика, антикризисное управление персоналом, стратегическое планирование; антикризисная инновационная политика, антикризисный реинжиниринг бизнес-процессов, реструктуризация предприятия; уклонение от налоговых платежей, фиктивное дробление бизнеса и вывод ликвидных активов на аффилированных лиц","isCorrect":false}],"explanation":"На слайде 42 Лекции 1 перечислены все 10 инструментов механизма АУ: диагностика финансового состояния и оценка перспектив; коррекция системы управления; внедрение управленческого учета и контроллинга; маркетинговые антикризисные мероприятия; антикризисная инвестиционная политика; антикризисное управление персоналом; стратегическое планирование; антикризисная инновационная политика; антикризисный реинжиниринг бизнес-процессов; реструктуризация предприятия."},{"id":77,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Структура АУ: Этап 1 (Стабилизация кризиса)","slideRef":"Лекция 1, слайд 43","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие первоочередные меры необходимо предпринять на первом этапе структуры антикризисного менеджмента — «1. Стабилизация кризиса»?","options":[{"label":"А","text":"Немедленно увеличить бюджет на долгосрочные капитальные вложения и запустить строительство новых производственных корпусов","isCorrect":false},{"label":"Б","text":"Провести полную замену корпоративной культуры и организовать двухгодичное обучение всего персонала новым цифровым компетенциям","isCorrect":false},{"label":"В","text":"Передать управление компанией внешнему управляющему по решению арбитражного суда и объявить мораторий на выплату заработной платы","isCorrect":false},{"label":"Г","text":"Стабилизировать финансовую составляющую (все расходы утверждаются антикризисной командой, останавливаются все дискреционные проекты), выработать стратегию получения краткосрочной прибыли и определить самые серьезные прямые угрозы","isCorrect":true}],"explanation":"Согласно слайду 43 Лекции 1, на этапе «1. Стабилизация кризиса» нужно прежде всего стабилизировать финансовую составляющую: удостовериться, что все расходы утверждены антикризисной командой, остановить все дискреционные (необязательные) проекты, контролировать расходы, выработать стратегию получения краткосрочной прибыли и сосредоточиться на самых серьезных прямых угрозах."},{"id":78,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Структура АУ: Новое лидерство и стейкхолдеры","slideRef":"Лекция 1, слайд 44","isFromOriginal40":false,"isMultiSelect":false,"question":"В чем заключается ключевой смысл этапов «2. Новое лидерство» и «3. Менеджмент заинтересованных сторон» в семиэтапной структуре антикризисного менеджмента?","options":[{"label":"А","text":"Изменения в руководстве передают всей команде сигнал о серьезности ситуации (оценка того, кто справляется, а кого нужно заменить), а открытый диалог с инвесторами, акционерами и сотрудниками без сокрытия планов формирует критически важное доверие","isCorrect":true},{"label":"Б","text":"Полное засекречивание антикризисных планов от трудового коллектива и миноритарных акционеров во избежание утечки коммерческой информации","isCorrect":false},{"label":"В","text":"Сохранение всех прежних руководителей на своих должностях без анализа их результативности ради поддержания психологического комфорта","isCorrect":false},{"label":"Г","text":"Прекращение любых контактов с инвесторами и кредиторами до момента полного завершения финансовой реструктуризации через три года","isCorrect":false}],"explanation":"На слайде 44 Лекции 1 указано: плохое руководство чаще всего является основной причиной кризиса, поэтому изменения в руководстве передают сообщение всем членам команды, что все очень серьезно. На этапе менеджмента заинтересованных сторон нужно наладить отношения с инвесторами и акционерами и не скрывать планов от своей команды, так как доверие важно как никогда."},{"id":79,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Структура АУ: Стратегический фокус и процесс улучшения","slideRef":"Лекция 1, слайд 45","isFromOriginal40":false,"isMultiSelect":false,"question":"По каким четырем причинам на этапе «4. Стратегический фокус» необходимо пересмотреть организационную стратегию и каким требованием она должна обладать во времена тяжелого кризиса?","options":[{"label":"А","text":"Причины: избыток ликвидности, рост рыночной доли, отсутствие конкурентов и профицит кадров; стратегия должна быть максимально сложной и многоуровневой","isCorrect":false},{"label":"Б","text":"Причины: изменились условия, изменились технологии, на должностях находятся неподходящие люди, старые методы больше не работают; стратегия должна быть предельно проста, так как может не хватить денег на что-то глобальное","isCorrect":true},{"label":"В","text":"Причины связаны исключительно с изменением климатических условий; стратегия должна предусматривать закрытие всех основных подразделений","isCorrect":false},{"label":"Г","text":"Стратегия пересматривается только по требованию налогового органа и должна включать масштабные капитальные вложения в непрофильные активы","isCorrect":false}],"explanation":"Слайд 45 Лекции 1 выделяет 4 причины пересмотра стратегии: изменились условия; изменились технологии; на должностях находятся неподходящие люди; старые методы больше не работают. При этом «во времена тяжелого кризиса стратегия должна быть предельно проста, потому что у вас может просто не хватить денег на что-то глобальное»."},{"id":80,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Структура АУ: Орг. изменения и фин. реструктуризация","slideRef":"Лекция 1, слайд 46","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие три внутренних элемента организации могут конфликтовать друг с другом на этапе «6. Организационные изменения» и в чем состоит переход к завершающему этапу «7. Финансовая реструктуризация»?","options":[{"label":"А","text":"Конфликтовать могут только поставщики, покупатели и транспортные компании; а на 7-м этапе происходит полная распродажа имущества с молотка","isCorrect":false},{"label":"Б","text":"На 6-м этапе увольняется весь персонал без предложения обучения, а на 7-м этапе компания берет высокорисковые валютные кредиты под залог основных фондов","isCorrect":false},{"label":"В","text":"Конфликтовать могут структура, культура и люди (начинать нужно с людей, обучения и честного диалога, гармонизируя культуру и структуру); а на 7-м этапе после получения краткосрочной прибыли компания начинает с умом и без серьезных рисков вкладывать деньги в долгосрочные проекты","isCorrect":true},{"label":"Г","text":"На 6-м этапе отменяется организационная структура, а на 7-м этапе прекращаются любые долгосрочные инвестиции в пользу выплаты дивидендов","isCorrect":false}],"explanation":"Согласно слайду 46 Лекции 1, у каждой организации есть три элемента — структура, культура и свои люди, которые могут конфликтовать (сопротивление изменениям). Начинать нужно с людей и обучения, формируя новую культуру и структуру. На этапе «7. Финансовая реструктуризация» после получения краткосрочной прибыли приходит время выходить из кризиса и вкладывать деньги в долгосрочные проекты, избегая на первых порах серьезных рисков."},{"id":81,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Понятие кризиса","slideRef":"Лекция 2, слайд 2","isFromOriginal40":false,"isMultiSelect":false,"question":"Какое научное определение понятия «кризис» применительно к социально-экономической системе (организации) дается в материалах Лекции 2?","options":[{"label":"А","text":"Крайнее обострение противоречий в социально-экономической системе (организации), угрожающее ее жизнестойкости в окружающей среде","isCorrect":true},{"label":"Б","text":"Временное плановое снижение объема выпуска продукции в связи с проведением сезонного профилактического ремонта оборудования","isCorrect":false},{"label":"В","text":"Любое изменение организационной структуры предприятия, сопровождающееся созданием новых филиалов и представительств","isCorrect":false},{"label":"Г","text":"Установленный арбитражным судом факт превышения балансовой стоимости основных средств над величиной уставного капитала","isCorrect":false}],"explanation":"На слайде 2 Лекции 2 приведено базовое определение: «Кризис — это крайнее обострение противоречий в социально-экономической системе (организации), угрожающее ее жизнестойкости в окружающей среде»."},{"id":82,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Этимология слова «кризис»","slideRef":"Лекция 2, слайд 3","isFromOriginal40":false,"isMultiSelect":false,"question":"Каково историко-лингвистическое происхождение термина «кризис» в русском языке и какое значение это слово имело в языке-первоисточнике?","options":[{"label":"А","text":"Заимствовано из средневекового итальянского языка (bancarotta) в XVIII в. и первоначально означало «сломанная скамья менялы»","isCorrect":false},{"label":"Б","text":"Заимствовано русским языком из немецкого (Krisis) в первой трети XVI в.; в латинском (crisis) означает «переломный момент», а первоисточником является греческий язык, где оно означало «решение, исход»","isCorrect":true},{"label":"В","text":"Происходит из английского биржевого сленга конца XIX в. и в первоисточнике означало «биржевой крах и неплатежеспособность»","isCorrect":false},{"label":"Г","text":"Заимствовано из французского законодательства Наполеона в начале XIX в. и означало «принудительное взыскание долга»","isCorrect":false}],"explanation":"Согласно слайду 3 Лекции 2, существительное «кризис» заимствовано русским языком из немецкого (Krisis) в первой трети XVI в. Латинское crisis — «переломный момент», а первоисточником является греческий язык, в котором оно имело значение «решение, исход»."},{"id":83,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Китайский перевод слова «кризис»","slideRef":"Лекция 2, слайд 4","isFromOriginal40":false,"isMultiSelect":false,"question":"Каков точный дословный смысл двух иероглифов «вэй» (危) и «цзи» (机), из которых состоит китайское слово «кризис», согласно разбору на слайде 4 Лекции 2?","options":[{"label":"А","text":"«Вэй» означает «финансовый убыток», а «цзи» — «гарантированная сверхприбыль при спекулятивной торговле»","isCorrect":false},{"label":"Б","text":"Первый иероглиф означает «разрушение государства», а второй иероглиф — «помощь императорской казны»","isCorrect":false},{"label":"В","text":"«Вэй» означает «опасность, угроза, затруднение», а «цзи» в изначальном значении — «механизм (спусковой механизм)», то есть дословно «критическая точка» или «спусковой момент к опасности»","isCorrect":true},{"label":"Г","text":"Оба иероглифа являются синонимами и переводятся как «неизбежное банкротство купеческой гильдии»","isCorrect":false}],"explanation":"На слайде 4 Лекции 2 разъясняется, что основной смысл иероглифа 机 («цзи») — «критическая точка», «механизм» («спусковой механизм»), а 危 («вэй») — «опасность, угроза, затруднение» (возможно, от названия племен Вэй). Дословно иероглиф трактуется как «спусковой момент к опасности»."},{"id":84,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Причины экономических циклов в теории","slideRef":"Лекция 2, слайд 5","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие разнородные явления в истории экономической теории объявлялись исследователями в качестве причин возникновения экономических циклов?","options":[{"label":"А","text":"Уровень солнечной активности, войны, революции, военные перевороты и президентские выборы; недостаточный уровень потребления, высокие темпы роста населения, оптимизм и пессимизм инвесторов; принятие арбитражным судом решения о назначении административного управляющего в отдельной фирме","isCorrect":false},{"label":"Б","text":"Уровень солнечной активности, войны, революции, военные перевороты и президентские выборы; изменение предложения денег, технические и технологические нововведения, ценовые шоки; принятие арбитражным судом решения о назначении административного управляющего в отдельной фирме","isCorrect":false},{"label":"В","text":"Недостаточный уровень потребления, высокие темпы роста населения, оптимизм и пессимизм инвесторов; изменение предложения денег, технические и технологические нововведения, ценовые шоки; принятие арбитражным судом решения о назначении административного управляющего в отдельной фирме","isCorrect":false},{"label":"Г","text":"Уровень солнечной активности, войны, революции, военные перевороты и президентские выборы; недостаточный уровень потребления, высокие темпы роста населения, оптимизм и пессимизм инвесторов; изменение предложения денег, технические и технологические нововведения, ценовые шоки","isCorrect":true}],"explanation":"На слайде 5 Лекции 2 перечислены явления, объявлявшиеся причинами экономических циклов: уровень солнечной активности; войны, революции и военные перевороты; президентские выборы; недостаточный уровень потребления; высокие темпы роста населения; оптимизм и пессимизм инвесторов; изменение предложения денег; технические и технологические нововведения; ценовые шоки."},{"id":85,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Типы и длительность экономических циклов","slideRef":"Лекция 2, слайд 6","isFromOriginal40":false,"isMultiSelect":false,"question":"Какое соответствие между типами экономических циклов, их характерной длиной и главными особенностями указано в сводной таблице на слайде 6 Лекции 2?","options":[{"label":"А","text":"Циклы Китчина (40–60 лет: технологический прогресс), циклы Жугляра (16–25 лет: жилищное строительство), циклы Кузнеца (7–12 лет: запасы золота), циклы Кондратьева (2–4 года: колебания спроса)","isCorrect":false},{"label":"Б","text":"Циклы Китчина (2–4 года: величина запасов), циклы Жугляра (7–12 лет: инвестиционный цикл), циклы Кузнеца (16–25 лет: доход, иммиграция, жилищное строительство), циклы Кондратьева (40–60 лет: глобальные структурные изменения, технологический прогресс)","isCorrect":true},{"label":"В","text":"Циклы Китчина (1–2 года: сезонная торговля), циклы Жугляра (3–5 лет: амортизация инвентаря), циклы Кузнеца (50–70 лет: смена поколений), циклы Кондратьева (100–150 лет: геополитические сдвиги)","isCorrect":false},{"label":"Г","text":"Все четыре типа циклов имеют одинаковую среднесрочную продолжительность 10–15 лет и различаются только страной происхождения их авторов","isCorrect":false}],"explanation":"Таблица «Типы экономических циклов» (Лекция 2, слайд 6) устанавливает: Китчина — 2–4 года (величина запасов, колебания ВНП, инфляции, занятости, спроса); Жугляра — 7–12 лет (инвестиционный цикл -> колебания ВНП, инфляции и занятости); Кузнеца — 16–25 лет (доход -> иммиграция -> жилищное строительство, совокупный спрос); Кондратьева — 40–60 лет (глобальные структурные изменения, технологический прогресс)."},{"id":86,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Фазы экономического цикла","slideRef":"Лекция 2, слайды 8, 19","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие четыре классические фазы чередуются на графике цикличности экономического развития (Лекция 2, слайд 8)?","options":[{"label":"А","text":"Наблюдение, Оздоровление, Внешнее управление, Конкурс","isCorrect":false},{"label":"Б","text":"Стабилизация, Лидерство, Фокус, Реструктуризация","isCorrect":false},{"label":"В","text":"Оживление, Подъем, Спад, Депрессия","isCorrect":true},{"label":"Г","text":"Зарождение, Монополизация, Стагнация, Национализация","isCorrect":false}],"explanation":"На графике «Цикличность экономического развития» (слайд 8 Лекции 2) выделены четыре последовательные фазы волны экономической активности во времени: Оживление, Подъем, Спад, Депрессия (а в рамках циклов Кузнеца на сл. 19 также именуются Подъем, Пик, Спад, Кризис)."},{"id":87,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Совпадение точек падения по Кондратьеву","slideRef":"Лекция 2, слайд 9","isFromOriginal40":false,"isMultiSelect":false,"question":"При каком условии, согласно предположению Н.Д. Кондратьева, в мировой экономике происходят наиболее разрушительные кризисы и какие исторические примеры это подтверждают?","options":[{"label":"А","text":"Когда повышательная фаза длинной волны накладывается на фазу оживления короткого цикла Китчина; примеры: экономический бум 1950-х и 1990-х гг.","isCorrect":false},{"label":"Б","text":"Только в годы проведения всеобщих президентских выборов при одновременном снижении добычи золота в Южной Африке","isCorrect":false},{"label":"В","text":"Исключительно при переходе от аграрного уклада к мануфактурному производству в конце XVIII века","isCorrect":false},{"label":"Г","text":"Когда совпадают точки максимального падения деловой активности «длинноволнового цикла» и классического (среднесрочного) цикла; примеры: кризис 1873 г., Великая депрессия 1929–1933 гг., стагфляция 1974–1975 гг.","isCorrect":true}],"explanation":"Согласно слайду 9 Лекции 2, Кондратьев предположил, что наиболее разрушительные кризисы происходят тогда, когда совпадают точки максимального падения деловой активности «длинноволнового цикла» и классического. Примерами служат кризис 1873 года, Великая Депрессия 1929–1933 годов, стагфляция 1974–1975 годов."},{"id":88,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Научная биография Н.Д. Кондратьева","slideRef":"Лекция 2, слайд 10","isFromOriginal40":false,"isMultiSelect":false,"question":"Какой научный институт основал и возглавил Н.Д. Кондратьев в 1920 году при Наркомате финансов Союза ССР и в каком году вышла его знаменитая работа «Большие циклы конъюнктуры»?","options":[{"label":"А","text":"Конъюнктурный институт при Наркомате финансов (1920 г.), а работа «Большие циклы конъюнктуры» была опубликована в 1925 году","isCorrect":true},{"label":"Б","text":"Институт мировой экономики и международных отношений (1917 г.), а работа была опубликована в 1938 году","isCorrect":false},{"label":"В","text":"Центральный экономико-математический институт (1927 г.), а работа была опубликована в 1918 году","isCorrect":false},{"label":"Г","text":"Статистическое бюро Колумбийского университета в Нью-Йорке (1922 г.), а работа вышла в 1930 году","isCorrect":false}],"explanation":"На слайде 10 Лекции 2 указано: в 1920 году основан Конъюнктурный институт при Наркомате финансов Союза ССР, заведующим которого назначили Н.Д. Кондратьева, а в 1925 году ученый опубликовал работу «Большие циклы конъюнктуры»."},{"id":89,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Йозеф Шумпетер и развитие теории ДЛВ","slideRef":"Лекция 2, слайд 11","isFromOriginal40":false,"isMultiSelect":false,"question":"Какой выдающийся экономист XX века развил учение Н.Д. Кондратьева о длинных волнах (ДЛВ) и интегрировал его в свою общую инновационную теорию экономического развития?","options":[{"label":"А","text":"Милтон Фридмен","isCorrect":false},{"label":"Б","text":"Дэвид Дюран","isCorrect":false},{"label":"В","text":"Йозеф Шумпетер","isCorrect":true},{"label":"Г","text":"Уильям Бивер","isCorrect":false}],"explanation":"Согласно слайду 11 Лекции 2, великий экономист XX века Йозеф Шумпетер развил учение Кондратьева о ДЛВ и разработал инновационную теорию длинных волн, интегрировав ее в свою общую инновационную теорию экономического развития."},{"id":90,"lectureId":"lec2" длинного цикла определяет продолжительность действия производственных инфраструктур; 4) социальные процессы (войны, революции, миграции) как следствие преобразования экономического механизма; 5) необходимость накопить ресурсы в натуральной и денежной форме для замены капитала и выхода на новый подъем."},{"id":95,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Циклы (ритмы) Саймона Кузнеца","slideRef":"Лекция 2, слайды 19–21","isFromOriginal40":false,"isMultiSelect":false,"question":"С какими фундаментальными социально-экономическими процессами американский экономист и нобелевский лауреат Саймон (Семен) Кузнец связывал открытые им в 1930-х годах экономические циклы периодичностью 15–25 лет?","options":[{"label":"А","text":"Исключительно с краткосрочными колебаниями мировых запасов монетарного золота на приисках Южной Африки","isCorrect":false},{"label":"Б","text":"С демографическими процессами (миграция, рождаемость и смертность) и этапами капитального (жилищного) строительства и долгосрочных инвестиций в инфраструктуру","isCorrect":true},{"label":"В","text":"Только с психологической задержкой осмысления бухгалтерской отчетности менеджерами среднего звена","isCorrect":false},{"label":"Г","text":"С сезонными климатическими колебаниями урожайности зерновых культур в засушливых регионах","isCorrect":false}],"explanation":"Согласно слайдам 19–21 Лекции 2, Саймон Кузнец связывал ритмы (волны) Кузнеца длительностью 15–25 лет с демографическими процессами (миграция, рождаемость, смертность) и этапами капитального (в том числе жилищного) строительства и долгосрочных инвестиций в капитальные объекты."},{"id":96,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Вклад С. Кузнеца в экономическую науку","slideRef":"Лекция 2, слайд 20","isFromOriginal40":false,"isMultiSelect":false,"question":"Какую известную гипотезу о динамике неравенства доходов («кривая Кузнеца») выдвинул С. Кузнец и какое его открытие 1937 года считается самым известным в макроэкономике?","options":[{"label":"А","text":"По мере роста экономики неравенство доходов бесконечно увеличивается; самое известное открытие — формула расчета ключевой ставки центрального банка","isCorrect":false},{"label":"Б","text":"Неравенство доходов не зависит от уровня экономического развития; самое известное открытие — разработка модели балльной оценки банкротства предприятий","isCorrect":false},{"label":"В","text":"В развивающихся странах неравенство доходов сперва возрастает, а по мере роста экономики снижается; самое известное открытие — детальный анализ и разработка методов подсчета показателя ВВП в его современном понимании (Нобелевская премия 1971 г.)","isCorrect":true},{"label":"Г","text":"В развитых странах неравенство доходов всегда равно нулю; самое известное открытие — теория монетаризма и таргетирования денежной массы","isCorrect":false}],"explanation":"На слайде 20 Лекции 2 указано: Кузнец выдвинул гипотезу («кривая Кузнеца»), согласно которой в развивающихся странах неравенство доходов сперва возрастает, а по мере роста экономики снижается. Самое известное его открытие — детальный анализ и разработка методов подсчета показателя внутреннего валового продукта (ВВП) в его современном понимании (1937 г.), за труды он получил Нобелевскую премию в 1971 году."},{"id":97,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Промышленные циклы К. Жугляра","slideRef":"Лекция 2, слайд 22","isFromOriginal40":false,"isMultiSelect":false,"question":"Когда и кем впервые были открыты среднесрочные промышленные (бизнес) циклы продолжительностью 7–12 лет и какие временные лаги приводят к формированию колебаний в этих циклах?","options":[{"label":"А","text":"Открыты французским экономистом К. Жугляром в 1862 году; временной лаг существует между принятием инвестиционных решений и возведением производственных мощностей, между их возведением и актуальным запуском, а также между спадом спроса и уменьшением объема производства","isCorrect":true},{"label":"Б","text":"Открыты британским статистиком Дж. Китчином в 1922 году; лаг связан исключительно с доставкой золотых слитков морским транспортом из колоний в метрополию","isCorrect":false},{"label":"В","text":"Открыты американским экономистом Э. Альтманом в 1968 году; лаг формируется между датой публикации годового отчета и выплатой дивидендов по акциям","isCorrect":false},{"label":"Г","text":"Открыты Н.Д. Кондратьевым в 1925 году; лаг возникает только при смене поколений работников один раз в 50 лет","isCorrect":false}],"explanation":"Согласно слайду 22 Лекции 2, циклы продолжительностью 7–12 лет были открыты французским экономистом К. Жугляром в 1862 году и связаны с колебаниями инвестиций в основной капитал. Временной лаг существует между принятием инвестиционных решений и возведением мощностей, между возведением и запуском мощностей, а также между спадом спроса и уменьшением объема производства."},{"id":98,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Малые циклы Дж. Китчина","slideRef":"Лекция 2, слайды 23–25","isFromOriginal40":false,"isMultiSelect":false,"question":"Чем сам британский статистик Джозеф Китчин первоначально объяснял появление малых экономических циклов (3–4 года) и какова их современная научная интерпретация?","options":[{"label":"А","text":"Китчин связывал их с пятнами на Солнце, а современная наука объясняет их полным износом зданий и сооружений каждые три года","isCorrect":false},{"label":"Б","text":"Китчин (работавший в Южной Африке в золотодобыче) связывал их с колебаниями мировых запасов золота; современная интерпретация объясняет их временными задержками между свершившимся фактом и реакцией на него из-за психологического фактора (время на осмысление информации) и технологического фактора (время на внедрение решений в производство)","isCorrect":true},{"label":"В","text":"Китчин связывал их с демографическими волнами рождаемости, а современная наука — с глобальными технологическими революциями","isCorrect":false},{"label":"Г","text":"И сам Китчин, и современные экономисты объясняют эти циклы исключительно изменениями налоговых ставок по НДС и налогу на прибыль","isCorrect":false}],"explanation":"На слайдах 23–25 Лекции 2 указано: Дж. Китчин открыл малые циклы (3–4 года) на данных Англии и США до 1922 г. и связывал их с колебаниями мировых запасов золота. Современная интерпретация объясняет циклы Китчина временными задержками между фактическим событием и ответной реакцией на него, вызванными психологическим фактором (время на анализ информации) и технологическим фактором (время на внедрение решений в производство), что раскачивает «качели цикла»."},{"id":99,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Общие и локальные, макро- и микрокризисы","slideRef":"Лекция 2, слайд 26","isFromOriginal40":false,"isMultiSelect":false,"question":"По каким классификационным признакам кризисы подразделяются на «общие и локальные», а также на «макро- и микрокризисы» согласно слайду 26 Лекции 2?","options":[{"label":"А","text":"Общие кризисы возникают только в государственных корпорациях, а локальные кризисы — только у индивидуальных предпринимателей","isCorrect":false},{"label":"Б","text":"Макрокризисы длятся менее одного месяца, а микрокризисы продолжаются от 40 до 60 лет в рамках волн Кондратьева","isCorrect":false},{"label":"В","text":"По масштабу охвата системы выделяют общие (охватывают всю социально-экономическую систему) и локальные (только ее часть); по проблематике кризиса выделяют макрокризисы (большие объемы и масштабы проблематики) и микрокризисы (отдельная проблема или группа проблем)","isCorrect":true},{"label":"Г","text":"Локальные кризисы всегда ведут к принудительной ликвидации страны, а общие кризисы затрагивают только один производственный цех","isCorrect":false}],"explanation":"На слайде 26 Лекции 2 указано: 1) общие кризисы охватывают всю социально-экономическую систему, локальные — только часть ее; 2) по проблематике кризиса выделяют макрокризисы (большие объемы и масштабы проблематики) и микрокризисы (захватывают только отдельную проблему или группу проблем)."},{"id":100,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Экономические, финансовые и социальные кризисы","slideRef":"Лекция 2, слайд 27","isFromOriginal40":false,"isMultiSelect":false,"question":"Какое место в классификации кризисов (Лекция 2, слайд 27) занимают финансовые кризисы и политический кризис?","options":[{"label":"А","text":"Финансовые кризисы относятся к группе экологических кризисов, а политический кризис является разновидностью технологического кризиса","isCorrect":false},{"label":"Б","text":"Финансовые и политические кризисы возникают исключительно вследствие природных катаклизмов (землетрясений и наводнений)","isCorrect":false},{"label":"В","text":"Политический кризис представляет собой кризис технологической несовместимости изделий на сборочном конвейере предприятия","isCorrect":false},{"label":"Г","text":"Финансовые кризисы выделяются внутри группы экономических кризисов как кризисы денежного выражения экономических процессов; политический кризис занимает особое положение в группе социальных кризисов (кризис в политическом устройстве общества, кризис власти и управления обществом)","isCorrect":true}],"explanation":"Согласно слайду 27 Лекции 2: в группе экономических кризисов отдельно выделяются финансовые кризисы (кризисы денежного выражения экономических процессов), а в группе социальных кризисов особое положение занимает политический кризис (кризис власти, политического устройства и реализации интересов социальных групп)."},{"id":101,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Организационные, психологические и технологические кризисы","slideRef":"Лекция 2, слайд 27","isFromOriginal40":false,"isMultiSelect":false,"question":"Как в классификации кризисов (Лекция 2, слайд 27) определяются организационные и технологические кризисы?","options":[{"label":"А","text":"Организационные кризисы проявляются только в виде массовой паники и страха за будущее, а технологические — в виде забастовок профсоюзов против работодателей","isCorrect":false},{"label":"Б","text":"Организационные проявляются как кризисы разделения и интеграции деятельности, распределения функций, отделения административных единиц или филиалов; технологические возникают как кризис новых технологических идей при явной потребности в новых технологиях (несовместимость изделий, отторжение новых решений, кризис НТП)","isCorrect":true},{"label":"В","text":"Технологические кризисы означают исключительно нехватку наличных денег в кассе предприятия для выплаты аванса работникам","isCorrect":false},{"label":"Г","text":"Организационные кризисы вызываются климатическими аномалиями, а технологические — изменениями ставок налога на доходы физических лиц","isCorrect":false}],"explanation":"На слайде 27 Лекции 2 даны точные определения: организационные кризисы — кризисы разделения и интеграции деятельности, распределения функций, регламентации подразделений, отделения филиалов/дочерних фирм; технологический кризис — кризис новых технологических идей в условиях потребности в новых технологиях, кризис технологической несовместимости изделий или отторжения новых решений, кризис НТП."},{"id":102,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Природные, общественные и экологические кризисы","slideRef":"Лекция 2, слайд 28","isFromOriginal40":false,"isMultiSelect":false,"question":"В чем заключается принципиальное отличие «экологических кризисов» от собственно «природных кризисов» по непосредственным причинам их возникновения (Лекция 2, слайд 28)?","options":[{"label":"А","text":"Экологические кризисы вообще не связаны с природой и означают нарушение деловой этики в совете директоров корпорации","isCorrect":false},{"label":"Б","text":"Природные кризисы создаются деятельностью промышленных предприятий, а экологические кризисы зависят только от солнечной активности","isCorrect":false},{"label":"В","text":"Природные кризисы вызваны естественными явлениями природы (землетрясения, ураганы, наводнения), а экологические кризисы возникают при изменении природных условий, вызванных деятельностью самого человека (истощение ресурсов, загрязнение среды, опасные технологии, пренебрежение законами природного равновесия)","isCorrect":true},{"label":"Г","text":"Между природными и экологическими кризисами в классификации курса нет никаких различий, это полные синонимы","isCorrect":false}],"explanation":"Слайд 28 Лекции 2 разделяет по непосредственным причинам: А) природные кризисы (землетрясения, ураганы, пожары, климатические изменения, наводнения); Б) общественные; В) экологические кризисы — кризисы взаимоотношения человека с природой, возникающие при изменении природных условий, вызванных деятельностью человека (истощение ресурсов, загрязнение среды, опасные технологии)."},{"id":103,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Предсказуемые и неожиданные, явные и латентные кризисы","slideRef":"Лекция 2, слайд 29","isFromOriginal40":false,"isMultiSelect":false,"question":"Чем характеризуются предсказуемые (закономерные) кризисы в отличие от неожиданных (случайных), и почему латентные кризисы считаются наиболее опасными (Лекция 2, слайд 29)?","options":[{"label":"А","text":"Предсказуемые кризисы всегда являются результатом ошибок бухгалтерии, а латентные кризисы легко обнаруживаются в первый же день без какого-либо финансового анализа","isCorrect":false},{"label":"Б","text":"Неожиданные кризисы планируются в пятилетней стратегии компании, а явные кризисы невозможно заметить до полной ликвидации фирмы","isCorrect":false},{"label":"В","text":"Латентные кризисы протекают исключительно в форме открытых судебных процессов с налоговыми и таможенными органами","isCorrect":false},{"label":"Г","text":"Предсказуемые наступают как этап развития по объективным причинам (потребность реструктуризации, НТП), а неожиданные — из-за грубых ошибок управления или стихийных явлений; латентные кризисы наиболее опасны, так как являются скрытыми и протекают относительно незаметно","isCorrect":true}],"explanation":"Согласно слайду 29 Лекции 2, предсказуемые (закономерные) кризисы наступают как этап развития по объективным причинам накопления факторов (потребность реструктуризации, НТП), а неожиданные (случайные) — результат грубых ошибок в управлении, природных явлений или экономической зависимости. Латентные (скрытые) кризисы протекают относительно незаметно и поэтому наиболее опасны."},{"id":104,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Глубокие и легкие кризисы","slideRef":"Лекция 2, слайд 29","isFromOriginal40":false,"isMultiSelect":false,"question":"Какими особенностями протекания отличаются «глубокие (острые)» кризисы от «легких (мягких)» кризисов согласно классификации на слайде 29 Лекции 2?","options":[{"label":"А","text":"Глубокие, острые кризисы часто ведут к разрушению различных структур социально-экономической системы, протекают сложно и неравномерно, аккумулируя множество противоречий в запутанный клубок; легкие, мягкие кризисы протекают более последовательно и безболезненно, их можно предвидеть и ими легче управлять","isCorrect":true},{"label":"Б","text":"Глубокие кризисы всегда завершаются в течение 15 дней без потерь для собственников, а легкие кризисы неизбежно приводят к банкротству и ликвидации бизнеса","isCorrect":false},{"label":"В","text":"Легкие кризисы невозможно прогнозировать никакими экономико-математическими методами, тогда как глубокие кризисы проходят без участия антикризисного менеджера","isCorrect":false},{"label":"Г","text":"Глубокие кризисы затрагивают только сферу корпоративной этики, а легкие кризисы разрушают всю производственную инфраструктуру государства","isCorrect":false}],"explanation":"На слайде 29 Лекции 2 указано: глубокие, острые кризисы часто ведут к разрушению различных структур социально-экономической системы, протекают сложно и неравномерно, завязывают множество противоречий в запутанный клубок; легкие, мягкие кризисы протекают более последовательно и безболезненно, их можно предвидеть, ими легче управлять."},{"id":105,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Психологические кризисы","slideRef":"Лекция 2, слайд 27","isFromOriginal40":false,"isMultiSelect":false,"question":"В каких конкретных проявлениях выражаются психологические кризисы в современных условиях социально-экономического развития согласно слайду 27 Лекции 2?","options":[{"label":"А","text":"Исключительно в технологической несовместимости новых образцов промышленного оборудования со старыми сборочными линиями","isCorrect":false},{"label":"Б","text":"Только в юридическом отделении региональных филиалов и дочерних обществ от головной материнской корпорации","isCorrect":false},{"label":"В","text":"В виде стресса, приобретающего массовый характер, в возникновении чувства неуверенности, паники, страха за будущее, неудовлетворенности работой, правовой защищенностью и социальным положением (кризисы в социально-психологическом климате коллектива или общества)","isCorrect":true},{"label":"Г","text":"В превышении суммы краткосрочных кредиторских обязательств над величиной оборотных активов в бухгалтерском балансе","isCorrect":false}],"explanation":"Согласно слайду 27 Лекции 2, психологические кризисы — это кризисы психологического состояния человека и социально-психологического климата общества, коллектива или группы, проявляющиеся в виде массового стресса, чувства неуверенности, паники, страха за будущее, неудовлетворенности работой, правовой защищенностью и социальным положением."},{"id":106,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Датировка 1–4 циклов Кондратьева","slideRef":"Лекция 2, слайд 17","isFromOriginal40":false,"isMultiSelect":false,"question":"С какого исторического года начинается отсчет первого большого цикла конъюнктуры в классической датировке Н.Д. Кондратьева (Лекция 2, слайд 17)?","options":[{"label":"А","text":"С 1700 года (1-й цикл: с 1700 до 1750 гг.)","isCorrect":false},{"label":"Б","text":"С 1891 года (1-й цикл: с 1891 до 1945 гг.)","isCorrect":false},{"label":"В","text":"С 1925 года (1-й цикл: с 1925 до 1981 гг.)","isCorrect":false},{"label":"Г","text":"С 1803 года (1-й цикл: с 1803 до 1841–43 гг.)","isCorrect":true}],"explanation":"На слайде 17 Лекции 2 приведена датировка циклов Кондратьева по моментам минимумов экономических показателей мировой экономики: 1 цикл — с 1803 до 1841–43 гг.; 2 цикл — с 1844–51 до 1890–96 гг.; 3 цикл — с 1891–96 до 1945–47 гг.; 4 цикл — с 1945–47 до 1981–83 гг."},{"id":107,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Исследовательская база С. Кузнеца","slideRef":"Лекция 2, слайд 21","isFromOriginal40":false,"isMultiSelect":false,"question":"Какой исторический период охватывали длинные ряды экономической динамики в первом крупном исследовательском проекте Саймона Кузнеца, предпринятом в середине 1920-х годов?","options":[{"label":"А","text":"Основной массив данных охватывал период с 1865 по 1925 годы, а по некоторым показателям достигал 1770 года","isCorrect":true},{"label":"Б","text":"Данные охватывали исключительно пятилетний период с 1968 по 1973 годы по 66 промышленным корпорациям","isCorrect":false},{"label":"В","text":"Статистическая выборка ограничивалась только периодом с 1992 по 2002 годы по предприятиям Российской Федерации","isCorrect":false},{"label":"Г","text":"Исследование охватывало период с XV по XVI век на основе архивных книг средневековых итальянских городов-республик","isCorrect":false}],"explanation":"Согласно слайду 21 Лекции 2, первым крупным исследовательским проектом С. Кузнеца в середине 1920-х гг. было исследование длинных рядов экономической динамики: собранные данные охватывали период с 1865 по 1925 годы, а по некоторым показателям достигали 1770 года."},{"id":108,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Иерархия экономических циклов","slideRef":"Лекция 2, слайды 6, 19, 23","isFromOriginal40":false,"isMultiSelect":false,"question":"В каком порядке располагаются четыре основных типа экономических циклов при их ранжировании от самого короткого к самому длительному?","options":[{"label":"А","text":"Цикл Жугляра -> цикл Китчина -> цикл Кондратьева -> цикл Кузнеца","isCorrect":false},{"label":"Б","text":"Цикл Китчина (2–4 года) -> цикл Жугляра (7–12 лет) -> цикл Кузнеца (15–25 лет) -> цикл Кондратьева (40–60 / 50–70 лет)","isCorrect":true},{"label":"В","text":"Цикл Кузнеца -> цикл Китчина -> цикл Жугляра -> цикл Кондратьева","isCorrect":false},{"label":"Г","text":"Цикл Кондратьева -> цикл Кузнеца -> цикл Жугляра -> цикл Китчина","isCorrect":false}],"explanation":"Цикл Китчина — самый короткий (2–4 / 3–4 года) и является составной частью более длительных циклов: второго по длительности — цикла Жугляра (7–12 лет), третьего по длительности — цикла Кузнеца (15–25 / 16–25 лет) и самого длительного — цикла Кондратьева (40–60 / 50–70 лет) (Лекция 2, слайды 6, 19, 23)."},{"id":109,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Симптомы кризиса персонала","slideRef":"Лекция 1, слайд 30","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие проявления в организации выделяются на слайде 30 Лекции 1 как СИМПТОМЫ кризиса управления человеческим капиталом?","options":[{"label":"А","text":"Увольнен FromOriginal40":false,"isMultiSelect":false,"question":"Какие внутренние факторы образуют блок ПРИЧИН производственного кризиса (дезорганизации производственной системы) согласно слайду 31 Лекции 1?","options":[{"label":"А","text":"Низкое качество планов развития производства, устаревшие технологические процессы, высокий уровень морального и физического износа оборудования, постоянные поломки и ремонт; низкие темпы внедрения инноваций, незадействованный потенциал цифровизации производства, отсутствие современных компетенций у технического персонала; отсутствие системы управления качеством, низкое качество используемых ресурсов, неверная политика закупок, неразвитая производственная инфраструктура, неполная конструкторская документация и ошибочные инвестиции в производство","isCorrect":true},{"label":"Б","text":"Низкое качество планов развития производства, устаревшие технологические процессы, высокий уровень морального и физического износа оборудования, постоянные поломки и ремонт; низкие темпы внедрения инноваций, незадействованный потенциал цифровизации производства, отсутствие современных компетенций у технического персонала; утверждение арбитражным судом мирового соглашения и прекращение производства по делу о банкротстве","isCorrect":false},{"label":"В","text":"Низкое качество планов развития производства, устаревшие технологические процессы, высокий уровень морального и физического износа оборудования, постоянные поломки и ремонт; отсутствие системы управления качеством, низкое качество используемых ресурсов, неверная политика закупок, неразвитая производственная инфраструктура, неполная конструкторская документация и ошибочные инвестиции в производство; утверждение арбитражным судом мирового соглашения и прекращение производства по делу о банкротстве","isCorrect":false},{"label":"Г","text":"Низкие темпы внедрения инноваций, незадействованный потенциал цифровизации производства, отсутствие современных компетенций у технического персонала; отсутствие системы уп  нее изменений в свете развития ситуации; принцип эффективности — любое мероприятие из антикризисного плана должно оцениваться по тому, насколько эффективно выполнены задачи и приблизило ли это к достижению цели."},{"id":112,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Психологический отбор и искусство управления","slideRef":"Лекция 1, слайд 32","isFromOriginal40":false,"isMultiSelect":false,"question":"Почему согласно второму фактору эффективности антикризисного управления («Искусство управления, данное природой и приобретенное в процессе специальной подготовки») крайне важен психологический анализ при отборе специалистов?","options":[{"label":"А","text":"Потому что закон о банкротстве требует наличия диплома клинического психолога у каждого члена комитета кредиторов","isCorrect":false},{"label":"Б","text":"Для того чтобы исключить из команды всех сотрудников, имеющих опыт работы в коммерческих банках и финансовом аудите","isCorrect":false},{"label":"В","text":"Потому что необходимо отобрать специалистов, которые способны чутко реагировать на приближение кризиса и эффективно управлять в экстремальных ситуациях","isCorrect":true},{"label":"Г","text":"Поскольку психологическое тестирование заменяет собой проведение финансового анализа бухгалтерского баланса должника","isCorrect":false}],"explanation":"Согласно пункту 2 слайда 32 Лекции 1, для антикризисного управления крайне важен психологический анализ в отборе специалистов, которые способны чутко реагировать на приближение кризиса и управлять в экстремальных ситуациях."},{"id":113,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Эмпирическая теория эндогенности волн Кондратьева","slideRef":"Лекция 2, слайд 16","isFromOriginal40":false,"isMultiSelect":false,"question":"Как Н.Д. Кондратьев трактовал роль войн, революций, изменений техники, освоения новых территорий и миграции населения в своей эндогенной теории длинных волн (Лекция 2, слайд 16)?","options":[{"label":"А","text":"Все эти явления — совсем не случайные внешние толчки, вызывающие следующий цикл, а внутренняя часть механизма капитализма, которая обеспечивает развитие волнами, где каждая последующая фаза есть результат суммирующихся процессов предыдущих фаз","isCorrect":true},{"label":"Б","text":"Эти явления представляют собой абсолютно случайные внешние шоки, не имеющие никакой связи с предшествующим экономическим развитием и накоплением капитала","isCorrect":false},{"label":"В","text":"Войны и технические изобретения возникают только по воле отдельных политических деятелей и полностью отменяют действие экономических законов","isCorrect":false},{"label":"Г","text":"Миграция населения и освоение территорий влияют исключительно на малые трехлетние циклы Китчина и не затрагивают большие циклы конъюнктуры","isCorrect":false}],"explanation":"На слайде 16 Лекции 2 подчеркнуто: проанализировав статистику временных рядов, Кондратьев создал теорию эндогенного (вызванного внутренними факторами) характера волн. Войны и революции, изменение техники, освоение новых территорий и миграция населения — не случайные толчки, а часть механизма капитализма, обеспечивающая развитие волнами, где каждая последующая фаза есть результат суммирующихся процессов предыдущих фаз."},{"id":114,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Последствия кризиса для организации, региона и государства","slideRef":"Лекция 1, слайд 10","isFromOriginal40":false,"isMultiSelect":false,"question":"Какими социально-экономическими последствиями грозит развитие неконтролируемого кризиса организации для ее владельца, персонала, региона и государства (Лекция 1, слайд 10)?","options":[{"label":"А","text":"Автоматическим переводом всех работников на государственную гражданскую службу с сохранением прежнего оклада","isCorrect":false},{"label":"Б","text":"Потерей собственности владельцем организации, потерей работы персоналом, а также неблагоприятными социальными последствиями для региона и государства вплоть до ликвидации предприятия","isCorrect":true},{"label":"В","text":"Выкупом убыточных активов Центральным банком РФ по удвоенной рыночной стоимости в пользу учредителей","isCorrect":false},{"label":"Г","text":"Исключительно временным снижением дивидендных выплат без каких-либо последствий для занятости и региональной экономики","isCorrect":false}],"explanation":"На слайде 10 Лекции 1 указано: «Для организации последствиями кризиса могут быть потеря собственности ее владельцем, потеря работы персоналом, неблагоприятные социальные последствия для региона, государства»."},{"id":115,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Смысл дифференциации и классификации кризисов","slideRef":"Лекция 2, слайд 26","isFromOriginal40":false,"isMultiSelect":false,"question":"С какой практической управленческой необходимостью связана разветвленная научная классификация кризисов по их сути, причинам и последствиям (Лекция 2, слайд 26)?","options":[{"label":"А","text":"Исключительно с требованиями оформления статистических форм международной отчетности МСФО","isCorrect":false},{"label":"Б","text":"С задачей применения одного и того же шаблонного метода сокращения персонала при любом типе кризиса","isCorrect":false},{"label":"В","text":"С необходимостью дифференциации средств и способов управления кризисами разных видов","isCorrect":true},{"label":"Г","text":"С определением размера фиксированного вознаграждения временного управляющего в процедуре наблюдения","isCorrect":false}],"explanation":"Согласно слайду 26 Лекции 2: «Кризисы неодинаковы не только по своим причинам и последствиям, но и по самой своей сути. Разветвленная классификация кризисов связана с дифференциацией средств и способов управления ими»."},{"id":116,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайд 2","isFromOriginal40":false,"isMultiSelect":false,"question":"Каково историко-этимологическое происхождение термина «банкротство» согласно материалам курса?","options":[{"label":"А","text":"От латинского юридического термина «bonorum venditio» («принудительная продажа имущества»), применявшегося преторами Древнего Рима к неплатежеспособным патрициям","isCorrect":false},{"label":"Б","text":"От старофранцузского словосочетания «banque route» («утраченный торговый путь»), обозначавшего разорение купцов вследствие кораблекрушения торгового каравана","isCorrect":false},{"label":"В","text":"От голландского биржевого понятия «bank-rood» («красная книга банка»), куда в XVII веке вносились имена векселедателей, допустивших протест векселя","isCorrect":false},{"label":"Г","text":"От средневекового итальянского выражения «banco rotto» (буквально «сломанная скамья»), связанного с обычаем кредиторов ломать прилавки несостоятельных менял в итальянских городах-республиках","isCorrect":true}],"explanation":"На слайде 2 Лекции 3 указано немецкое bancarotta и итальянские слова banco (скамья) + rotto (сломанный): в средневековых итальянских городах-республиках кредиторы ломали столы несостоятельных менял."},{"id":117,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайд 3","isFromOriginal40":false,"isMultiSelect":false,"question":"В каком году в Российской Федерации был принят первый закон «О несостоятельности (банкротстве) предприятий» и сколько статей он содержал?","options":[{"label":"А","text":"Закон был принят в 1994 году одновременно с первой частью Гражданского кодекса РФ и содержал 127 статей","isCorrect":false},{"label":"Б","text":"Закон был принят в 1992 году и содержал 189 статей","isCorrect":true},{"label":"В","text":"Закон был принят в 1998 году после дефолта и содержал 234 статьи","isCorrect":false},{"label":"Г","text":"Закон был принят в 1991 году Верховным Советом РСФСР и содержал 95 статей","isCorrect":false}],"explanation":"Слайд 3 Лекции 3: первый закон РФ «О несостоятельности (банкротстве) предприятий» был принят в 1992 году и включал 189 статей; действующий № 127-ФЗ принят Государственной Думой 27 сентября 2002 г."},{"id":118,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 3–5","isFromOriginal40":false,"isMultiSelect":false,"question":"Как в действующем российском законодательстве (Федеральный закон № 127-ФЗ) соотносятся понятия «несостоятельность» и «банкротство», а также как определяется понятие «неплатежеспособность»?","options":[{"label":"А","text":"Несостоятельность означает временный кассовый разрыв до решения суда, тогда как банкротство означает только умышленное уклонение от погашения долгов при наличии ликвидного имущества","isCorrect":false},{"label":"Б","text":"Банкротство применяется исключительно к физическим лицам и индивидуальным предпринимателям, а несостоятельность — исключительно к коммерческим юридическим лицам","isCorrect":false},{"label":"В","text":"Понятия «несостоятельность» и «банкротство» используются как равнозначные синонимы, а неплатежеспособность определяется как прекращение исполнения должником части денежных обязательств или обязанностей по уплате обязательных платежей, вызванное недостаточностью денежных средств","isCorrect":true},{"label":"Г","text":"Неплатежеспособность признается только после завершения конкурсного производства, при этом достаточность денежных средств должника предполагается по закону безусловной","isCorrect":false}],"explanation":"Слайды 3 и 5 Лекции 3: в российском законодательстве «несостоятельность» и «банкротство» синонимичны; неплатежеспособность — прекращение исполнения части денежных обязательств или обязательных платежей из-за недостаточности денежных средств (причем недостаточность предполагается, если не доказано иное)."},{"id":119,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 6–7","isFromOriginal40":false,"isMultiSelect":false,"question":"При какой минимальной совокупной сумме требований к юридическому лицу (общее правило) и каком сроке неисполнения обязательств арбитражный суд возбуждает производство по делу о банкротстве?","options":[{"label":"А","text":"Совокупные требования к юридическому лицу составляют не менее 300 тысяч рублей при просрочке исполнения обязательств свыше 1 месяца","isCorrect":false},{"label":"Б","text":"Совокупные требования к юридическому лицу составляют не менее 500 тысяч рублей при просрочке исполнения обязательств свыше 6 месяцев","isCorrect":false},{"label":"В","text":"Совокупные требования к юридическому лицу составляют не менее 5 миллионов рублей при просрочке исполнения обязательств свыше 90 рабочих дней","isCorrect":false},{"label":"Г","text":"Совокупные требования к юридическому лицу составляют не менее 2 миллионов рублей, а обязательства не исполнены в течение 3 месяцев с даты, когда они должны были быть исполнены","isCorrect":true}],"explanation":"Слайды 6–7 Лекции 3: признаки банкротства юрлица — неисполнение обязательств в течение 3 месяцев с даты исполнения, а совокупные требования к должнику — юридическому лицу составляют не менее 2 млн рублей."},{"id":120,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 8–10","isFromOriginal40":false,"isMultiSelect":false,"question":"Какова предельная продолжительность процедуры наблюдения и в какой срок после принятия судом заявления руководство должника обязано предоставить временному управляющему полную финансовую документацию?","options":[{"label":"А","text":"Длительность наблюдения составляет не более 7 месяцев; руководство предприятия обязано предоставить полную финансовую документацию в течение 15 дней после принятия заявления","isCorrect":true},{"label":"Б","text":"Длительность наблюдения составляет не более 6 месяцев с правом продления на 6 месяцев; документация предоставляется в течение 30 календарных дней","isCorrect":false},{"label":"В","text":"Длительность наблюдения составляет до 12 месяцев; документация предоставляется в течение 3 рабочих дней с момента назначения управляющего","isCorrect":false},{"label":"Г","text":"Длительность наблюдения составляет до 3 месяцев; документация передается только после проведения первого собрания кредиторов","isCorrect":false}],"explanation":"Слайды 9–10 Лекции 3: длительность процедуры наблюдения — не более 7 месяцев; после принятия заявления в течение 15 дней руководство обязано предоставить полную финансовую документацию компании."},{"id":121,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 15–19","isFromOriginal40":false,"isMultiSelect":false,"question":"Кто осуществляет контроль над процедурой финансового оздоровления (глава 5 закона № 127-ФЗ) и за какой срок до окончания установленного периода компания должна передать документы, подтверждающие результаты оздоровления?","options":[{"label":"А","text":"Процедура проходит под контролем временного управляющего; отчет о результатах передается за 15 дней до окончания периода наблюдения","isCorrect":false},{"label":"Б","text":"Процедура проходит под контролем конкурсного управляющего; подтверждающие документы направляются в суд за 60 дней до завершения расчетов","isCorrect":false},{"label":"В","text":"Процедура проходит под контролем административного управляющего; не менее чем за 30 дней до окончания установленного срока компания передает подтверждающие документы","isCorrect":true},{"label":"Г","text":"Процедура проходит под контролем внешнего управляющего с полным отстранением директора; документы передаются в течение 3 дней после инвентаризации","isCorrect":false}],"explanation":"Слайды 15–17 Лекции 3: финансовое оздоровление проходит под контролем административного управляющего; не менее чем за 30 дней до окончания установленного срока компания передает документы, подтверждающие результаты."},{"id":122,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 20–23","isFromOriginal40":false,"isMultiSelect":false,"question":"В чем состоит ключевое отличие процедуры внешнего управления от финансового оздоровления и в какой срок внешний управляющий обязан включить в Единый федеральный реестр сведений о банкротстве результаты инвентаризации имущества?","options":[{"label":"А","text":"Руководитель предприятия сохраняет все полномочия по сделкам, а внешний управляющий вносит результаты инвентаризации в реестр в течение 15 календарных дней","isCorrect":false},{"label":"Б","text":"Имущество должника немедленно выставляется на открытые торги для ликвидации юрлица, а сведения об инвентаризации публикуются в течение 30 дней","isCorrect":false},{"label":"В","text":"Внешнее управление вводится без решения собрания кредиторов сроком на 5 лет, а результаты инвентаризации включаются в реестр в течение 10 рабочих дней","isCorrect":false},{"label":"Г","text":"Действующее руководство отстраняется от управления и полномочия переходят к внешнему управляющему; сведения о результатах инвентаризации включаются в реестр в течение 3 рабочих дней с даты ее окончания","isCorrect":true}],"explanation":"Слайды 21 и 23 Лекции 3: ключевое отличие внешнего управления — отстранение текущего топ-менеджмента и переход полномочий к внешнему управляющему (срок 18 мес. + продление не более 6 мес.); результаты инвентаризации включаются в реестр в течение 3 рабочих дней с даты ее окончания."},{"id":123,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 24–28","isFromOriginal40":false,"isMultiSelect":false,"question":"Какое обязательное условие голосования залоговых кредиторов установлено для принятия мирового соглашения собранием кредиторов и какую юридическую силу придает ему утверждение арбитражным судом?","opt

3 г. — 20%, 2004 г. — 18%, 2019 г. — 20%, с 01.01.2026 — 22% (при сохранении льготной ставки 10%), а также снижение порога УСН, отмену льгот по страховым взносам для большинства МСП и рост взносов для ИТ-сектора в 2026 г."},{"id":177,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайды 13–15","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие инструменты включает денежно-кредитная (монетарная) политика Центрального банка РФ, в чем состоит ее ключевая дилемма и какова траектория ключевой ставки Банка России в 2020–2025 гг., приведенная в лекции?","options":[{"label":"А","text":"Управление ключевой ставкой, денежной массой и резервными требованиями к банкам; дилемма состоит в балансе между расширением кредитования и сдерживанием инфляции; ключевая ставка менялась от исторического минимума 4,25% (2020 г.) и скачка до 20% (март 2022 г.) к пику 21% (декабрь 2024 г.) со снижением до 16% к 19.12.2025 г.","isCorrect":true},{"label":"Б","text":"Установление ставок НДФЛ и таможенных пошлин; ключевая ставка ЦБ РФ в 2020–2025 гг. оставалась неизменной на уровне 7,5% годовых","isCorrect":false},{"label":"В","text":"Прямое финансирование дефицита федерального бюджета за счет бесконтрольной денежной эмиссии при фиксированной ключевой ставке 1% годовых","isCorrect":false},{"label":"Г","text":"Назначение арбитражных управляющих в промышленные компании; ключевая ставка достигла максимума 45% в 2020 году и снизилась до 2% в декабре 2024 года","isCorrect":false}],"explanation":"Слайды 13–15 Лекции 7: ЦБ РФ управляет процентной ставкой, денежной массой и резервными требованиями; решает дилемму между расширением кредита и сдерживанием инфляции; график ключевой ставки показывает 4,25% (2020), 20% (03.2022), 7,5% (12.2022), пик 21% (28.12.2024) и снижение до 16% (19.12.2025)."},{"id":178,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайды 16–19","isFromOriginal40":false,"isMultiSelect":false,"question":"Как в системе государственного антикризисного регулирования распределяются задачи между структурной, промышленной и инвестиционной политикой?","options":[{"label":"А","text":"Инвестиционная политика направлена на полный запрет частных инвестиций и замену их бюджетными субсидиями, а структурная политика занимается только сбором муниципальных налогов","isCorrect":false},{"label":"Б","text":"Структурная политика отвечает за приватизацию, управление госсобственностью и технологическую безопасность; промышленная — за реструктуризацию региональной промышленности, корпоративное планирование и информподдержку; инвестиционная — за освобождение государства от функции главного инвестора и создание условий для привлечения частных инвестиций","isCorrect":true},{"label":"В","text":"Промышленная политика сводится к закрытию градообразующих заводов, а научно-техническая политика — к импорту устаревших патентов без развития собственной науки","isCorrect":false},{"label":"Г","text":"Все три политики идентичны и сводятся исключительно к регулированию курса иностранной валюты на Московской бирже","isCorrect":false}],"explanation":"Слайды 16–19 Лекции 7 подробно разграничивают структурную (приватизация, управление госсобственностью, нацбезопасность), промышленную (реструктуризация промышленности региона, корпоративное планирование, информподдержка) и инвестиционную политику (освобождение государства от роли главного инвестора и привлечение частных инвестиций)."},{"id":179,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайды 21–22","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие три ключевых направления (средства) реализации государственной антикризисной политики выделены в заключительной части Лекции 7 и какие годы оперативных антикризисных поправок в Бюджетный кодекс РФ приведены в качестве примера нормотворческой деятельности?","options":[{"label":"А","text":"1) Судебная ликвидация предприятий, 2) Валютная интервенция, 3) Секвестр всех защищенных социальных статей бюджета (на примере реформ 1991 и 1998 гг.)","isCorrect":false},{"label":"Б","text":"1) Отмена Налогового кодекса РФ, 2) Введение карточной системы распределения товаров, 3) Принудительное слияние всех коммерческих банков в один государственный банк","isCorrect":false},{"label":"В","text":"1) Нормотворческая деятельность (пример — оперативные поправки в Бюджетный кодекс РФ в 2020, 2022 и 2025–2026 гг.), 2) Финансовое регулирование (кредиты, субсидии, налоговые льготы, мораторий на проверки бизнеса), 3) Государственные антикризисные программы","isCorrect":true},{"label":"Г","text":"1) Внешние заимствования у международных организаций, 2) Продажа золотовалютных резервов, 3) Повышение пенсионного возраста и отмена стипендий","isCorrect":false}],"explanation":"Слайды 21–22 Лекции 7: пути преодоления кризисных явлений государством включают: 1) Нормотворческую деятельность (в т.ч. изменения в Бюджетный кодекс РФ в 2020, 2022, 2025–2026 гг.), 2) Финансовое регулирование (кредиты, субсидии, налоговые льготы, мораторий на проверки), 3) Государственные антикризисные программы."},{"id":180,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 12–13","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие пять вариантов решений о дальнейшей судьбе компании-должника могут быть приняты по итогам завершения процедуры наблюдения?","options":[{"label":"А","text":"1) Передача дела в третейский суд; 2) Повторное введение наблюдения на второй 7-месячный срок; 3) Национализация; 4) Конфискация имущества учредителей без суда; 5) Амнистия долгов","isCorrect":false},{"label":"Б","text":"1) Назначение финансового управляющего гражданина; 2) Эмиссия акций; 3) Реорганизация в форме разделения; 4) Переход на кассовый метод учета; 5) Отзыв банковской лицензии у кредиторов","isCorrect":false},{"label":"В","text":"1) Введение моратория на 10 лет; 2) Перевод долга на муниципалитет; 3) Выкуп предприятия временным управляющим; 4) Прощение налоговой недоимки; 5) Закрытие реестра без расчетов","isCorrect":false},{"label":"Г","text":"1) Полная выплата долгов и прекращение дела о банкротстве; 2) Заключение мирового соглашения; 3) Начало процедуры санации (финансового оздоровления); 4) Введение внешнего управления; 5) Признание банкротом и начало конкурсного производства","isCorrect":true}],"explanation":"Слайд 13 Лекции 3 перечисляет ровно 5 вариантов завершения наблюдения: 1) полная выплата долгов и прекращение дела; 2) мировое соглашение; 3) санация (финансовое оздоровление); 4) внешнее управление; 5) конкурсное производство."},{"id":181,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайд 19","isFromOriginal40":false,"isMultiSelect":false,"question":"По каким шести основным показателям и критериям оцениваются итоги процедуры финансового оздоровления предприятия согласно Лекции 3?","options":[{"label":"А","text":"Рост численности административно-управленческого аппарата, увеличение представительских расходов, объем краткосрочных займов под высокие проценты, число судебных споров, стоимость аренды офиса и размер «золотых парашютов»","isCorrect":false},{"label":"Б","text":"Восстановление платежеспособности, выполнение плана-графика погашения долгов, динамика прибыли и рентабельности, улучшение структуры капитала (рост доли собственных средств), операционные изменения и рыночная стабильность","isCorrect":true},{"label":"В","text":"Исключительно по факту полной распродажи недвижимого имущества должника и увольнения не менее 80% производственного персонала","isCorrect":false},{"label":"Г","text":"Только по динамике биржевого индекса РТС и курсу доллара США без анализа выполнения графика погашения задолженности перед кредиторами","isCorrect":false}],"explanation":"Слайд 19 Лекции 3 выделяет 6 критериев оценки итогов финансового оздоровления: 1) восстановление платежеспособности, 2) выполнение плана-графика, 3) прибыль и рентабельность, 4) структура капитала, 5) операционные изменения, 6) рыночная стабильность."},{"id":182,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 43–44","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие меры по предупреждению банкротства стратегических предприятий и организаций уполномочено проводить Правительство Российской Федерации?","options":[{"label":"А","text":"Упрощенная продажа оборонных заводов частным иностранным инвесторам с открытых аукционов без сохранения мобилизационных мощностей","isCorrect":false},{"label":"Б","text":"Отказ от оплаты выполненных работ по государственному оборонному заказу и перевод стратегических предприятий на полное самофинансирование","isCorrect":false},{"label":"В","text":"Организация учета и анализа финансового состояния, проведение реорганизации, погашение образовавшейся задолженности по государственному оборонному заказу, реструктуризация долгов перед бюджетом, содействие в договоренностях с кредиторами о предоставлении госгарантий и проведение досудебной санации","isCorrect":true},{"label":"Г","text":"Немедленное введение конкурсного производства в течение 15 дней при любой просрочке по текущим коммунальным платежам","isCorrect":false}],"explanation":"Слайд 44 Лекции 3 перечисляет 6 мер Правительства РФ по предупреждению банкротства стратегических предприятий: учет и анализ, реорганизация, погашение долгов госзаказчика по ГОЗ, реструктуризация задолженности, госгарантии по реструктуризации и проведение досудебной санации."},{"id":183,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайды 4–5","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие должности засчитываются в обязательный годичный стаж руководящей работы кандидата в арбитражные управляющие и какой срок должен пройти после исключения из СРО за неустраненные нарушения, чтобы лицо снова могло претендовать на членство?","options":[{"label":"А","text":"В стаж засчитывается только работа генеральным директором публичного акционерного общества, а исключение из СРО влечет пожизненный запрет на профессию без права восстановления","isCorrect":false},{"label":"Б","text":"В стаж засчитывается любая работа специалистом отдела продаж или кассиром, а повторное вступление в СРО после исключения за нарушения допускается уже через 10 рабочих дней","isCorrect":false},{"label":"В","text":"В стаж засчитывается только служба в органах прокуратуры и суда, а срок ограничения после исключения из СРО составляет 10 лет","isCorrect":false},{"label":"Г","text":"В стаж засчитывается работа руководителем или заместителем руководителя юридического лица, замещение высших и главных должностей государственной гражданской службы, работа главой или заместителем главы органа местного самоуправления; с момента исключения из СРО за существенные нарушения должно пройти не менее 3 лет","isCorrect":true}],"explanation":"Слайды 4–5 Темы 4: руководящим стажем признается работа руководителем/заместителем руководителя юрлица, высшие и главные должности госслужбы, глава/замглавы местного самоуправления; также требуется отсутствие в течение 3 лет факта исключения из СРО за неустраненные или неустранимые нарушения."},{"id":184,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайды 7–8","isFromOriginal40":false,"isMultiSelect":false,"question":"Какими способами соискатель подтверждает отсутствие судимости, отсутствие дисквалификации и отсутствие факта исключения из другой СРО при вступлении в саморегулируемую организацию арбитражных управляющих?","options":[{"label":"А","text":"Отсутствие судимости подтверждается справкой МВД России, отсутствие дисквалификации — выпиской из реестра дисквалифицированных лиц ФНС России, а отсутствие исключения из СРО — сведениями из сводного государственного реестра арбитражных управляющих Росреестра","isCorrect":true},{"label":"Б","text":"Все три обстоятельства подтверждаются исключительно устным заверением кандидата на собеседовании у председателя наблюдательного совета СРО","isCorrect":false},{"label":"В","text":"Все три справки выдаются Центральным банком РФ по запросу коммерческого банка, в котором открыт счет должника","isCorrect":false},{"label":"Г","text":"Подтверждение осуществляется путем публикации объявления в местной газете и получения характеристики с последнего места учебы","isCorrect":false}],"explanation":"Слайды 7–8 Темы 4 разъясняют порядок подтверждения условий членства: справка об отсутствии судимости (МВД), выписка из реестра дисквалифицированных лиц и проверка по государственному реестру арбитражных управляющих (Росреестр)."},{"id":185,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайды 12–14","isFromOriginal40":false,"isMultiSelect":false,"question":"Какими основными правами и обязанностями наделен арбитражный управляющий при проведении процедур, применяемых в деле о банкротстве?","options":[{"label":"А","text":"Вправе единолично выносить судебные решения вместо судьи арбитражного суда и безвозмездно оформлять имущество должника в свою личную собственность","isCorrect":false},{"label":"Б","text":"Обязан погашать все реестровые долги банкротящегося предприятия за счет собственных личных сбережений независимо от законности своих действий","isCorrect":false},{"label":"В","text":"Вправе созывать собрание и комитет кредиторов, обращаться в арбитражный суд с заявлениями и ходатайствами, запрашивать сведения о должнике и привлекать специалистов; обязан принимать меры по защите имущества должника, анализировать его финансовое состояние, вести реестр требований кредиторов и выявлять признаки преднамеренного и фиктивного банкротства","isCorrect":true},{"label":"Г","text":"Вправе разглашать коммерческую, служебную и банковскую тайну должника третьим лицам в рекламных целях без каких-либо ограничений","isCorrect":false}],"explanation":"Слайды 12–14 Темы 4 систематизируют права (созыв собрания кредиторов, обращения в суд, запрос информации, привлечение специалистов) и обязанности АУ (защита имущества, финанализ, ведение реестра кредиторов, выявление признаков преднамеренного/фиктивного банкротства, сохранение конфиденциальности)."},{"id":186,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайд 18","isFromOriginal40":false,"isMultiSelect":false,"question":"За счет каких средств выплачивается дополнительное вознаграждение арбитражному управляющему, если решение об установлении такого дополнительного вознаграждения принято собранием кредиторов?","options":[{"label":"А","text":"Вне очереди за счет средств федерального бюджета Российской Федерации и резервного фонда Росреестра","isCorrect":false},{"label":"Б","text":"За счет средств, предназначенных для выплаты компенсаций за причинение вреда жизни и здоровью граждан (первой очереди реестра)","isCorrect":false},{"label":"В","text":"За счет средств компенсационного фонда саморегулируемой организации арбитражных управляющих","isCorrect":false},{"label":"Г","text":"За счет средств кредиторов, принявших решение об установлении дополнительного вознаграждения арбитражному управляющему","isCorrect":true}],"explanation":"Слайд 18 Темы 4: собрание кредиторов может установить дополнительное вознаграждение арбитражному управляющему, которое выплачивается за счет средств кредиторов, принявших такое решение (в отличие от базового вознаграждения, выплачиваемого за счет имущества должника)."},{"id":187,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайды 23–24","isFromOriginal40":false,"isMultiSelect":false,"question":"Какова структура органов управления саморегулируемой организации (СРО) арбитражных управляющих и какие специализированные органы в ней формируются?","options":[{"label":"А","text":"Общее собрание членов СРО, постоянно действующий коллегиальный орган управления (наблюдательный совет) и исполнительный орган (руководитель СРО), а также специализированные органы: орган по контролю за деятельностью членов, орган по рассмотрению дел о применении мер дисциплинарного воздействия и орган по отбору кандидатур арбитражных управляющих","isCorrect":true},{"label":"Б","text":"Единоличный собственник-акционер, совет директоров коммерческого банка и ревизионная комиссия налоговой инспекции без участия членов СРО","isCorrect":false},{"label":"В","text":"Комитет залоговых кредиторов, собрание работников должника и департамент муниципальной собственности администрации города","isCorrect":false},{"label":"Г","text":"Коллегия присяжных заседателей, судебный департамент и третейский комитет при Торгово-промышленной палате","isCorrect":false}],"explanation":"Слайды 23–24 Темы 4: органы управления СРО — общее собрание членов, коллегиальный орган (наблюдательный совет), исполнительный орган (руководитель), а также специализированные органы контроля, дисциплинарного воздействия и отбора кандидатур для представления арбитражным судам."},{"id":188,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайд 3","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие направления хозяйственной деятельности охватывает в качестве объектов комплексная диагностика кризисного предприятия согласно Лекции 5?","options":[{"label":"А","text":"Исключительно остаток наличных денег в кассе предприятия на последний рабочий день отчетного квартала без анализа производства и сбыта","isCorrect":false},{"label":"Б","text":"Инновационную деятельность и организационно-технический уровень производства, маркетинг и сбыт, использование материальных и трудовых ресурсов, себестоимость, финансовые результаты и финансовое состояние предприятия","isCorrect":true},{"label":"В","text":"Только биографические данные акционеров и политическую обстановку в зарубежных странах, где у предприятия нет контрагентов","isCorrect":false},{"label":"Г","text":"Только правильность заполнения реквизитов в счетах-фактурах по НДС без оценки себестоимости, ресурсов и маркетинга","isCorrect":false}],"explanation":"Слайд 3 Лекции 5 («Объекты комплексной диагностики»): комплексная диагностика охватывает организационно-технический уровень и инновации, маркетинг и объем продаж, использование основных средств, материальных и трудовых ресурсов, себестоимость, прибыль и финансовое состояние."},{"id":189,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 10–12","isFromOriginal40":false,"isMultiSelect":false,"question":"Как рассчитываются пять факторных показателей X1, X2, X3, X4, X5 в классической пятифакторной модели Э. Альтмана (1968 г.) и какой из них имеет наибольший весовой коэффициент (3,3)?","options":[{"label":"А","text":"X1 = Денежные средства / Краткосрочные обязательства (наибольший вес 3,3); X2 = Запасы / Выручка; X3 = Чистый убыток / Собственный капитал; X4 = Кредиторская задолженность / Дебиторская задолженность; X5 = Основные средства / Валюта баланса","isCorrect":false},{"label":"Б","text":"X1 = Чистая прибыль + Амортизация / Обязательства; X2 = Текущая ликвидность; X3 = Коэффициент автономии (наибольший вес 3,3); X4 = Рентабельность себестоимости; X5 = Коэффициент загрузки активов","isCorrect":false},{"label":"В","text":"X1 = Валовая прибыль / Выручка; X2 = Долгосрочные обязательства / Активы; X3 = Уставный капитал / Краткосрочные обязательства (наибольший вес 3,3); X4 = Амортизация / Основные средства; X5 = Дивиденды / Чистая прибыль","isCorrect":false},{"label":"Г","text":"X1 = Оборотный капитал / Активы; X2 = Нераспределенная прибыль / Активы; X3 = Прибыль до налогообложения (EBIT) / Активы (наибольший вес 3,3); X4 = Рыночная стоимость собственного капитала / Заемный капитал; X5 = Выручка от продаж / Активы","isCorrect":true}],"explanation":"Слайды 10–12 Лекции 5 детально раскрывают 5 коэффициентов модели Альтмана 1968 г.: X1 (доля оборотного капитала в активах, вес 1,2), X2 (нераспределенная прибыль к активам, вес 1,4), X3 (прибыль до уплаты налогов и процентов EBIT к активам, максимальный вес 3,3), X4 (рыночная стоимость СК к ЗК, вес 0,6), X5 (оборачиваемость активов Выручка/Активы, вес 1,0)."},{"id":190,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайд 17","isFromOriginal40":false,"isMultiSelect":false,"question":"В какие годы Э. Альтман разработал специализированные модификации своей модели для непроизводственных (сервисных и торговых) компаний, а также для компаний развивающихся рынков (emerging markets)?","options":[{"label":"А","text":"В 1993 году была предложена четырехфакторная модель для непроизводственных компаний (без показателя оборачиваемости активов X5), а в 2003 году — модификация модели для компаний развивающихся рынков","isCorrect":true},{"label":"Б","text":"В 1945 году для торговых компаний и в 1955 году для развивающихся рынков Латинской Америки","isCorrect":false},{"label":"В","text":"Обе модели были созданы одновременно в 1968 году и содержали по 12 макроэкономических факторов каждая","isCorrect":false},{"label":"Г","text":"Модель для непроизводственных компаний разработана в 2020 году, а для развивающихся рынков — в 2024 году","isCorrect":false}],"explanation":"Слайд 17 Лекции 5 указывает хронологию развития моделей Альтмана: 1993 г. — модель для непроизводственных компаний (исключен отраслезависимый фактор X5 Выручка/Активы), 2003 г. — модель для развивающихся рынков."},{"id":191,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 41–42","isFromOriginal40":false,"isMultiSelect":false,"question":"Как рассчитываются четыре коэффициента K1, K2, K3, K4 в российской модели Беликова — Давыдовой (Z = 8,38*K1 + 1*K2 + 0,054*K3 + 0,63*K4) и какой из них имеет доминирующий вес (8,38)?","options":[{"label":"А","text":"K1 = Долгосрочные обязательства / Собственный капитал (вес 8,38); K2 = Запасы / Краткосрочные обязательства; K3 = Дебиторская задолженность / Выручка; K4 = Амортизация / Чистая прибыль","isCorrect":false},{"label":"Б","text":"K1 = Оборотный капитал / Активы (доминирующий вес 8,38); K2 = Чистая прибыль / Собственный капитал; K3 = Выручка от реализации / Активы; K4 = Чистая прибыль / Интегральные затраты (себестоимость)","isCorrect":true},{"label":"В","text":"K1 = Денежные средства / Валюта баланса (вес 8,38); K2 = Прибыль от продаж / Краткосрочные обязательства; K3 = Оборотные активы / Все обязательства; K4 = Краткосрочные обязательства / Активы","isCorrect":false},{"label":"Г","text":"K1 = Убыток / Собственный капитал (вес 8,38); K2 = Кредиторская задолженность / Дебиторская задолженность; K3 = Активы / Выручка; K4 = Заемный капитал / Собственный капитал","isCorrect":false}],"explanation":"Слайд 41 Лекции 5: в модели Беликова — Давыдовой K1 = Оборотный капитал / Активы (вес 8,38), K2 = Чистая прибыль / Собственный капитал (вес 1,0), K3 = Выручка / Активы (вес 0,054), K4 = Чистая прибыль / Себестоимость (вес 0,63)."},{"id":192,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 44–45","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие типовые антикризисные стратегии и меры по снижению риска банкротства выделяются на заключительных слайдах Лекции 5 по результатам финансовой диагностики?","options":[{"label":"А","text":"Наращивание краткосрочных заимствований под максимальный процент, заморозка работы с дебиторами и покупка низколиквидных непрофильных активов","isCorrect":false},{"label":"Б","text":"Отказ от бюджетирования движения денежных средств, увеличение длительности производственного и финансового цикла в три раза и отмена контроля запасов","isCorrect":false},{"label":"В","text":"Повышение ликвидности активов, оптимизация структуры капитала и реструктуризация долгов, контроль денежных потоков и снижение издержек, а среди стратегий — стратегия сокращения (отсечения лишнего), стратегия поворота (разворота/реструктуризации бизнеса) и стратегия ликвидации при невозможности оздоровления","isCorrect":true},{"label":"Г","text":"Переход исключительно на бартерные расчеты с покупателями при одновременной предоплате поставщикам за 12 месяцев вперед","isCorrect":false}],"explanation":"Слайды 44–45 Лекции 5 резюмируют меры снижения риска банкротства (управление ликвидностью, оптимизация капитала, реструктуризация долгов, контроль ДДС и издержек) и типовые антикризисные стратегии предприятия."},{"id":193,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайд 16","isFromOriginal40":false,"isMultiSelect":false,"question":"При соблюдении каких условий компания-должник или ее учредители могут претендовать на введение судебной процедуры финансового оздоровления согласно Лекции 6?","options":[{"label":"А","text":"Наличие реальной возможности восстановить платежеспособность бизнеса (компания продолжает работать или может быстро перезапустить производство), подготовка реалистичного плана финансового оздоровления и графика погашения задолженности, а также согласие первого собрания кредиторов (или предоставление банковской гарантии / залога)","isCorrect":true},{"label":"Б","text":"Полное отсутствие у предприятия производственных активов, персонала и выручки в течение последних трех лет при категорическом отказе всех кредиторов от графика рассрочки","isCorrect":false},{"label":"В","text":"Наличие вступившего в законную силу приговора суда об умышленном (преднамеренном) банкротстве и выводе всех активов в офшорные юрисдикции","isCorrect":false},{"label":"Г","text":"Завершение конкурсного производства и внесение записи о ликвидации юридического лица в Единый государственный реестр юридических лиц","isCorrect":false}],"explanation":"Слайд 16 Лекции 6 («Когда компания может претендовать на финансовое оздоровление»): бизнес должен иметь потенциал восстановления платежеспособности, подготовить план оздоровления и график погашения долгов, подкрепленный согласием собрания кредиторов или надежным обеспечением."},{"id":194,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайд 17","isFromOriginal40":false,"isMultiSelect":false,"question":"Что представляет собой План финансового оздоровления («финансовая реанимация») предприятия и какие разделы он обязательно включает согласно Лекции 6?","options":[{"label":"А","text":"Утвержденный конкурсным управляющим перечень лотов для распродажи имущества банкрота с молотка и список увольняемых сотрудников с расчетом выходных пособий","isCorrect":false},{"label":"Б","text":"Документ, обосновывающий способы получения средств для удовлетворения требований кредиторов в ходе процедуры, включающий общую характеристику должника, анализ причин кризиса, конкретные мероприятия по восстановлению платежеспособности (снижение расходов, рост доходов, реструктуризация) и прогноз финансовых показателей","isCorrect":true},{"label":"В","text":"Рекламный буклет компании для потенциальных покупателей продукции, не содержащий никаких финансовых расчетов и сроков погашения кредиторской задолженности","isCorrect":false},{"label":"Г","text":"Стандартная налоговая декларация по налогу на прибыль и НДС за предшествующий календарный год без программы антикризисных мероприятий","isCorrect":false}],"explanation":"Слайд 17 Лекции 6 раскрывает содержание Плана финансового оздоровления («финансовая реанимация»): обоснование источников и мер восстановления платежеспособности для расчета с кредиторами по утвержденному графику."},{"id":195,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайд 18","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие благоприятные правовые последствия (защитные меры) наступают для компании-должника на весь период введения судебной процедуры финансового оздоровления?","options":[{"label":"А","text":"Все ранее выданные предприятию лицензии и разрешения автоматически аннулируются, а банковские счета блокируются для любых приходных операций от покупателей","isCorrect":false},{"label":"Б","text":"На всю сумму реестровой задолженности начинают начисляться штрафные пени в двойном размере ключевой ставки ЦБ РФ за каждый день процедуры","isCorrect":false},{"label":"В","text":"Отменяются ранее принятые меры по обеспечению требований кредиторов, приостанавливается действие исполнительных документов по имущественным взысканиям (за рядом исключений), не начисляются неустойки (штрафы, пени) и иные финансовые санкции по старым обязательствам, а расчеты ведутся строго по утвержденному графику","isCorrect":true},{"label":"Г","text":"Судебные приставы-исполнители получают право без решения суда изымать сырье и готовую продукцию непосредственно с конвейера предприятия","isCorrect":false}],"explanation":"Слайд 18 Лекции 6 отмечает защитный режим финансового оздоровления: приостанавливаются меры принудительного взыскания по старым долгам, снимаются аресты и обеспечительные меры, прекращается начисление неустоек (пеней, штрафов), что дает бизнесу передышку для работы по графику."},{"id":196,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайд 2","isFromOriginal40":false,"isMultiSelect":false,"question":"Как в Лекции 7 определяется государственное антикризисное регулирование и как изменяется роль государства и масштабы государственного сектора в периоды экономических кризисов?","options":[{"label":"А","text":"Это политика полного невмешательства органов власти в рыночную стихию; в период кризиса государство обязано полностью свернуть государственный сектор и распустить экономические министерства","isCorrect":false},{"label":"Б","text":"Это деятельность исключительно муниципальных органов власти по благоустройству территорий, не затрагивающая макроэкономическую, налоговую и кредитную политику","isCorrect":false},{"label":"В","text":"Это система мер по искусственному созданию дефицита товаров и ускорению гиперинфляции ради снижения покупательной способности населения","isCorrect":false},{"label":"Г","text":"Это воздействие государства на микро- и макроэкономические процессы для предупреждения и преодоления кризисов; в кризисные периоды государство выступает главным организатором и координатором антикризисных мер, а роль и масштабы государственного сектора в экономике объективно возрастают","isCorrect":true}],"explanation":"Слайд 2 Лекции 7: государственное антикризисное регулирование — воздействие государства на экономические процессы для предотвращения и преодоления кризисов; в кризис государство выступает организатором и координатором, расширяя масштабы и роль госсектора."},{"id":197,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайд 3","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие конкретные функции входят в правовое, информационное и социальное виды государственного антикризисного регулирования согласно слайду 3 Лекции 7?","options":[{"label":"А","text":"Правовое регулирование занимается выдачей кредитов банкам, информационное — установкой рекламных щитов, а социальное — проведением налоговых проверок субъектов МСП","isCorrect":false},{"label":"Б","text":"Правовое регулирование создает законодательную базу банкротства и порядок экспертизы на фиктивное/преднамеренное банкротство; информационное обеспечивает мониторинг крупных и социально значимых предприятий; социальное включает создание рабочих мест, переобучение и выплату пособий работникам обанкротившихся предприятий","isCorrect":true},{"label":"В","text":"Все три вида регулирования направлены исключительно на подготовку экзаменационных билетов для арбитражных управляющих в высших учебных заведениях","isCorrect":false},{"label":"Г","text":"Информационное регулирование запрещает публикацию статистических данных, а социальное регулирование отменяет выплату пособий по безработице при ликвидации заводов","isCorrect":false}],"explanation":"Слайд 3 Лекции 7 детально раскрывает содержание каждого из 7 видов: правовое (законодательная база, экспертиза фиктивного/преднамеренного банкротства), информационное (учет и мониторинг крупных/социально значимых предприятий), социальное (рабочие места, переобучение, соцзащита уволенных)."},{"id":198,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайд 20","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие пять основных методов государственного антикризисного регулирования на макроуровне систематизированы на слайде 20 Лекции 7?","options":[{"label":"А","text":"Бартерные, спекулятивные, инсайдерские, офшорные и концессионные методы управления частным капиталом","isCorrect":false},{"label":"Б","text":"Методы расчета Z-счета Альтмана, коэффициента Бивера, индекса Лиса, показателя Таффлера и рейтинга Дюрана","isCorrect":false},{"label":"В","text":"Административные (прямое регулирование, лицензирование, квотирование), экономические (налоговые, бюджетные, кредитные рычаги), институциональные (создание инфраструктуры и институтов развития), социально-психологические и правовые методы","isCorrect":true},{"label":"Г","text":"Методы наблюдения, финансового оздоровления, внешнего управления, конкурсного производства и мирового соглашения","isCorrect":false}],"explanation":"Слайд 20 Лекции 7 выделяет систему методов государственного регулирования кризисных ситуаций, сочетающую административные, экономические (финансово-кредитные и фискальные), институциональные и нормативно-правовые рычаги воздействия."},{"id":199,"lectureId":"lec2","lectureTitle":"Лекция 2. Экономические циклы и кризисы в развитии социально-экономических систем","slideRef":"Лекция 2, слайд 26; Лекция 7, слайды 4–5","isFromOriginal40":false,"isMultiSelect":false,"question":"Какая классификация кризисов по масштабу проявления, природе причин и характеру протекания используется в теории антикризисного управления для выбора адекватных инструментов реагирования?","options":[{"label":"А","text":"Все экономические кризисы делятся исключительно на зимние и летние в зависимости от календарного квартала сдачи бухгалтерской отчетности","isCorrect":false},{"label":"Б","text":"Кризисы классифицируются только по количеству статей в законе о банкротстве и размеру фиксированного вознаграждения арбитражного управляющего","isCorrect":false},{"label":"В","text":"Кризисы подразделяются исключительно на биржевые и небиржевые в зависимости от того, котируются ли акции предприятия на фондовом рынке","isCorrect":false},{"label":"Г","text":"По масштабу — общие (макроэкономические) и локальные (отраслевые, микроэкономические); по природе причин — объективные (циклические, природные) и субъективные (управленческие); по характеру протекания — явные (острые) и латентные (скрытые), предсказуемые и внезапные","isCorrect":true}],"explanation":"Слайд 26 Лекции 2 систематизирует типологию кризисов: по масштабам (общие и локальные), по проблематике (макро- и микроэкономические), по причинам (объективные/природные/общественные и субъективные), по предсказуемости и остроте (явные и латентные, острые и затяжные)."},{"id":200,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 8–42","isFromOriginal40":false,"isMultiSelect":false,"question":"Какое обобщающее     const LECTURES = [{"id":"lec1","number":"Лекция 1","title":"Антикризисное управление: сущность и функции","fullTitle":"Лекция 1: Антикризисное управление — сущность и функции (46 слайдов)","shortTitle":"Лекция 1","slidesCount":46,"description":"Понятие, функции, объект, субъекты, цели, задачи, принципы, внешние и внутренние причины кризисов, школы менеджмента и структура антикризисного управления."},{"id":"lec2","number":"Лекция 2","title":"Кризис: сущность, виды и предпосылки возникновения","fullTitle":"Лекция 2: Экономические циклы и кризисы (30 слайдов)","shortTitle":"Лекция 2","slidesCount":30,"description":"Этимология кризиса, циклы Китчина, Жюгляра, Кузнеца и длинные волны Н.Д. Кондратьева, эндогенный механизм циклов, классификация кризисов."},{"id":"lec3","number":"Лекция 3","title":"Банкротство как институт рыночного хозяйства","fullTitle":"Лекция 3: Банкротство как институт рыночного хозяйства (44 слайда)","shortTitle":"Лекция 3","slidesCount":44,"description":"Правовое регулирование (127-ФЗ), признаки банкротства, наблюдение, финансовое оздоровление, внешнее управление, конкурсное производство, мировое соглашение, особые категории должников."},{"id":"lec4","number":"Тема 4","title":"Организационные аспекты деятельности арбитражных управляющих","fullTitle":"Тема 4: Организационные аспекты деятельности арбитражных управляющих (25 слайдов)","shortTitle":"Тема 4","slidesCount":25,"description":"Правовой статус арбитражного управляющего, условия членства в СРО, теоретический экзамен, права и обязанности, фиксированное и процентное вознаграждение."},{"id":"lec5","number":"Лекция 5","title":"Стратегическое и оперативное антикризисное управление. Модели банкротства","fullTitle":"Лекция 5: Стратегическое и оперативное АУ. Модели банкротства (45 слайдов)","shortTitle":"Лекция 5","slidesCount":45,"description":"Оперативное и стратегическое АУ, экспресс-анализ, модели прогнозирования банкротства Альтмана, Лиса, Бивера, Дюрана, Таффлера и Тишоу, Гордона–Спрингейта, Зайцевой, Беликова–Давыдовой."},{"id":"lec6","number":"Лекция 6","title":"Финансовое оздоровление организации","fullTitle":"Лекция 6: Финансовое оздоровление организации (20 слайдов)","shortTitle":"Лекция 6","slidesCount":20,"description":"Этапы процедуры финансового оздоровления, функции административного управляющего, способы сокращения затрат и наращивания доходов, отсрочка и рассрочка налоговых платежей."},{"id":"lec7","number":"Лекция 7","title":"Государственное регулирование кризисных ситуаций","fullTitle":"Лекция 7: Государственное регулирование кризисных ситуаций (22 слайда)","shortTitle":"Лекция 7","slidesCount":22,"description":"Виды государственного антикризисного регулирования, рецепты Дж.М. Кейнса и монетаризм М. Фридмена, фискальная и монетарная политика, налоговые изменения 2025–2026 гг., ключевая ставка ЦБ РФ."}];

    let activeFilter = 'all';
    let isShuffled = false;
    let shuffleSeed = 1;
    let currentIndex = 0;
    let answers = {};

    function getActiveDeck() {
      let list = QUESTIONS;
      if (activeFilter === 'original40') {
        list = QUESTIONS.filter(q => q.isFromOriginal40);
      } else if (activeFilter !== 'all') {
        list = QUESTIONS.filter(q => q.lectureId === activeFilter);
      }
      if (isShuffled) {
        const copy = [...list];
        let s = shuffleSeed * 48271;
        for (let i = copy.length - 1; i > 0; i--) {
          s = (s * 48271) % 2147483647;
          const j = s % (i + 1);
          const tmp = copy[i];
          copy[i] = copy[j];
          copy[j] = tmp;
        }
        return copy;
      }
      return list;
    }

    function buildFeedback(q, chosenLabel) {
      const chosenOpt = q.options.find(o => o.label === chosenLabel) || q.options[0];
      const correctOpt = q.options.find(o => o.isCorrect) || q.options[0];
      const isCorrect = chosenOpt.label === correctOpt.label;
      const meta = LECTURES.find(m => m.id === q.lectureId);
      const lecNum = meta ? meta.number : 'Лекция курса';
      const lecTitle = meta ? meta.title : q.lectureTitle;
      const whereInMaterials = lecNum + ' «' + lecTitle + '» (' + q.slideRef + ')';
      let whyWrong = '';
      if (!isCorrect) {
        whyWrong = 'Вариант ' + chosenOpt.label + ' («' + chosenOpt.text + '») не соответствует положениям учебного курса (' + q.slideRef + '), так как искажает установленные в лекции критерии, сроки или причинно-следственные связи. Согласно материалам ' + lecNum + ', верным является исключительно положение варианта ' + correctOpt.label + ': «' + correctOpt.text + '».';
      }
      return { isCorrect, chosenOpt, correctOpt, whereInMaterials, whyWrong };
    }

    function renderChips() {
      const container = document.getElementById('lecture-chips');
      const items = [
        { id: 'all', label: 'Все вопросы', count: QUESTIONS.length },
        ...LECTURES.map(l => ({
          id: l.id,
          label: l.number,
          count: QUESTIONS.filter(q => q.lectureId === l.id).length
        })),
        { id: 'original40', label: 'Базовые 40', count: 40 }
      ];
      container.innerHTML = items.map(item => {
        const active = activeFilter === item.id;
        const cls = active
          ? 'bg-blue-700 text-white shadow-xs'
          : 'bg-slate-100 text-slate-700 hover:bg-slate-200';
        return '<button onclick="selectFilter(\'' + item.id + '\')" class="min-h-[44px] px-3.5 py-2 rounded-xl text-xs font-semibold whitespace-nowrap flex items-center gap-1.5 shrink-0 cursor-pointer ' + cls + '"><span>' + item.label + '</span><span class="font-mono text-[11px] opacity-80">(' + item.count + ')</span></button>';
      }).join('');
    }

    function renderTrainer() {
      renderChips();
      const deck = getActiveDeck();
      document.getElementById('btn-map').textContent = 'Карта (' + deck.length + ')';

      let correct = 0, wrong = 0;
      deck.forEach(q => {
        const picked = answers[q.id];
        if (picked) {
          const right = q.options.find(o => o.isCorrect);
          if (right && right.label === picked) correct++;
          else wrong++;
        }
      });
      document.getElementById('header-score').textContent = 'Верно: ' + correct + ' · Ошибок: ' + wrong;

      const meta = LECTURES.find(l => l.id === activeFilter);
      document.getElementById('active-filter-caption').textContent = meta
        ? meta.number + ': ' + meta.title
        : activeFilter === 'original40'
        ? 'Базовый перечень из 40 вопросов'
        : 'Все лекции 1–7 (200 вопросов)';

      const container = document.getElementById('question-container');
      if (currentIndex >= deck.length) {
        container.innerHTML = '<div class="bg-white border border-slate-200 rounded-3xl p-6 text-center space-y-4"><h2 class="text-xl font-bold">Раздел пройден!</h2><p class="text-sm text-slate-600">Правильных ответов: ' + correct + ' из ' + deck.length + '</p><button onclick="resetProgress()" class="min-h-[48px] px-6 py-3 rounded-2xl bg-slate-900 text-white text-sm font-semibold cursor-pointer">Пройти заново</button></div>';
        return;
      }

      const q = deck[currentIndex];
      const chosen = answers[q.id];
      const pct = Math.max(3, Math.round(((currentIndex + 1) / deck.length) * 100));
      const lecMeta = LECTURES.find(m => m.id === q.lectureId);

      const optionsHtml = q.options.map(opt => {
        let style = 'bg-slate-50/70 hover:bg-slate-100 border-slate-200 text-slate-900';
        let badge = 'bg-white border-slate-300 text-slate-700';
        if (chosen) {
          if (opt.isCorrect) {
            style = 'bg-emerald-50 border-emerald-500 text-emerald-950 ring-1 ring-emerald-500';
            badge = 'bg-emerald-600 border-emerald-600 text-white';
          } else if (chosen === opt.label) {
            style = 'bg-rose-50 border-rose-500 text-rose-950 ring-1 ring-rose-500';
            badge = 'bg-rose-600 border-rose-600 text-white';
          } else {
            style = 'bg-slate-50/40 border-slate-200 text-slate-400 opacity-75';
          }
        }
        return '<button ' + (chosen ? 'disabled' : 'onclick="pickAnswer(\'' + opt.label + '\')"') + ' class="w-full min-h-[52px] p-3.5 rounded-2xl border text-left transition-all flex items-start gap-3 cursor-pointer ' + style + '"><span class="w-7 h-7 rounded-xl border font-mono text-xs font-bold flex items-center justify-center shrink-0 mt-0.5 ' + badge + '">' + opt.label + '</span><span class="text-sm sm:text-[15px] leading-snug flex-1 font-medium">' + opt.text + '</span></button>';
      }).join('');

      let feedbackHtml = '';
      if (chosen) {
        const fb = buildFeedback(q, chosen);
        const boxTone = fb.isCorrect ? 'bg-emerald-50/85 border-emerald-300' : 'bg-rose-50/85 border-rose-300';
        const titleText = fb.isCorrect
          ? 'Правильно! Верный вариант — ' + fb.correctOpt.label
          : 'Неправильно. Вы выбрали ' + chosen + ', а верный ответ — ' + fb.correctOpt.label;

        feedbackHtml = '<div id="feedback-box" class="scroll-mt-16 rounded-3xl border p-4 sm:p-5 shadow-sm space-y-3 ' + boxTone + '">' +
          '<div class="text-base font-bold">' + titleText + '</div>' +
          '<div class="bg-white/95 border border-slate-200 rounded-2xl p-3 space-y-1"><div class="text-[11px] font-bold text-blue-800 uppercase">В какой лекции об этом говорится:</div><div class="text-xs sm:text-sm font-semibold text-slate-900">' + fb.whereInMaterials + '</div></div>' +
          (!fb.isCorrect ? '<div class="bg-white/95 border border-rose-200 rounded-2xl p-3 space-y-1"><div class="text-[11px] font-bold text-rose-800 uppercase">Почему вариант ' + chosen + ' неправильный:</div><p class="text-xs sm:text-sm text-slate-800 leading-relaxed">' + fb.whyWrong + '</p></div>' : '') +
          '<div class="bg-white/95 border border-slate-200 rounded-2xl p-3 space-y-1"><div class="text-[11px] font-bold text-slate-700 uppercase">Объяснение по лекции (' + q.slideRef + '):</div><p class="text-xs sm:text-sm text-slate-800 leading-relaxed">' + q.explanation + '</p></div>' +
          '<button onclick="nextQuestion()" class="w-full min-h-[50px] px-5 py-3 rounded-2xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-sm sm:text-base flex items-center justify-center gap-2 shadow-md cursor-pointer">К следующему вопросу &rarr;</button>' +
        '</div>';
      }

      container.innerHTML = '<div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">' +
        '<div class="lg:col-span-7 bg-white border border-slate-200 rounded-3xl p-4 sm:p-6 shadow-xs space-y-4">' +
          '<div class="space-y-2">' +
            '<div class="flex items-center justify-between"><span class="text-xs font-mono font-semibold text-slate-600">Вопрос ' + (currentIndex + 1) + ' из ' + deck.length + ' · #' + q.id + ' · ' + (lecMeta ? lecMeta.number : '') + '</span><div class="flex gap-1"><button onclick="prevQuestion()" class="min-h-[34px] px-2.5 rounded-xl border border-slate-200 text-xs">&larr;</button><button onclick="nextQuestion()" class="min-h-[34px] px-2.5 rounded-xl border border-slate-200 text-xs">&rarr;</button></div></div>' +
            '<div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-blue-600 rounded-full" style="width:' + pct + '%"></div></div>' +
          '</div>' +
          '<h2 class="text-base sm:text-lg font-bold text-slate-900 leading-snug">' + q.question + '</h2>' +
          '<div class="space-y-2">' + optionsHtml + '</div>' +
        '</div>' +
        '<div class="lg:col-span-5">' + feedbackHtml + '</div>' +
      '</div>';
    }

    function selectFilter(id) {
      activeFilter = id;
      currentIndex = 0;
      renderTrainer();
    }

    function toggleShuffle() {
      isShuffled = !isShuffled;
      shuffleSeed++;
      currentIndex = 0;
      document.getElementById('btn-shuffle').textContent = isShuffled ? 'Случайно' : 'По порядку';
      renderTrainer();
    }

    function pickAnswer(label) {
      const deck = getActiveDeck();
      const q = deck[currentIndex];
      if (!q || answers[q.id]) return;
      answers[q.id] = label;
      renderTrainer();
      setTimeout(() => {
        const el = document.getElementById('feedback-box');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }, 60);
    }

    function nextQuestion() {
      const deck = getActiveDeck();
      if (currentIndex + 1 <= deck.length) {
        currentIndex++;
        renderTrainer();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function prevQuestion() {
      if (currentIndex > 0) {
        currentIndex--;
        renderTrainer();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function resetProgress() {
      const deck = getActiveDeck();
      deck.forEach(q => delete answers[q.id]);
      currentIndex = 0;
      renderTrainer();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openMapModal() {
      const deck = getActiveDeck();
      const grid = document.getElementById('map-grid');
      grid.innerHTML = deck.map((q, idx) => {
        const picked = answers[q.id];
        const right = q.options.find(o => o.isCorrect);
        let cls = 'bg-slate-100 text-slate-700 border-slate-200';
        if (picked) {
          cls = (right && right.label === picked)
            ? 'bg-emerald-600 text-white border-emerald-600'
            : 'bg-rose-600 text-white border-rose-600';
        }
        return '<button onclick="jumpTo(' + idx + ')" class="min-h-[42px] rounded-xl border font-mono text-xs font-bold flex flex-col items-center justify-center cursor-pointer ' + cls + '"><span>' + (idx + 1) + '</span><span class="text-[9px] opacity-75">#' + q.id + '</span></button>';
      }).join('');
      document.getElementById('map-modal').classList.remove('hidden');
    }

    function closeMapModal() {
      document.getElementById('map-modal').classList.add('hidden');
    }

    function jumpTo(idx) {
      currentIndex = idx;
      closeMapModal();
      renderTrainer();
    }

    function renderBankList() {
      const qStr = (document.getElementById('bank-search').value || '').trim().toLowerCase();
      const filtered = QUESTIONS.filter(q => !qStr || q.question.toLowerCase().includes(qStr) || q.explanation.toLowerCase().includes(qStr) || String(q.id) === qStr);
      document.getElementById('bank-list').innerHTML = filtered.map(q => {
        const right = q.options.find(o => o.isCorrect);
        return '<article class="bg-white border border-slate-200 rounded-2xl p-4 space-y-2.5"><div class="text-xs font-mono text-slate-500">Вопрос #' + q.id + ' · ' + q.slideRef + '</div><h3 class="text-sm sm:text-base font-bold text-slate-900">' + q.question + '</h3><div class="space-y-1.5">' +
          q.options.map(o => '<div class="p-2.5 rounded-xl border text-xs sm:text-sm ' + (o.isCorrect ? 'bg-emerald-50 border-emerald-400 font-semibold text-emerald-950' : 'bg-slate-50 border-slate-200 text-slate-700') + '">' + o.label + ') ' + o.text + '</div>').join('') +
          '</div><div class="text-xs text-slate-600 pt-2 border-t border-slate-100"><strong>Ключ: ' + (right ? right.label : '') + ' · ' + q.lectureTitle + ':</strong> ' + q.explanation + '</div></article>';
      }).join('');
    }

    function switchTab(tab) {
      const isTrainer = tab === 'trainer';
      document.getElementById('view-trainer').classList.toggle('hidden', !isTrainer);
      document.getElementById('view-bank').classList.toggle('hidden', isTrainer);
      if (!isTrainer) renderBankList();
    }

    renderTrainer();
  </script>

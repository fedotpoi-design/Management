  <script>
    const QUESTIONS = [{"id":1,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Модели Таффлера и Альтмана","slideRef":"Лекция 5, слайды 14, 32–34 (Базовый вопрос №1)","isFromOriginal40":true,"isMultiSelect":false,"question":"В чем заключается ключевое методологическое отличие четырехфакторной модели прогнозирования вероятности банкротства Таффлера и Тишоу от классической пятифакторной модели Э. Альтмана?","options":[{"label":"А","text":"В весовых константах (множителях), на которые умножаются расчетные финансовые показатели модели","isCorrect":true},{"label":"Б","text":"В полном отказе от использования показателей бухгалтерского баланса в пользу рыночных котировок","isCorrect":false},{"label":"В","text":"В применении исключительно нефинансовых экспертных оценок качества корпоративного управления","isCorrect":false},{"label":"Г","text":"В расчете итогового индекса только на основании отчета о движении денежных средств за пять лет","isCorrect":false}],"explanation":"Модель Р. Таффлера и Г. Тишоу (1977 г.) апробировала дискриминантный подход Э. Альтмана на выборке британских компаний, выделив собственные частные соотношения и весовые константы (множители 0,53; 0,13; 0,18; 0,16), на которые умножаются показатели."},{"id":2,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Критерии выбора решений","slideRef":"Лекция 1, слайд 11 (Базовый вопрос №2)","isFromOriginal40":true,"isMultiSelect":false,"question":"При проведении официальных процедур банкротства основным специфическим критерием выбора вариантов управленческого решения выступает максимальное удовлетворение требований:","options":[{"label":"А","text":"Учредителей и мажоритарных собственников бизнеса","isCorrect":false},{"label":"Б","text":"Кредиторов организации-должника","isCorrect":true},{"label":"В","text":"Персонала и профсоюзных объединений предприятия","isCorrect":false},{"label":"Г","text":"Потребителей выпускаемой продукции и дистрибьюторов","isCorrect":false}],"explanation":"Согласно слайду 11 Лекции 1, в кризисной ситуации при проведении процедур банкротства основным критерием выступает максимальное удовлетворение требований кредиторов, тогда как интересы собственников и вопросы сохранения организации в целом отходят на второй план."},{"id":3,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Пятифакторная модель Альтмана","slideRef":"Лекция 5, слайд 14 (Базовый вопрос №3)","isFromOriginal40":true,"isMultiSelect":false,"question":"Если компании удастся сохранить неизменными показатели выручки и прибыли при одновременном уменьшении величины внеоборотных активов, то согласно пятифакторной модели прогнозирования банкротства Альтмана вероятность банкротства:","options":[{"label":"А","text":"Возрастает пропорционально темпу сокращения внеоборотных фондов предприятия","isCorrect":false},{"label":"Б","text":"Остается абсолютно неизменной, поскольку внеоборотные активы не влияют на валюту баланса","isCorrect":false},{"label":"В","text":"Снижается (за счет роста рентабельности и оборачиваемости активов и увеличения Z-счета)","isCorrect":true},{"label":"Г","text":"Фиксируется на пороговой отметке 50% вне зависимости от динамики оборотного капитала","isCorrect":false}],"explanation":"Уменьшение внеоборотных активов снижает общую величину активов (знаменатель коэффициентов X1, X2, X3, X5 в пятифакторной модели Альтмана). При неизменной выручке и прибыли значения коэффициентов и итоговый индекс Z растут, а вероятность банкротства снижается."},{"id":4,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Модель У. Бивера","slideRef":"Лекция 5, слайды 23–27 (Базовый вопрос №4)","isFromOriginal40":true,"isMultiSelect":false,"question":"Принципиальное конструктивное отличие модели прогнозирования вероятности банкротства У. Бивера от пятифакторной модели Э. Альтмана заключается в:","options":[{"label":"А","text":"Использовании исключительно показателей рыночной капитализации акций вместо данных баланса","isCorrect":false},{"label":"Б","text":"Ограничении горизонта прогнозирования сроком до трех месяцев до начала ликвидации","isCorrect":false},{"label":"В","text":"Применимости модели только к государственным унитарным и казенным предприятиям","isCorrect":false},{"label":"Г","text":"Отсутствии весовых коэффициентов и единого итогового интегрального значения показателя","isCorrect":true}],"explanation":"В модели У. Бивера рассчитывается система из пяти самостоятельных финансовых коэффициентов, которые сравниваются с нормативными интервалами (трендом до 5 лет), но не сводятся в единый интегральный Z-показатель с весовыми множителями (Лекция 5, слайды 23, 27)."},{"id":5,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","topicTag":"Вознаграждение управляющего","slideRef":"Тема 4, слайд 20 (Базовый вопрос №5)","isFromOriginal40":true,"isMultiSelect":false,"question":"В случае освобождения или отстранения арбитражным судом арбитражного управляющего от исполнения возложенных на него обязанностей в деле о банкротстве вознаграждение ему:","options":[{"label":"А","text":"Выплачивается в размере 50% фиксированной суммы до момента утверждения новой кандидатуры","isCorrect":false},{"label":"Б","text":"Не выплачивается с даты его освобождения или отстранения арбитражным судом","isCorrect":true},{"label":"В","text":"Компенсируется в полном объеме за счет средств компенсационного фонда СРО до конца процедуры","isCorrect":false},{"label":"Г","text":"Удерживается в полном размере за весь предшествующий период работы в данной процедуре","isCorrect":false}],"explanation":"В соответствии со слайдом 20 Темы 4, в случае освобождения или отстранения арбитражным судом арбитражного управляющего от исполнения обязанностей вознаграждение ему не выплачивается с даты его освобождения или отстранения."},{"id":6,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Модели Альтмана и Лиса","slideRef":"Лекция 5, слайды 9, 14, 20–21 (Базовый вопрос №6)","isFromOriginal40":true,"isMultiSelect":false,"question":"Пятифакторную модель прогнозирования вероятности банкротства Э. Альтмана и адаптационную модель Р. Лиса объединяет то, что они:","options":[{"label":"А","text":"Разработаны специально для оценки кредитного риска субъектов малого бизнеса в России","isCorrect":false},{"label":"Б","text":"Не используют показатели оборотного капитала и нераспределенной прибыли организации","isCorrect":false},{"label":"В","text":"Основаны на финансовых показателях, содержащихся в бухгалтерской (финансовой) отчетности предприятий","isCorrect":true},{"label":"Г","text":"Имеют одинаковое пороговое значение точки финансовой устойчивости, равное 0,037","isCorrect":false}],"explanation":"И модель Альтмана, и модель Лиса формируются на основе анализа данных финансовой отчетности предприятий (баланса и отчета о финансовых результатах), при этом модель Лиса использует те же базовые коэффициенты, кроме отношения рыночной стоимости акций к обязательствам."},{"id":7,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","topicTag":"Полномочия в процедурах банкротства","slideRef":"Лекция 3, слайды 19, 21, 30; Тема 4, слайд 21 (Базовый вопрос №7)","isFromOriginal40":true,"isMultiSelect":false,"question":"При реализации каких процедур банкротства арбитражный управляющий непосредственно выполняет полномочия руководителя предприятия-должника (отстраняя прежнее руководство)?","options":[{"label":"А","text":"Внешнего управления (внешний управляющий заменяет прежних руководителей компании); а также наблюдения (временный управляющий лишь наблюдает за сохранностью активов и проводит анализ)","isCorrect":false},{"label":"Б","text":"Конкурсного производства (конкурсный управляющий осуществляет полномочия руководителя должника); а также финансового оздоровления (директор сохраняет полномочия под контролем административного управляющего)","isCorrect":false},{"label":"В","text":"Наблюдения (временный управляющий лишь наблюдает за сохранностью активов и проводит анализ); а также финансового оздоровления (директор сохраняет полномочия под контролем административного управляющего)","isCorrect":false},{"label":"Г","text":"Внешнего управления (внешний управляющий заменяет прежних руководителей компании); а также конкурсного производства (конкурсный управляющий осуществляет полномочия руководителя должника)","isCorrect":true}],"explanation":"При внешнем управлении действующие руководители отстраняются, а полномочия передаются внешнему управляющему (Лекция 3, сл. 19, 21). В конкурсном производстве конкурсный управляющий осуществляет полномочия руководителя должника (Лекция 3, сл. 30). В наблюдении и финансовом оздоровлении руководитель сохраняет должность."},{"id":8,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Модель Беликова–Давыдовой","slideRef":"Лекция 5, слайд 41 (Базовый вопрос №8)","isFromOriginal40":true,"isMultiSelect":false,"question":"Специфический показатель соотношения чистой прибыли и себестоимости реализованной продукции (К4 = Чистая прибыль / Себестоимость) используется в модели прогнозирования вероятности банкротства:","options":[{"label":"А","text":"Беликова–Давыдовой (четырехфакторная иркутская модель)","isCorrect":true},{"label":"Б","text":"Гордона–Спрингейта (канадская четырехфакторная модель)","isCorrect":false},{"label":"В","text":"Дэвида Дюрана (балльная рейтинговая модель кредитоспособности)","isCorrect":false},{"label":"Г","text":"О.П. Зайцевой (шестифакторная модель оценки риска банкротства)","isCorrect":false}],"explanation":"В модели Беликова–Давыдовой (Z = 8,38*K1 + K2 + 0,054*K3 + 0,63*K4) четвертый коэффициент К4 рассчитывается как отношение чистой прибыли к себестоимости (Лекция 5, слайд 41)."},{"id":9,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Сравнение моделей Бивера и Беликова–Давыдовой","slideRef":"Лекция 5, слайды 24–25, 41 (Базовый вопрос №9)","isFromOriginal40":true,"isMultiSelect":false,"question":"Как в системе показателей У. Бивера, так и в четырехфакторной модели Беликова–Давыдовой в обязательном порядке используются:","options":[{"label":"А","text":"Показатели рыночной капитализации обыкновенных и привилегированных акций на бирже","isCorrect":false},{"label":"Б","text":"Коэффициенты соотношения кредиторской и дебиторской задолженности контрагентов","isCorrect":false},{"label":"В","text":"Показатели рентабельности (отражающие отношение чистой прибыли к активам, капиталу или затратам)","isCorrect":true},{"label":"Г","text":"Динамические индексы изменения прибыли отчетного года к базисному периоду за 5 лет","isCorrect":false}],"explanation":"В обеих моделях используются показатели рентабельности, рассчитываемые на основе чистой прибыли: у Бивера — рентабельность активов ROA (ЧП/ВБ), у Беликова–Давыдовой — рентабельность собственного капитала (ЧП/СК) и рентабельность затрат (ЧП/Себестоимость)."},{"id":10,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Двухфакторная модель Альтмана","slideRef":"Лекция 5, слайд 12 (Базовый вопрос №10)","isFromOriginal40":true,"isMultiSelect":false,"question":"Какие из перечисленных финансовых индикаторов НЕ учитывает простая двухфакторная модель прогнозирования вероятности банкротства Э. Альтмана?","options":[{"label":"А","text":"Показатели чистой рентабельности продаж и производства; показатели рентабельности собственного и чистого акционерного капитала; коэффициент текущей ликвидности и удельный вес заемных средств в пассивах (коэффициент капитализации)","isCorrect":false},{"label":"Б","text":"Показатели чистой рентабельности продаж и производства; показатели доходности (рентабельности) совокупных активов предприятия; коэффициент текущей ликвидности и удельный вес заемных средств в пассивах (коэффициент капитализации)","isCorrect":false},{"label":"В","text":"Показатели рентабельности собственного и чистого акционерного капитала; показатели доходности (рентабельности) совокупных активов предприятия; коэффициент текущей ликвидности и удельный вес заемных средств в пассивах (коэффициент капитализации)","isCorrect":false},{"label":"Г","text":"Показатели чистой рентабельности продаж и производства; показатели рентабельности собственного и чистого акционерного капитала; показатели доходности (рентабельности) совокупных активов предприятия","isCorrect":true}],"explanation":"Двухфакторная модель Альтмана (Z = -0,3877 - 1,0736*X1 + 0,579*X2) учитывает только 2 показателя: коэффициент текущей ликвидности (X1) и коэффициент капитализации / удельный вес заемных средств (X2). Она совершенно не учитывает показатели рентабельности и доходности активов или капитала."},{"id":11,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","topicTag":"Финансовое оздоровление","slideRef":"Лекция 3, слайды 4, 15–16 (Базовый вопрос №11)","isFromOriginal40":true,"isMultiSelect":false,"question":"Реабилитационную процедуру банкротства, основной целью которой является создание условий для высвобождения компании от долгового бремени в соответствии с графиком погашения задолженности для восстановления платежеспособности и устойчивости, называют:","options":[{"label":"А","text":"Финансовое оздоровление","isCorrect":true},{"label":"Б","text":"Конкурсное производство","isCorrect":false},{"label":"В","text":"Предварительное наблюдение","isCorrect":false},{"label":"Г","text":"Принудительная ликвидация","isCorrect":false}],"explanation":"Согласно слайду 16 Лекции 3, основной целью процедуры финансового оздоровления является создание условий для высвобождения компании от долгового бремени для восстановления платежеспособности и устойчивости по согласованному графику."},{"id":12,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Система показателей Бивера","slideRef":"Лекция 5, слайды 24, 26 (Базовый вопрос №12)","isFromOriginal40":true,"isMultiSelect":false,"question":"Коэффициент покрытия активов собственными оборотными средствами, рассчитываемый по формуле Ксос = (СК − ВНА) / ВБ, входит в состав модели прогнозирования вероятности банкротства:","options":[{"label":"А","text":"Гордона–Спрингейта","isCorrect":false},{"label":"Б","text":"Уильяма Бивера","isCorrect":true},{"label":"В","text":"Дэвида Дюрана","isCorrect":false},{"label":"Г","text":"Таффлера и Тишоу","isCorrect":false}],"explanation":"Четвертым показателем в пятикомпонентной системе У. Бивера является коэффициент покрытия активов собственными оборотными средствами Ксос = (СК − ВНА) / ВБ, где нормой при низкой вероятности банкротства считается значение выше 0,4 (Лекция 5, слайды 24, 26)."},{"id":13,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","topicTag":"Банкротство сельхозорганизаций","slideRef":"Лекция 3, слайд 41 (Базовый вопрос №13)","isFromOriginal40":true,"isMultiSelect":false,"question":"Какой минимальный совокупный объем неисполненных денежных требований установлен для возбуждения арбитражным судом дела о банкротстве сельскохозяйственной организации согласно материалам курса?","options":[{"label":"А","text":"Не менее 300 тысяч рублей при просрочке исполнения свыше одного месяца","isCorrect":false},{"label":"Б","text":"Не менее 500 тысяч рублей без учета начисленных штрафов и неустоек","isCorrect":false},{"label":"В","text":"Не менее 10 млн рублей при условии введения внешнего наблюдения","isCorrect":false},{"label":"Г","text":"Не менее 3 млн рублей (в классических тестовых заданиях прошлых редакций встречался порог 2,5 млн руб.)","isCorrect":true}],"explanation":"В Лекции 3 (слайд 41) указано, что для возбуждения дела о банкротстве сельскохозяйственной организации требования должны составлять в совокупности не менее 3 млн рублей (в файле с 40 базовыми тестовыми вопросами, вопрос 13, зафиксирован тестовый ключ «2,5»)."},{"id":14,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Факторы двухфакторной модели Альтмана","slideRef":"Лекция 5, слайд 12 (Базовый вопрос №14)","isFromOriginal40":true,"isMultiSelect":false,"question":"Двухфакторная модель Э. Альтмана предполагает, что для экспресс-прогнозирования вероятности банкротства предприятия используются исключительно данные о:","options":[{"label":"А","text":"Текущей ликвидности и структуре капитала (соотношении заемных и собственных средств)","isCorrect":true},{"label":"Б","text":"Маржинальной рентабельности продаж и скорости оборота дебиторской задолженности","isCorrect":false},{"label":"В","text":"Биржевой стоимости акций компании и величине выплаченных за год дивидендов","isCorrect":false},{"label":"Г","text":"Производительности труда основного персонала и износе производственного оборудования","isCorrect":false}],"explanation":"В двухфакторной модели Альтмана используются два показателя: X1 — коэффициент текущей ликвидности (ликвидность) и X2 — коэффициент капитализации / удельный вес заемных средств в пассивах (структура капитала)."},{"id":15,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Субъекты антикризисного управления","slideRef":"Лекция 1, слайды 5–6 (Базовый вопрос №15)","isFromOriginal40":true,"isMultiSelect":false,"question":"Кто из перечисленных лиц НЕ относится к группам субъектов антикризисного управления организацией как управляющей подсистемы?","options":[{"label":"А","text":"Антикризисный менеджер и экономист-финансист (финансовый директор предприятия)","isCorrect":false},{"label":"Б","text":"Исследователь методологии антикризисного управления (теоретик, не реализующий прикладные задачи в фирме)","isCorrect":true},{"label":"В","text":"Владелец (собственник) бизнеса и привлеченные эксперты-консультанты","isCorrect":false},{"label":"Г","text":"Арбитражный управляющий, представители кредиторов и специалисты госоргана по вопросам банкротства","isCorrect":false}],"explanation":"Субъектами АУ являются лица, которые непосредственно реализуют поставленные задачи: владелец бизнеса, антикризисный менеджер, финансовый директор, эксперты-консультанты, госорганы, арбитражный управляющий и представители кредиторов (Лекция 1, сл. 5–6). Исследователь методологии к субъектам управления организацией не относится."},{"id":16,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Объект и предмет АУ","slideRef":"Лекция 1, слайд 5 (Базовый вопрос №16)","isFromOriginal40":true,"isMultiSelect":false,"question":"Кризисные явления в деятельности организации, причины их возникновения и распространения, а также способы их преодоления и предотвращения являются:","options":[{"label":"А","text":"Субъектом антикризисного управления организацией","isCorrect":false},{"label":"Б","text":"Внешним макроэкономическим ограничителем рыночной конъюнктуры","isCorrect":false},{"label":"В","text":"Объектом антикризисного управления организацией","isCorrect":true},{"label":"Г","text":"Фискальным инструментом государственного регулирования банкротств","isCorrect":false}],"explanation":"Согласно слайду 5 Лекции 1, объектом антикризисного управления организацией являются кризисные явления в ее деятельности, причины их возникновения, распространения, а также способы их преодоления и предотвращения."},{"id":17,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Модель Гордона–Спрингейта","slideRef":"Лекция 5, слайды 36–37 (Базовый вопрос №17)","isFromOriginal40":true,"isMultiSelect":false,"question":"Если при прочих равных условиях у фирмы снизятся краткосрочные обязательства, то вероятность ее банкротства, рассчитанная с использованием четырехфакторной модели Гордона–Спрингейта:","options":[{"label":"А","text":"Снижается (так как растут оборотный капитал X1 и отношение прибыли до налогообложения к краткосрочным обязательствам X3)","isCorrect":true},{"label":"Б","text":"Увеличивается за счет падения коэффициента финансового левериджа и роста налоговой нагрузки","isCorrect":false},{"label":"В","text":"Не изменяется, поскольку краткосрочные обязательства не входят ни в один из четырех элементов модели","isCorrect":false},{"label":"Г","text":"Приводит к автоматическому попаданию компании в зону критического риска со значением Z ниже 0,862","isCorrect":false}],"explanation":"В модели Гордона–Спрингейта (Z = 1,03*X1 + 3,07*X2 + 0,66*X3 + 0,4*X4) снижение краткосрочных обязательств увеличивает чистый оборотный капитал (X1) и увеличивает отношение прибыли до налогообложения к краткосрочным обязательствам (X3). В результате Z растет, а вероятность банкротства снижается."},{"id":18,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Границы применимости моделей Альтмана","slideRef":"Лекция 5, слайды 10–19 (Базовый вопрос №18)","isFromOriginal40":true,"isMultiSelect":false,"question":"Семейство Z-моделей Э. Альтмана в силу своей экономической природы и состава бухгалтерских коэффициентов НЕ может быть использовано для оценки вероятности банкротства:","options":[{"label":"А","text":"Крупных публичных акционерных обществ, чьи акции котируются на фондовой бирже","isCorrect":false},{"label":"Б","text":"Физических лиц (граждан, не формирующих корпоративный баланс и капитал)","isCorrect":true},{"label":"В","text":"Непубличных производственных предприятий, акции которых не обращаются на бирже","isCorrect":false},{"label":"Г","text":"Непроизводственных сервисных компаний и субъектов малого и среднего предпринимательства","isCorrect":false}],"explanation":"Модели Альтмана разработаны для корпоративного сектора (публичных АО, непубличных фирм, непроизводственных компаний и МСП) и опираются на показатели корпоративной финансовой отчетности. Они не могут применяться для оценки банкротства физических лиц."},{"id":19,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","topicTag":"Требования к арбитражному управляющему","slideRef":"Тема 4, слайды 4, 6 (Базовый вопрос №19)","isFromOriginal40":true,"isMultiSelect":false,"question":"Какое из перечисленных условий является строго обязательным для гражданина РФ при вступлении в члены саморегулируемой организации (СРО) арбитражных управляющих?","options":[{"label":"А","text":"Наличие ученой степени кандидата экономических или юридических наук","isCorrect":false},{"label":"Б","text":"Опыт работы в должности судьи арбитражного суда не менее пяти лет","isCorrect":false},{"label":"В","text":"Сдача теоретического экзамена по единой программе подготовки арбитражных управляющих","isCorrect":true},{"label":"Г","text":"Одновременное членство как минимум в двух межрегиональных СРО управляющих","isCorrect":false}],"explanation":"Согласно слайду 4 Темы 4, обязательными условиями членства в СРО являются: высшее образование, стаж руководящей работы не менее года, стажировка помощником АУ не менее 2 лет и сдача теоретического экзамена по программе подготовки арбитражных управляющих."},{"id":20,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","topicTag":"Результаты финансового оздоровления","slideRef":"Лекция 3, слайд 18 (Базовый вопрос №20)","isFromOriginal40":true,"isMultiSelect":false,"question":"Какой показатель НЕ относится к числу обязательных финансовых индикаторов, подтверждающих успешность результатов проведенной процедуры финансового оздоровления организации?","options":[{"label":"А","text":"Восстановление платежеспособности должника и соблюдение графика погашения задолженности","isCorrect":false},{"label":"Б","text":"Положительная динамика уровня прибыли и рентабельности деятельности организации","isCorrect":false},{"label":"В","text":"Улучшение структуры капитала, источников финансирования и общей устойчивости на рынке","isCorrect":false},{"label":"Г","text":"Масштабные кадровые изменения и полная смена линейного персонала компании","isCorrect":true}],"explanation":"Согласно слайду 18 Лекции 3, об успешности финансового оздоровления говорят: восстановление платежеспособности, выполнение графика погашения задолженности, уровень прибыли и рентабельность, структура капитала и изменения в операционной деятельности. Кадровые изменения к обязательным результатам финансового оздоровления не относятся."},{"id":21,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","topicTag":"Источники выплаты вознаграждения АУ","slideRef":"Тема 4, слайд 15 (Базовый вопрос №21)","isFromOriginal40":true,"isMultiSelect":false,"question":"По общему правилу, закрепленному в законодательстве о несостоятельности, основное вознаграждение в деле о банкротстве выплачивается арбитражному управляющему за счет средств:","options":[{"label":"А","text":"Федерального бюджета Российской Федерации через органы Росреестра","isCorrect":false},{"label":"Б","text":"Должника (если иное прямо не предусмотрено федеральным законом)","isCorrect":true},{"label":"В","text":"Резервного фонда Центрального банка Российской Федерации","isCorrect":false},{"label":"Г","text":"Личных средств судьи арбитражного суда, рассматривающего дело","isCorrect":false}],"explanation":"На слайде 15 Темы 4 прямо указано: «Вознаграждение в деле о банкротстве выплачивается арбитражному управляющему за счет средств должника, если иное не предусмотрено законом»."},{"id":22,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Цели антикризисного управления","slideRef":"Лекция 1, слайд 7 (Базовый вопрос №22)","isFromOriginal40":true,"isMultiSelect":false,"question":"Приоритетные цели антикризисного управления на уровне отдельного предприятия НЕ включают в себя:","options":[{"label":"А","text":"Недопущение финансовой несостоятельности (банкротства) организации","isCorrect":false},{"label":"Б","text":"Обеспечение выживания компании как базового условия дальнейшего функционирования","isCorrect":false},{"label":"В","text":"Макроэкономическую оптимизацию рынка в целом и устранение рыночной конкуренции в отрасли","isCorrect":true},{"label":"Г","text":"Усиление рыночных позиций организации с учетом сложившихся кризисных условий","isCorrect":false}],"explanation":"Согласно слайду 7 Лекции 1, приоритетными целями антикризисного управления организацией являются выживание компании, недопущение банкротства и усиление рыночных позиций с учетом кризисных условий. «Оптимизация рынка» в цели антикризисного управления предприятием не входит."},{"id":23,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Макроэкономические причины кризиса","slideRef":"Лекция 1, слайды 17–18 (Базовый вопрос №23)","isFromOriginal40":true,"isMultiSelect":false,"question":"Внешние макроэкономические причины наступления кризиса в компании, которые не поддаются прямому управлению со стороны менеджмента фирмы, включают:","options":[{"label":"А","text":"Физический износ и техническое устаревание производственного оборудования в цехах","isCorrect":false},{"label":"Б","text":"Высокий уровень постоянных затрат и излишки товарно-материальных запасов на складе","isCorrect":false},{"label":"В","text":"Слабый внутренний контроль за выполнением бизнес-процессов и кадровую текучесть","isCorrect":false},{"label":"Г","text":"Рост уровня инфляции в экономике и изменения в действующем законодательстве","isCorrect":true}],"explanation":"Согласно слайду 18 Лекции 1, к внешним макроэкономическим причинам относятся: изменения в законодательстве, рост уровня инфляции, динамика доходов населения в регионах и отраслевая структура экономики регионов."},{"id":24,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","topicTag":"Правовой статус арбитражного управляющего","slideRef":"Тема 4, слайд 3 (Базовый вопрос №24)","isFromOriginal40":true,"isMultiSelect":false,"question":"Арбитражный управляющий как субъект профессиональной деятельности, занимающийся частной практикой, вправе заниматься предпринимательской и иной профессиональной деятельностью только при условии, если:","options":[{"label":"А","text":"Такая деятельность не влияет на надлежащее исполнение им обязанностей в деле о банкротстве","isCorrect":true},{"label":"Б","text":"Получено предварительное письменное разрешение от Федеральной налоговой службы РФ","isCorrect":false},{"label":"В","text":"Весь доход от предпринимательской деятельности перечисляется в конкурсную массу должника","isCorrect":false},{"label":"Г","text":"Предпринимательская деятельность ведется исключительно за пределами Российской Федерации","isCorrect":false}],"explanation":"Слайд 3 Темы 4 устанавливает: арбитражный управляющий вправе заниматься иными видами профессиональной деятельности и предпринимательской деятельностью при условии, что такая деятельность не влияет на надлежащее исполнение им обязанностей."},{"id":25,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Динамика коэффициента Бивера","slideRef":"Лекция 5, слайды 22, 24, 27 (Базовый вопрос №25)","isFromOriginal40":true,"isMultiSelect":false,"question":"Устойчивый рост расчетного значения коэффициента У. Бивера Кб = (ЧП + Ам) / (ДО + КО) в динамике за отчетный период свидетельствует о том, что финансовое положение предприятия:","options":[{"label":"А","text":"Ухудшилось вследствие критического наращивания долговой нагрузки","isCorrect":false},{"label":"Б","text":"Перешло в стадию необратимой ликвидации и потери платежеспособности","isCorrect":false},{"label":"В","text":"Улучшилось, а риск наступления банкротства снизился","isCorrect":true},{"label":"Г","text":"Стало полностью зависимым от краткосрочных заемных источников","isCorrect":false}],"explanation":"Коэффициент Бивера показывает отношение суммы чистой прибыли и амортизации к сумме долгосрочных и краткосрочных обязательств. Чем выше его значение (норма выше 0,4), тем быстрее компания способна погасить свои обязательства за счет генерируемого денежного потока, то есть финансовое положение улучшилось."},{"id":26,"lectureId":"lec2","lectureTitle":"Лекция 2. Кризис: сущность, виды и предпосылки возникновения","topicTag":"Теория длинных волн Н.Д. Кондратьева","slideRef":"Лекция 2, слайды 11–12 (Базовый вопрос №26)","isFromOriginal40":true,"isMultiSelect":false,"question":"По мнению выдающегося русского экономиста Н.Д. Кондратьева (в отличие от постулатов неоклассической экономической теории), большую часть времени здоровая динамичная рыночная экономика развивается в условиях:","options":[{"label":"А","text":"Абсолютного статического равновесия спроса и совокупного предложения","isCorrect":false},{"label":"Б","text":"Полного отсутствия циклических колебаний и технологических сдвигов","isCorrect":false},{"label":"В","text":"Директивного централизованного ценообразования без участия рынка","isCorrect":false},{"label":"Г","text":"Неравновесия и нестабильности как ее имманентных внутренних свойств","isCorrect":true}],"explanation":"Согласно слайдам 11 и 12 Лекции 2, Кондратьев первым понял, что волнообразные циклические движения представляют собой процесс отклонений от состояний равновесия, и большую часть времени здоровая динамичная экономика развивается в условиях неравновесия."},{"id":27,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Технология антикризисного управления","slideRef":"Лекция 1, слайд 2 (Базовый вопрос №27)","isFromOriginal40":true,"isMultiSelect":false,"question":"Технология антикризисного управления включает в себя ряд последовательных шагов по реализации механизма воздействия на социально-экономическую систему с целью:","options":[{"label":"А","text":"Предупреждения, смягчения и преодоления кризисов разных типов","isCorrect":true},{"label":"Б","text":"Искусственного инициирования процедуры конкурсного производства","isCorrect":false},{"label":"В","text":"Полного отказа от стратегического планирования в пользу интуитивных решений","isCorrect":false},{"label":"Г","text":"Передачи всех управленческих функций государственным контролирующим органам","isCorrect":false}],"explanation":"На слайде 2 Лекции 1 дано определение: «Технология антикризисного управления включает в себя ряд последовательных шагов по реализации механизма воздействия на систему с целью предупреждения, смягчения и преодоления кризисов разных типов»."},{"id":28,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Интерпретация коэффициента Бивера","slideRef":"Лекция 5, слайды 22, 24 (Базовый вопрос №28)","isFromOriginal40":true,"isMultiSelect":false,"question":"Расчетное значение коэффициента Бивера (Beaver ratio, BR) компании составляет 0,5. Согласно нормативной шкале модели У. Бивера это означает, что:","options":[{"label":"А","text":"Банкротство предприятия вероятно в течение ближайшего 1 года (критический уровень)","isCorrect":false},{"label":"Б","text":"Вероятность банкротства предприятия низкая (показатель выше порогового уровня 0,4)","isCorrect":true},{"label":"В","text":"Банкротство предприятия возможно в горизонте до 5 лет (зона умеренного риска)","isCorrect":false},{"label":"Г","text":"Коэффициент рассчитан некорректно, так как его значение не может превышать 0,17","isCorrect":false}],"explanation":"По таблице интерпретации модели Бивера (Лекция 5, слайд 24), при значении коэффициента Бивера выше 0,4 вероятность банкротства является низкой (от -0,15 до 0,17 — возможно в течение 5 лет; меньше -0,15 — возможно в течение 1 года). Значение 0,5 > 0,4 означает низкую вероятность банкротства."},{"id":29,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","topicTag":"Сроки конкурсного производства","slideRef":"Лекция 3, слайд 29 (Базовый вопрос №29)","isFromOriginal40":true,"isMultiSelect":false,"question":"Какую продолжительность в месяцах имеют основной срок введения конкурсного производства и максимальный дополнительный срок его однократного продления арбитражным судом?","options":[{"label":"А","text":"18 месяцев основной срок + до 6 месяцев продление (18 + 6)","isCorrect":false},{"label":"Б","text":"7 месяцев основной срок + до 5 месяцев продление (7 + 5)","isCorrect":false},{"label":"В","text":"12 месяцев основной срок + до 12 месяцев продление (12 + 12)","isCorrect":false},{"label":"Г","text":"6 месяцев основной срок + до 6 месяцев продление (6 + 6)","isCorrect":true}],"explanation":"Согласно слайду 29 Лекции 3, конкурсное производство вводится на срок до 6 месяцев и может продлеваться не более чем на 6 месяцев (формула 6+6). Срок 18+6 относится к внешнему управлению."},{"id":30,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","topicTag":"Банкротство градообразующих предприятий","slideRef":"Лекция 3, слайды 8, 15, 39–40 (Базовый вопрос №30)","isFromOriginal40":true,"isMultiSelect":false,"question":"Какие начальные и реабилитационные стадии в процедуре банкротства градообразующих предприятий направлены на диагностику и сохранение организации без закрытия бизнеса и потери рабочих мест?","options":[{"label":"А","text":"Наблюдение (обеспечение сохранности активов и объективный анализ финансового состояния); а также финансовое оздоровление (восстановление платежеспособности и сохранение рабочих мест по графику)","isCorrect":true},{"label":"Б","text":"Наблюдение (обеспечение сохранности активов и объективный анализ финансового состояния); а также конкурсное производство с принудительной распродажей имущества на открытых торгах","isCorrect":false},{"label":"В","text":"Финансовое оздоровление (восстановление платежеспособности и сохранение рабочих мест по графику); а также внесудебная ликвидация юридического лица по решению регистрирующего органа","isCorrect":false},{"label":"Г","text":"Конкурсное производство с принудительной распродажей имущества на открытых торгах; а также внесудебная ликвидация юридического лица по решению регистрирующего органа","isCorrect":false}],"explanation":"Наблюдение и финансовое оздоровление (в соответствии с ключом базового вопроса №30 и слайдами 8, 9, 15 Лекции 3) выступают стадиями, позволяющими оценить потенциал компании, сохранить активы и рабочие места и не допустить закрытия социально значимого градообразующего предприятия."},{"id":31,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Функции антикризисного управления","slideRef":"Лекция 1, слайд 4 (Базовый вопрос №31)","isFromOriginal40":true,"isMultiSelect":false,"question":"Выбор и практическое применение системы мер по заблаговременному предупреждению банкротства компании означает реализацию:","options":[{"label":"А","text":"Диагностической функции антикризисного управления","isCorrect":false},{"label":"Б","text":"Превентивной функции антикризисного управления","isCorrect":true},{"label":"В","text":"Корректирующей функции антикризисного управления","isCorrect":false},{"label":"Г","text":"Ликвидационной функции антикризисного управления","isCorrect":false}],"explanation":"Согласно слайду 4 Лекции 1, превентивная функция состоит в выборе и применении системы мер по предупреждению банкротства компании (тогда как диагностическая — в мониторинге, корректирующая — в разработке типовых схем решений, ликвидационная — в уходе с рынка безнадежных фирм)."},{"id":32,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","topicTag":"Мировое соглашение","slideRef":"Лекция 3, слайды 14, 24 (Базовый вопрос №32)","isFromOriginal40":true,"isMultiSelect":false,"question":"Соглашение, которое представляет собой договоренность между сторонами о прекращении или разрешении конфликта (реструктуризации долга) без необходимости полного судебного разбирательства дела и вне рамок конкурсного производства, называют:","options":[{"label":"А","text":"План внешнего управления","isCorrect":false},{"label":"Б","text":"Реестр требований кредиторов","isCorrect":false},{"label":"В","text":"Мировое соглашение","isCorrect":true},{"label":"Г","text":"Инвестиционный налоговый кредит","isCorrect":false}],"explanation":"На слайде 14 Лекции 3 указано: «Мировое соглашение представляет собой договоренность между сторонами о прекращении или разрешении конфликта без необходимости полного разбирательства дела в суде»."},{"id":33,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","topicTag":"Последствия введения наблюдения","slideRef":"Лекция 3, слайды 10, 13 (Базовый вопрос №33)","isFromOriginal40":true,"isMultiSelect":false,"question":"Какие из перечисленных процедур могут быть введены арбитражным судом по итогам завершения стадии наблюдения на основании собранных данных и решения первого собрания кредиторов?","options":[{"label":"А","text":"Введение внешнего управления (при наличии возможности восстановления платежеспособности); а также открытие конкурсного производства (если восстановление платежеспособности невозможно)","isCorrect":true},{"label":"Б","text":"Введение внешнего управления (при наличии возможности восстановления платежеспособности); а также повторное введение процедуры первичного наблюдения на новый семимесячный срок","isCorrect":false},{"label":"В","text":"Открытие конкурсного производства (если восстановление платежеспособности невозможно); а также передача дела из арбитражного суда в третейский суд без согласия кредиторов","isCorrect":false},{"label":"Г","text":"Повторное введение процедуры первичного наблюдения на новый семимесячный срок; а также передача дела из арбитражного суда в третейский суд без согласия кредиторов","isCorrect":false}],"explanation":"Согласно слайдам 10 и 13 Лекции 3, последствиями окончания наблюдения могут быть: финансовое оздоровление (санация), внешнее управление, открытие конкурсного производства или заключение мирового соглашения."},{"id":34,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","topicTag":"Понятие неплатежеспособности","slideRef":"Лекция 3, слайд 5 (Базовый вопрос №34)","isFromOriginal40":true,"isMultiSelect":false,"question":"Прекращение исполнения должником части денежных обязательств или обязанностей по уплате обязательных платежей, вызванное недостаточностью денежных средств, в законодательстве о банкротстве определяется как:","options":[{"label":"А","text":"Дисквалификация должника","isCorrect":false},{"label":"Б","text":"Неплатежеспособность","isCorrect":true},{"label":"В","text":"Конкурсная масса","isCorrect":false},{"label":"Г","text":"Финансовый леверидж","isCorrect":false}],"explanation":"На слайде 5 Лекции 3 приведено точное определение: «Неплатежеспособность — прекращение исполнения должником части денежных обязательств или обязанностей по уплате обязательных платежей, вызванное недостаточностью денежных средств»."},{"id":35,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Критерии в моделях Альтмана","slideRef":"Лекция 5, слайды 12–16 (Базовый вопрос №35)","isFromOriginal40":true,"isMultiSelect":false,"question":"Организации НЕ угрожает банкротство в ближайшее время (она находится в зоне финансовой устойчивости по обеим методикам), если результаты расчетов по двухфакторной и классической пятифакторной моделям Э. Альтмана составили соответственно:","options":[{"label":"А","text":"+2 (для двухфакторной модели) и 1,1 (для пятифакторной модели)","isCorrect":false},{"label":"Б","text":"0 (для двухфакторной модели) и 1,5 (для пятифакторной модели)","isCorrect":false},{"label":"В","text":"−2 (для двухфакторной модели) и 3 (для пятифакторной модели)","isCorrect":true},{"label":"Г","text":"+1,5 (для двухфакторной модели) и 2,2 (для пятифакторной модели)","isCorrect":false}],"explanation":"В двухфакторной модели Альтмана при Z < 0 вероятность банкротства меньше 50% и снижается по мере уменьшения Z (то есть −2 означает низкий риск). В пятифакторной модели Альтмана при Z > 2,9 компания находится в «зеленой» зоне финансовой устойчивости (3 > 2,9). Поэтому пара «−2 и 3» означает отсутствие угрозы банкротства."},{"id":36,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Факторный анализ модели Альтмана","slideRef":"Лекция 5, слайды 14–15 (Модифицированный базовый вопрос №36)","isFromOriginal40":true,"isMultiSelect":false,"question":"Каким образом изменится интегральный индекс Z и оценка риска несостоятельности по пятифакторной модели Э. Альтмана, если предприятие реализует неиспользуемые внеоборотные активы (сократив валюту баланса) при сохранении прежнего объема чистой прибыли, EBIT и выручки?","options":[{"label":"А","text":"Интегральный индекс Z уменьшится, а предприятие переместится в «красную» зону финансового риска","isCorrect":false},{"label":"Б","text":"Интегральный индекс Z станет отрицательным из-за сокращения стоимости основных фондов","isCorrect":false},{"label":"В","text":"Оценка вероятности банкротства не изменится, так как в модели учитываются только пассивы баланса","isCorrect":false},{"label":"Г","text":"Интегральный индекс Z увеличится, вследствие чего вероятность банкротства предприятия снизится","isCorrect":true}],"explanation":"При сокращении неиспользуемых внеоборотных активов уменьшается знаменатель (Total Assets, стр. 1600) в коэффициентах рентабельности и оборачиваемости (X2, X3, X5). При сохранении прибыли и выручки значения этих коэффициентов и итоговый Z-балл возрастают, что снижает вероятность банкротства."},{"id":37,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Количественная школа менеджмента","slideRef":"Лекция 1, слайд 37 (Базовый вопрос №37)","isFromOriginal40":true,"isMultiSelect":false,"question":"Как в рамках инструментария количественной школы менеджмента в антикризисном управлении называют прием разделения процесса разработки управленческих решений на серию последовательных шагов?","options":[{"label":"А","text":"«Матрица аутсорсинга»","isCorrect":false},{"label":"Б","text":"«Дерево целей»","isCorrect":true},{"label":"В","text":"«Кривая Кузнеца»","isCorrect":false},{"label":"Г","text":"«Финансовый леверидж»","isCorrect":false}],"explanation":"Согласно слайду 37 Лекции 1, одним из четырех основных приемов количественной школы в антикризисном менеджменте является «разделение процесса разработки решений на серию последовательных шагов („дерево целей“)»."},{"id":38,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Формула коэффициента Бивера","slideRef":"Лекция 5, слайд 27 (Базовый вопрос №38)","isFromOriginal40":true,"isMultiSelect":false,"question":"Величину каких показателей необходимо знать в числителе формулы для расчета непосредственно коэффициента У. Бивера Кб = (ЧП + Ам) / (ДО + КО)?","options":[{"label":"А","text":"Амортизации, начисленной за отчетный период по данным бухгалтерского учета; а также рыночной капитализации привилегированных акций на закрытие торгов","isCorrect":false},{"label":"Б","text":"Чистой прибыли (убытка) из строки 2400 отчета о финансовых результатах; а также полной производственной себестоимости незавершенного строительства","isCorrect":false},{"label":"В","text":"Амортизации, начисленной за отчетный период по данным бухгалтерского учета; а также чистой прибыли (убытка) из строки 2400 отчета о финансовых результатах","isCorrect":true},{"label":"Г","text":"Рыночной капитализации привилегированных акций на закрытие торгов; а также полной производственной себестоимости незавершенного строительства","isCorrect":false}],"explanation":"Согласно слайду 27 Лекции 5, числитель коэффициента Бивера представляет собой сумму чистой прибыли (ЧП, стр. 2400 ОФР) и начисленной за отчетный период амортизации (Ам), а знаменатель — сумму долгосрочных и краткосрочных обязательств (ДО + КО)."},{"id":39,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление","topicTag":"Информационная база двухфакторной модели Альтмана","slideRef":"Лекция 5, слайд 12 (Базовый вопрос №39)","isFromOriginal40":true,"isMultiSelect":false,"question":"Двухфакторная модель Э. Альтмана предполагает, что оценка вероятности банкротства организации может быть полностью проведена по данным только одной формы отчетности — а именно:","options":[{"label":"А","text":"Отчета о финансовых результатах (строки 2110, 2200, 2300, 2400)","isCorrect":false},{"label":"Б","text":"Отчета об изменениях собственного капитала и резервов компании","isCorrect":false},{"label":"В","text":"Пояснительной записки о среднесписочной численности персонала","isCorrect":false},{"label":"Г","text":"Бухгалтерского баланса (строки 1200, 1300, 1400, 1510, 1520)","isCorrect":true}],"explanation":"Оба коэффициента двухфакторной модели Альтмана — коэффициент текущей ликвидности X1 = ОА / КО и коэффициент капитализации X2 = (ДО + КО) / СК — рассчитываются исключительно по строкам бухгалтерского баланса (Лекция 5, слайд 12)."},{"id":40,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Фактор времени в АУ","slideRef":"Лекция 1, слайд 10 (Базовый вопрос №40)","isFromOriginal40":true,"isMultiSelect":false,"question":"Повышенная чувствительность к фактору времени как важнейшая особенность антикризисного управления связана прежде всего с:","options":[{"label":"А","text":"Возможностью наступления необратимых последствий вплоть до ликвидации организации при несвоевременной реакции","isCorrect":true},{"label":"Б","text":"Необходимостью ежеквартальной сдачи статистической отчетности в территориальные органы Росстата","isCorrect":false},{"label":"В","text":"Фиксированной длительностью больших экономических циклов Н.Д. Кондратьева в 40–60 лет","isCorrect":false},{"label":"Г","text":"Запретом на проведение инвентаризации имущества должника в течение первых трех лет кризиса","isCorrect":false}],"explanation":"На слайде 10 Лекции 1 указано: повышенная чувствительность к фактору времени связана с тем, что при отсутствии своевременной реакции на развитие кризиса возможно наступление необратимых последствий вплоть до ликвидации организации, потери собственности владельцем и потери работы персоналом."},{"id":41,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Сущность антикризисного управления","slideRef":"Лекция 1, слайд 2","isFromOriginal40":false,"isMultiSelect":false,"question":"На какие ресурсные источники в первую очередь должна опираться комплексная система антикризисного управления предприятием при реализации специальной стратегической программы устранения временных затруднений?","options":[{"label":"А","text":"Исключительно на безвозмездные государственные субсидии и целевые дотации регионального бюджета","isCorrect":false},{"label":"Б","text":"Преимущественно на средства компенсационного фонда саморегулируемой организации управляющих","isCorrect":false},{"label":"В","text":"В основном на собственные ресурсы и внутренний потенциал современного менеджмента предприятия","isCorrect":true},{"label":"Г","text":"Только на краткосрочные синдицированные займы коммерческих банков и выпуск облигаций","isCorrect":false}],"explanation":"Согласно определению на слайде 2 Лекции 1, антикризисное управление позволяет устранить временные затруднения, сохранить и преумножить рыночные позиции при любых обстоятельствах, опираясь в основном на собственные ресурсы."},{"id":42,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Шесть функций по стадиям кризиса","slideRef":"Лекция 1, слайд 3","isFromOriginal40":false,"isMultiSelect":false,"question":"Какой перечень из шести видов деятельности выделяется в курсе при ответе на вопрос «что надо делать, чтобы управлять успешно на всех стадиях кризиса»?","options":[{"label":"А","text":"Бухгалтерский учет, налоговое планирование, кадровый аудит, инвентаризация основных средств, эмиссия ценных бумаг, распределение дивидендов","isCorrect":false},{"label":"Б","text":"Наблюдение, финансовое оздоровление, внешнее управление, конкурсное производство, мировое соглашение, упрощенная ликвидация должника","isCorrect":false},{"label":"В","text":"Анализ макросреды, выбор поставщиков, сертификация продукции, расширение дилерской сети, ребрендинг компании, автоматизация склада","isCorrect":false},{"label":"Г","text":"Предкризисное управление, управление в условиях кризиса, управление процессами выхода из кризиса, стабилизация неустойчивых ситуаций, минимизация потерь и упущенных возможностей, своевременное принятие решений","isCorrect":true}],"explanation":"На слайде 3 Лекции 1 выделены ровно шесть функций, определяющих результат АУ на всех стадиях кризиса: предкризисное управление, управление в условиях кризиса, управление процессами выхода из кризиса, стабилизация неустойчивых ситуаций (обеспечение управляемости), минимизация потерь и упущенных возможностей, своевременное принятие решений."},{"id":43,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Диагностическая функция АУ","slideRef":"Лекция 1, слайд 4","isFromOriginal40":false,"isMultiSelect":false,"question":"В чем проявляется диагностическая функция антикризисного управления организацией согласно функциональной классификации курса?","options":[{"label":"А","text":"В систематическом мониторинге финансово-хозяйственной деятельности организации и отслеживании основных тенденций ее изменения","isCorrect":true},{"label":"Б","text":"В разработке типовых схем принятия управленческих решений и внедрении антикризисных технологий","isCorrect":false},{"label":"В","text":"В принудительном выводе с рынка неплатежеспособных предприятий, утративших производственный потенциал","isCorrect":false},{"label":"Г","text":"В формировании очередности удовлетворения требований кредиторов за счет конкурсной массы","isCorrect":false}],"explanation":"Согласно слайду 4 Лекции 1, диагностическая функция проявляется в мониторинге финансово-хозяйственной деятельности организации и отслеживании основных тенденций ее изменения."},{"id":44,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Корректирующая функция АУ","slideRef":"Лекция 1, слайд 4","isFromOriginal40":false,"isMultiSelect":false,"question":"Какая функция антикризисного управления проявляется непосредственно в разработке типовых схем принятия управленческих решений и прикладных антикризисных технологий?","options":[{"label":"А","text":"Ликвидационная функция","isCorrect":false},{"label":"Б","text":"Корректирующая функция","isCorrect":true},{"label":"В","text":"Диагностическая функция","isCorrect":false},{"label":"Г","text":"Фискально-распределительная функция","isCorrect":false}],"explanation":"На слайде 4 Лекции 1 указано: «3. Корректирующая проявляется в разработке типовых схем принятия решений и антикризисных технологий»."},{"id":45,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Ликвидационная функция АУ","slideRef":"Лекция 1, слайд 4","isFromOriginal40":false,"isMultiSelect":false,"question":"Какой двойственный социально-экономический результат предполагает реализация ликвидационной функции антикризисного управления в процедурах банкротства?","options":[{"label":"А","text":"Все без исключения предприятия, допустившие просрочку платежей свыше трех месяцев, подлежат закрытию и распродаже имущества по частям","isCorrect":false},{"label":"Б","text":"Государство полностью берет на себя погашение обязательств любых частных компаний перед коммерческими банками и поставщиками","isCorrect":false},{"label":"В","text":"Убыточные предприятия автоматически освобождаются от уплаты налогов и страховых взносов сроком на пять лет без судебных процедур","isCorrect":false},{"label":"Г","text":"Неплатежеспособные организации, имеющие потенциал выпуска конкурентоспособной продукции, будут восстановлены, а организации, платежеспособность которых восстановить невозможно, покинут рынок","isCorrect":true}],"explanation":"Согласно слайду 4 Лекции 1, ликвидационная функция предполагает, что в результате банкротства неплатежеспособные организации, которые имеют потенциал и способны производить конкурентоспособную продукцию, будут восстановлены, а организации, платежеспособность которых восстановить невозможно, покинут рынок."},{"id":46,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Предмет антикризисного управления","slideRef":"Лекция 1, слайд 5","isFromOriginal40":false,"isMultiSelect":false,"question":"Что в теоретическом аппарате курса определяется как «предмет антикризисного управления» (в отличие от объекта и субъектов)?","options":[{"label":"А","text":"Система отношений, которые возникают по поводу экономических кризисов","isCorrect":true},{"label":"Б","text":"Совокупность производственного оборудования и складских запасов предприятия","isCorrect":false},{"label":"В","text":"Уставный капитал и нераспределенная прибыль акционерного общества","isCorrect":false},{"label":"Г","text":"Перечень должностных инструкций сотрудников финансово-экономической службы","isCorrect":false}],"explanation":"На слайде 5 Лекции 1 дано определение: «Предмет антикризисного управления — система отношений, которые возникают по поводу экономических кризисов»."},{"id":47,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Задачи антикризисного управления","slideRef":"Лекция 1, слайд 8","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие три практических действия необходимо предпринять для решения первоочередной задачи антикризисного управления «Смягчить удар кризиса»?","options":[{"label":"А","text":"Вывести управленческую команду из состояния эмоционального упадка и улучшить ее настрой; разработать и реализовать план нейтрализации кризиса в организации — «потушить основные пожары»; немедленно направить свободные средства в высокорисковые венчурные проекты с горизонтом окупаемости от 10 лет","isCorrect":false},{"label":"Б","text":"Вывести управленческую команду из состояния эмоционального упадка и улучшить ее настрой; разработать и реализовать план нейтрализации кризиса в организации — «потушить основные пожары»; разработать и внедрить инструменты управления, которые помогут организации быстрее приспособиться к новым условиям","isCorrect":true},{"label":"В","text":"Вывести управленческую команду из состояния эмоционального упадка и улучшить ее настрой; разработать и внедрить инструменты управления, которые помогут организации быстрее приспособиться к новым условиям; немедленно направить свободные средства в высокорисковые венчурные проекты с горизонтом окупаемости от 10 лет","isCorrect":false},{"label":"Г","text":"Разработать и реализовать план нейтрализации кризиса в организации — «потушить основные пожары»; разработать и внедрить инструменты управления, которые помогут организации быстрее приспособиться к новым условиям; немедленно направить свободные средства в высокорисковые венчурные проекты с горизонтом окупаемости от 10 лет","isCorrect":false}],"explanation":"На слайде 8 Лекции 1 перечислены ровно три шага для задачи «Смягчить удар кризиса»: вывести команду из эмоционального упадка, реализовать план нейтрализации кризиса («потушить основные пожары») и внедрить инструменты управления для быстрой адаптации к новым условиям."},{"id":48,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Задача сохранения и усиления позиций","slideRef":"Лекция 1, слайд 9","isFromOriginal40":false,"isMultiSelect":false,"question":"Что согласно материалам Лекции 1 требуется от компании для решения второй ключевой задачи антикризисного управления — «Сохранить и усилить позиции компании»?","options":[{"label":"А","text":"Заморозить любые продуктовые изменения, строго придерживаться докризисных регламентов и отказаться от тестирования новых рыночных ниш","isCorrect":false},{"label":"Б","text":"Сократить все расходы на маркетинг и клиентский сервис до нуля, перейдя исключительно на продажу остатков со склада","isCorrect":false},{"label":"В","text":"Выходить за рамки привычной деятельности и мыслить шире, проводить быстрые эксперименты, искать новые возможности кризисного периода и успевать ими пользоваться","isCorrect":true},{"label":"Г","text":"Передать полномочия по принятию стратегических решений внешним аудиторам и представителям комитета кредиторов","isCorrect":false}],"explanation":"Согласно слайду 9 Лекции 1, для сохранения и усиления позиций нужно: выходить за рамки привычной деятельности и мыслить шире; проводить быстрые эксперименты и на основании результатов искать новые возможности, открывающиеся в кризисный период; успевать пользоваться этими возможностями."},{"id":49,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Особенности антикризисного управления","slideRef":"Лекция 1, слайд 12","isFromOriginal40":false,"isMultiSelect":false,"question":"Чем обусловлена такая особенность антикризисного управления, как повышенное внимание к предварительной проработке вариантов управленческих решений и оценке их последствий?","options":[{"label":"А","text":"Тем, что речь идет о существовании организации в перспективе, а набор вариантов решения в условиях кризиса сужен при высоком уровне ответственности перед партнерскими группами","isCorrect":true},{"label":"Б","text":"Тем, что в условиях кризиса у руководства имеется неограниченный запас времени и избыток свободных финансовых ресурсов для длительных академических исследований","isCorrect":false},{"label":"В","text":"Требованием налоговых органов согласовывать каждое внутреннее операционное решение компании с территориальной инспекцией ФНС","isCorrect":false},{"label":"Г","text":"Полным отсутствием какой-либо ответственности менеджмента перед кредиторами, инвесторами и трудовым коллективом в период спада","isCorrect":false}],"explanation":"Слайд 12 Лекции 1 поясняет: в кризисной ситуации значимость каждого бизнес-решения возрастает, так как речь может идти о существовании организации в перспективе, при этом набор вариантов решения может быть сужен при высоком уровне ответственности перед различными партнерскими группами."},{"id":50,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Программно-целевой подход","slideRef":"Лекция 1, слайд 13","isFromOriginal40":false,"isMultiSelect":false,"question":"В чем заключается сущность программно-целевого подхода в технологиях выработки управленческих решений как особенности антикризисного управления?","options":[{"label":"А","text":"Равномерное распыление финансовых средств по всем подразделениям предприятия без выделения приоритетных направлений и без пересмотра утвержденного бюджета","isCorrect":false},{"label":"Б","text":"Концентрация ресурсов на решении антикризисных задач, четкая последовательность действий, создание условий их реализации, постоянный мониторинг, контроль и адаптивность мер","isCorrect":true},{"label":"В","text":"Отказ от формализованных планов и контроля выполнения задач в пользу спонтанного ситуационного реагирования линейных исполнителей","isCorrect":false},{"label":"Г","text":"Разработка единого неизменного пятилетнего плана, корректировка которого запрещена даже при радикальном изменении внешней и внутренней среды","isCorrect":false}],"explanation":"Согласно слайду 13 Лекции 1, программно-целевой подход заключается в концентрации ресурсов на решении антикризисных задач, разработке четкой последовательности действий, создании условий для их реализации, постоянном мониторинге и контроле хода мер и их адаптивности к изменениям условий и ресурсного потенциала."},{"id":51,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Принципы антикризисного управления","slideRef":"Лекция 1, слайды 14–15","isFromOriginal40":false,"isMultiSelect":false,"question":"Какой принцип антикризисного управления означает, что принимаемые руководством антикризисные меры должны строго соответствовать реальному уровню угрозы для бизнеса?","options":[{"label":"А","text":"Принцип постоянной готовности","isCorrect":false},{"label":"Б","text":"Принцип альтернативных действий","isCorrect":false},{"label":"В","text":"Принцип адекватного реагирования","isCorrect":true},{"label":"Г","text":"Принцип приоритета внутренних ресурсов","isCorrect":false}],"explanation":"На слайде 14 Лекции 1 даны определения принципов: профилактики (кризис легче предупредить), постоянной готовности (кризис может сложиться быстро и неожиданно), срочного реагирования (чем раньше принять меры, тем легче остановить кризис), адекватного реагирования (принимаемые меры должны соответствовать уровню угрозы)."},{"id":52,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Принципы комплексности и альтернативности","slideRef":"Лекция 1, слайды 14–15","isFromOriginal40":false,"isMultiSelect":false,"question":"Как в системе принципов антикризисного управления раскрывается содержание «принципа комплексных решений» и «принципа альтернативных действий»?","options":[{"label":"А","text":"Антикризисная программа разрабатывается изолированно от общей стратегии компании и утверждается в единственном безальтернативном варианте","isCorrect":false},{"label":"Б","text":"Любое мероприятие оценивается исключительно по сумме освоенного бюджета без сопоставления с достижением конечной цели","isCorrect":false},{"label":"В","text":"Принятая антикризисная стратегия не допускает внесения каких-либо изменений вплоть до официального закрытия финансового года","isCorrect":false},{"label":"Г","text":"Антикризисная программа должна стать частью общей стратегии развития бизнеса, а утверждение антикризисной стратегии должно представлять собой выбор из нескольких вариантов","isCorrect":true}],"explanation":"Согласно слайдам 14–15 Лекции 1, принцип комплексных решений гласит, что антикризисная программа должна стать частью общей стратегии развития бизнеса, а принцип альтернативных действий — что утверждение антикризисной стратегии лучше осуществлять как выбор из нескольких вариантов."},{"id":53,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Мобильность и динамичность ресурсов","slideRef":"Лекция 1, слайд 16","isFromOriginal40":false,"isMultiSelect":false,"question":"К каким негативным экономическим последствиям для организации ведет снижение мобильности и динамичности в использовании ограниченных ресурсов в условиях постоянной конкурентной борьбы?","options":[{"label":"А","text":"К автоматическому увеличению доли собственного капитала и росту коэффициента текущей ликвидности","isCorrect":false},{"label":"Б","text":"К падению экономической эффективности бизнеса и оттоку капитала в другие сектора экономики и производства","isCorrect":true},{"label":"В","text":"К полному устранению постоянных издержек и росту маржинальной прибыли предприятия","isCorrect":false},{"label":"Г","text":"К переходу предприятия в первый класс кредитоспособности по рейтинговой модели Д. Дюрана","isCorrect":false}],"explanation":"На слайде 16 Лекции 1 указано: «Снижение мобильности и динамичности в использовании ресурсов организацией ведет к падению экономической эффективности бизнеса и оттоку капитала в другие сектора экономики и производства»."},{"id":54,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Классификация причин кризиса","slideRef":"Лекция 1, слайд 17","isFromOriginal40":false,"isMultiSelect":false,"question":"Как в материалах курса подразделяются причины возникновения кризиса на предприятии по отношению к самой организации (внешние и внутренние)?","options":[{"label":"А","text":"Внешние причины: технологические и кадровые; внутренние причины: макроэкономические, климатические и законодательные","isCorrect":false},{"label":"Б","text":"Внешние причины: организационные и финансовые; внутренние причины: инфляционные, демографические и природные","isCorrect":false},{"label":"В","text":"Внешние причины: макроэкономические, рыночные, природные; внутренние причины: технологические, организационные, экономические","isCorrect":true},{"label":"Г","text":"Внешние причины: бухгалтерские и производственные; внутренние причины: рыночные, геополитические и отраслевые","isCorrect":false}],"explanation":"Таблица на слайде 17 Лекции 1 четко разделяет причины кризиса на две колонки: Внешние причины (Макроэкономические, Рыночные, Природные) и Внутренние причины (Технологические, Организационные, Экономические)."},{"id":55,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Рыночные и природные причины кризиса","slideRef":"Лекция 1, слайды 18–20","isFromOriginal40":false,"isMultiSelect":false,"question":"В чем состоит различие в возможностях компании воздействовать на макроэкономические, рыночные и природные внешние причины кризиса согласно Лекции 1?","options":[{"label":"А","text":"Природные причины полностью предотвращаются маркетинговыми кампаниями до их наступления, а рыночные причины вообще не требуют реакции со стороны бизнеса","isCorrect":false},{"label":"Б","text":"Макроэкономические причины легко устраняются решением совета директоров фирмы, тогда как внутренние технологические причины не поддаются управлению","isCorrect":false},{"label":"В","text":"Все три группы внешних причин полностью контролируются финансовым директором предприятия с помощью введения режима бережливого производства","isCorrect":false},{"label":"Г","text":"Макроэкономические причины не поддаются управлению (компания лишь перестраивает деятельность); на рыночные причины компания уже может воздействовать через антикризисные мероприятия; с природными причинами компания может бороться только после того, как они проявятся","isCorrect":true}],"explanation":"Согласно слайдам 18–20 Лекции 1: макроэкономические причины не поддаются управлению (компания может только реагировать, перестраивая деятельность); на кризисные явления от рыночных причин компания уже может воздействовать через разработку антикризисных мероприятий; природные причины воздействуют более целенаправленно (на сезонный спрос), и бороться с их влиянием компания может только после того, как они проявятся."},{"id":56,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Внутренние технологические причины","slideRef":"Лекция 1, слайд 21","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие из перечисленных факторов относятся к группе внутренних технологических причин кризиса, влияние которых можно предупредить планом антикризисных мероприятий?","options":[{"label":"А","text":"Физический износ или техническое устаревание производственного оборудования; несоответствие характеристик выпускаемой продукции требованиям рынка и снижение ее качества; неэффективная ценовая модель сбыта продукции и сбои в функционировании бизнес-процессов предприятия","isCorrect":true},{"label":"Б","text":"Физический износ или техническое устаревание производственного оборудования; несоответствие характеристик выпускаемой продукции требованиям рынка и снижение ее качества; изменение федерального налогового законодательства и отраслевой структуры экономики региона","isCorrect":false},{"label":"В","text":"Физический износ или техническое устаревание производственного оборудования; неэффективная ценовая модель сбыта продукции и сбои в функционировании бизнес-процессов предприятия; изменение федерального налогового законодательства и отраслевой структуры экономики региона","isCorrect":false},{"label":"Г","text":"Несоответствие характеристик выпускаемой продукции требованиям рынка и снижение ее качества; неэффективная ценовая модель сбыта продукции и сбои в функционировании бизнес-процессов предприятия; изменение федерального налогового законодательства и отраслевой структуры экономики региона","isCorrect":false}],"explanation":"На слайде 21 Лекции 1 к внутренним технологическим причинам отнесены: физический износ или техническое устаревание производственного оборудования; несоответствие характеристик выпускаемой продукции требованиям рынка; снижение качества выпускаемой продукции; неэффективная ценовая модель сбыта продукции; сбои в функционировании бизнес-процессов предприятия."},{"id":57,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Внутренние организационные причины","slideRef":"Лекция 1, слайд 22","isFromOriginal40":false,"isMultiSelect":false,"question":"Какой перечень факторов образует группу внутренних организационных причин кризиса компании согласно материалам Лекции 1?","options":[{"label":"А","text":"Аномально теплая зима, холодное лето, снижение сезонного спроса на прохладительные напитки и товары для пляжного отдыха","isCorrect":false},{"label":"Б","text":"Рост ключевой ставки Центрального банка, повышение базовой ставки НДС до 22% и введение прогрессивной шкалы НДФЛ","isCorrect":false},{"label":"В","text":"Ошибки в управлении, слабый контроль за выполнением бизнес-процессов и технологических операций, неэффективная кадровая политика, отсутствие целеполагания и бизнес-планирования","isCorrect":true},{"label":"Г","text":"Высокий уровень солнечной активности, демографические волны С. Кузнеца и колебания мировых запасов золота по Дж. Китчину","isCorrect":false}],"explanation":"Согласно слайду 22 Лекции 1, к организационным причинам относятся: ошибки в управлении; слабый контроль за выполнением бизнес-процессов и технологических операций; неэффективная кадровая политика; отсутствие целеполагания и бизнес-планирования деятельности компании."},{"id":58,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Внутренние экономические причины","slideRef":"Лекция 1, слайд 23","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие факторы относятся к внутренним экономическим причинам, способствующим началу кризиса в организации?","options":[{"label":"А","text":"Высокий уровень постоянных затрат и падение рентабельности бизнеса компании; необеспеченность финансирования внеоборотных средств за счет собственного капитала и несоблюдение баланса задолженностей; появление на рынке новых иностранных конкурентов и изменение покупательских предпочтений населения","isCorrect":false},{"label":"Б","text":"Высокий уровень постоянных затрат и падение рентабельности бизнеса компании; излишки товарно-материальных запасов и рост просроченной дебиторской задолженности; появление на рынке новых иностранных конкурентов и изменение покупательских предпочтений населения","isCorrect":false},{"label":"В","text":"Необеспеченность финансирования внеоборотных средств за счет собственного капитала и несоблюдение баланса задолженностей; излишки товарно-материальных запасов и рост просроченной дебиторской задолженности; появление на рынке новых иностранных конкурентов и изменение покупательских предпочтений населения","isCorrect":false},{"label":"Г","text":"Высокий уровень постоянных затрат и падение рентабельности бизнеса компании; необеспеченность финансирования внеоборотных средств за счет собственного капитала и несоблюдение баланса задолженностей; излишки товарно-материальных запасов и рост просроченной дебиторской задолженности","isCorrect":true}],"explanation":"На слайде 23 Лекции 1 перечислены внутренние экономические причины кризиса: высокий уровень постоянных затрат; необеспеченность финансирования внеоборотных средств за счет собственного капитала; несоблюдение баланса задолженностей; излишки запасов ТМЦ; рост просроченной дебиторской задолженности; падение рентабельности бизнеса."},{"id":59,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Прямые и косвенные причины кризиса","slideRef":"Лекция 1, слайды 24–25","isFromOriginal40":false,"isMultiSelect":false,"question":"Как в концепции цепной реакции причин кризиса соотносятся между собой прямые (первого уровня) и косвенные причины кризисной ситуации?","options":[{"label":"А","text":"Прямые причины проявляются непосредственно и явно (например, снижение доли рынка), а косвенные влияют опосредованно (например, проблемы с качеством из-за устаревшей технологии и плохого обслуживания оборудования) и на последующих уровнях анализа сами выступают прямыми причинами","isCorrect":true},{"label":"Б","text":"Прямые причины никогда не поддаются количественному измерению, а косвенные причины всегда лежат на поверхности и фиксируются в первой строке бухгалтерского баланса","isCorrect":false},{"label":"В","text":"Косвенные причины возникают исключительно во внешней макроэкономической среде, а прямые причины связаны только с природно-климатическими катаклизмами","isCorrect":false},{"label":"Г","text":"Прямые и косвенные причины полностью изолированы друг от друга и никогда не образуют причинно-следственных цепочек второго и третьего уровней","isCorrect":false}],"explanation":"Согласно слайдам 24–25 Лекции 1, прямые причины проявляются непосредственно и явно (первый уровень, например, снижение доли рынка в %), а косвенные влияют опосредованно, обнаруживаются при детальном анализе и на последующих уровнях становятся прямыми (снижение доли рынка <- проблемы с качеством <- устаревшая технология <- ненадлежащее обслуживание оборудования)."},{"id":60,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Симптомы кризиса в системе управления","slideRef":"Лекция 1, слайд 26","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие проявления в организации выступают симптомами кризиса, вызванного такой причиной, как «недостаточная компетентность руководства» (отсутствие стратегического видения, неясные цели, отсутствие регламентов)?","options":[{"label":"А","text":"Перепроизводство готовой продукции, высокий уровень производственного травматизма и постоянные поломки технологических линий в цехах","isCorrect":false},{"label":"Б","text":"Запоздалые реакции на изменения среды, нарушение единоначалия и субординации, пассивность менеджеров, безынициативность сотрудников, невыполнение приказов, нарушения деловой этики, конфликты и увольнение ведущих сотрудников","isCorrect":true},{"label":"В","text":"Увеличение сроков оборачиваемости дебиторской задолженности, низкая клиентская конверсия и неузнаваемость товарного знака фирмы на рынке","isCorrect":false},{"label":"Г","text":"Кассовые разрывы, налоговые проверки, доначисления пеней и отказы коммерческих банков в предоставлении инвестиционных кредитов","isCorrect":false}],"explanation":"На слайде 26 Лекции 1 в таблице «Причины и симптомы кризиса в системе управления организацией» при недостаточной компетентности руководства указаны симптомы: запоздалые реакции на изменения среды, нарушение единоначалия и субординации, пассивность у менеджеров, безынициативность сотрудников, неуважение к руководству, невыполнение приказов, нарушения деловой этики, конфликты и увольнение ведущих сотрудников."},{"id":61,"lectureId":"lec1","lectureTitle":"Лекция 1. Антикризисное управление: сущность и функции","topicTag":"Нарушение организационной иерархии","slideRef":"Лекция 1, слайд 27","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие специфические симптомы проявляются в организации, если причиной кризиса в системе управления являются нарушение организационной иерарх

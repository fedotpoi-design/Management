ions":[{"label":"А","text":"Решение считается принятым при условии, что за него проголосовали все кредиторы по обязательствам, обеспеченным залогом имущества должника; определение суда об утверждении мирового соглашения имеет силу исполнительного листа","isCorrect":true},{"label":"Б","text":"Достаточно согласия 50% залоговых кредиторов, а мировое соглашение носит характер джентльменского меморандума и допускает свободный односторонний отказ любой стороны","isCorrect":false},{"label":"В","text":"Залоговые кредиторы не имеют права голоса по вопросу мирового соглашения, а утверждение соглашения осуществляется нотариусом без участия арбитражного суда","isCorrect":false},{"label":"Г","text":"Мировое соглашение может быть заключено только после полной распродажи конкурсной массы при согласии трети конкурсных кредиторов","isCorrect":false}],"explanation":"Слайды 24–28 Лекции 3: за мировое соглашение должны проголосовать ВСЕ кредиторы по обязательствам, обеспеченным залогом имущества должника; утверждение судом придает соглашению силу исполнительного листа, а односторонний отказ от исполнения вступившего в силу соглашения не допускается."},{"id":124,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 29–31","isFromOriginal40":false,"isMultiSelect":false,"question":"На какой срок вводится конкурсное производство и в какие сроки конкурсный управляющий обязан уведомить работников о предстоящем увольнении, а также прекратить производство по решению собрания кредиторов?","options":[{"label":"А","text":"Вводится сроком до 18 месяцев; работников уведомляют за 3 дня до закрытия предприятия, а производство останавливается немедленно в день вынесения судебного акта","isCorrect":false},{"label":"Б","text":"Вводится сроком до 6 месяцев (с возможным продлением до 6 месяцев); работников необходимо уведомить не позднее чем в течение 1 месяца с даты введения конкурсного производства, а прекратить производство — в пределах 3 месяцев с даты решения собрания кредиторов","isCorrect":true},{"label":"В","text":"Вводится сроком на 2 года без права продления; уведомление работников производится за 6 месяцев, а остановка цехов допускается даже при риске техногенных катастроф","isCorrect":false},{"label":"Г","text":"Вводится сроком до 7 месяцев; работников уведомляют в течение 15 дней, а решение о прекращении производства принимает единолично главный бухгалтер должника","isCorrect":false}],"explanation":"Слайды 29–31 Лекции 3: конкурсное производство вводится до 6 мес. (продление до 6 мес.); уведомить работников об увольнении — не позднее 1 месяца с даты введения; прекратить хозяйственную деятельность по решению собрания кредиторов — в пределах 3 месяцев (если это не грозит техногенными/экологическими катастрофами или остановкой соцобъектов)."},{"id":125,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 32–34","isFromOriginal40":false,"isMultiSelect":false,"question":"Каков порядок учета заложенного имущества и реализации социально значимых объектов (объектов культурного наследия, коммунальной инфраструктуры, соглашений ГЧП/МЧП) в составе конкурсной массы?","options":[{"label":"А","text":"Заложенное имущество полностью исключается из конкурсной массы без проведения оценки, а социально значимые объекты передаются кредиторам первой очереди по остаточной балансовой стоимости","isCorrect":false},{"label":"Б","text":"Все объекты культурного наследия и школы подлежат закрытию и продаже на открытом аукционе на снос без сохранения целевого назначения","isCorrect":false},{"label":"В","text":"Заложенное имущество реализуется без согласия залогодержателя по свободным ценам прямым договором купли-продажи в течение 15 дней","isCorrect":false},{"label":"Г","text":"Заложенное имущество учитывается отдельно и подлежит обязательной оценке, а социально значимые объекты и объекты культурного наследия продаются путем проведения торгов в форме конкурса с обязательством покупателя соблюдать назначение и регулируемые цены (тарифы)","isCorrect":true}],"explanation":"Слайды 32–34 Лекции 3: в составе конкурсной массы отдельно учитывается и подлежит обязательной оценке имущество, являющееся предметом залога; социально значимые объекты, объекты культурного наследия и объекты ГЧП/МЧП продаются на торгах в форме конкурса с условием сохранения назначения и регулируемых тарифов."},{"id":126,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 35–36","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие расходы погашаются вне очереди преимущественно перед любыми другими требованиями кредиторов по текущим платежам и сколько всего очередей текущих платежей установлено законом?","options":[{"label":"А","text":"Преимущественно перед любыми другими текущими платежами погашаются расходы на проведение мероприятий по недопущению техногенных и (или) экологических катастроф либо гибели людей на опасных объектах, а сами текущие платежи делятся на 5 очередей","isCorrect":true},{"label":"Б","text":"Преимущественно перед всеми текущими платежами выплачиваются «золотые парашюты» генеральному директору и главному бухгалтеру, а текущие платежи делятся на 3 очереди","isCorrect":false},{"label":"В","text":"Преимущественно перед всеми текущими платежами погашаются требования владельцев бессрочных облигаций, а текущие платежи делятся на 4 очереди","isCorrect":false},{"label":"Г","text":"Преимущественно перед всеми текущими платежами оплачиваются рекламные и имиджевые контракты должника, а текущие платежи делятся на 7 очередей","isCorrect":false}],"explanation":"Слайды 35–36 Лекции 3: вне очереди перед любыми другими текущими платежами погашаются расходы на недопущение техногенных/экологических катастроф или гибели людей; сами текущие платежи удовлетворяются в 5 очередей."},{"id":127,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 35–36","isFromOriginal40":false,"isMultiSelect":false,"question":"Как распределяются требования между первой, второй, третьей и четвертой очередями текущих платежей при банкротстве организации?","options":[{"label":"А","text":"1-я очередь — коммунальные и энергетические платежи; 2-я — судебные расходы и вознаграждение управляющего; 3-я — заработная плата персонала; 4-я — налог на прибыль и НДС","isCorrect":false},{"label":"Б","text":"1-я очередь — судебные расходы, вознаграждение арбитражного управляющего и обязательных привлеченных лиц; 2-я — оплата труда и выходные пособия работников (после принятия заявления); 3-я — оплата необязательных привлеченных управляющим лиц; 4-я — эксплуатационные платежи (коммунальные и энергетические)","isCorrect":true},{"label":"В","text":"1-я очередь — вред жизни и здоровью; 2-я — авторские вознаграждения; 3-я — залоговые кредиторы; 4-я — субординированные облигационеры","isCorrect":false},{"label":"Г","text":"1-я очередь — оплата необязательных консультантов; 2-я — эксплуатационные платежи; 3-я — судебные издержки; 4-я — заработная плата работников","isCorrect":false}],"explanation":"Слайд 35 Лекции 3 четко фиксирует 5 очередей текущих платежей: 1-я — судебные расходы, вознаграждение АУ и обязательных специалистов; 2-я — оплата труда и выходные пособия после принятия заявления; 3-я — привлеченные АУ необязательные лица; 4-я — эксплуатационные (коммунальные, энергетические) платежи; 5-я — иные текущие платежи."},{"id":128,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 36–38","isFromOriginal40":false,"isMultiSelect":false,"question":"В каком порядке удовлетворяются требования руководителей, их заместителей и главных бухгалтеров о выплате выходных пособий сверх минимального установленного законом размера, а также требования владельцев облигаций без срока погашения?","options":[{"label":"А","text":"Оба вида требований приравниваются ко второй очереди текущих платежей и выплачиваются в первоочередном порядке одновременно с зарплатой рядовых рабочих","isCorrect":false},{"label":"Б","text":"Сверхнормативные пособия директоров включаются в первую очередь реестровых требований, а требования владельцев бессрочных облигаций — во вторую очередь текущих платежей","isCorrect":false},{"label":"В","text":"Сверхнормативные выходные пособия топ-менеджмента не относятся к текущим платежам и удовлетворяются после 3-й очереди реестровых требований, а требования владельцев бессрочных облигаций — после удовлетворения требований всех иных кредиторов","isCorrect":true},{"label":"Г","text":"Указанные требования аннулируются автоматически в день введения процедуры наблюдения и не подлежат включению ни в какие расчеты","isCorrect":false}],"explanation":"Слайды 36 и 38 Лекции 3: сверхминимальные выплаты руководителям/главбухам не относятся к текущим платежам и удовлетворяются после 3-й очереди реестровых кредиторов; требования владельцев облигаций без срока погашения — после удовлетворения всех иных кредиторов."},{"id":129,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайд 39","isFromOriginal40":false,"isMultiSelect":false,"question":"Кто обязательно признается лицом, участвующим в деле о банкротстве градообразующей организации, и кто дополнительно может быть привлечен арбитражным судом?","options":[{"label":"А","text":"Обязательным участником признается соответствующий орган местного самоуправления, а также судом могут быть привлечены федеральные органы исполнительной власти и органы исполнительной власти субъекта РФ","isCorrect":true},{"label":"Б","text":"Обязательным участником признается исключительно Центральный банк РФ, а органы местного самоуправления не допускаются к участию в процессе","isCorrect":false},{"label":"В","text":"Обязательным участником признается только профсоюзный комитет предприятия без участия государственных и муниципальных органов власти","isCorrect":false},{"label":"Г","text":"Обязательным участником выступает Международный валютный фонд и Торгово-промышленная палата соответствующего федерального округа","isCorrect":false}],"explanation":"Слайд 39 Лекции 3: при рассмотрении дела о банкротстве градообразующей организации лицом, участвующим в деле, признается соответствующий орган местного самоуправления; также могут быть привлечены федеральные и региональные органы исполнительной власти."},{"id":130,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 40–41","isFromOriginal40":false,"isMultiSelect":false,"question":"По какому критерию выручки организация признается сельскохозяйственной для целей банкротства и каковы специальные признаки ее банкротства (сумма и срок просрочки)?","options":[{"label":"А","text":"Выручка от реализации сельхозпродукции составляет не менее 75% общей суммы выручки; размер требований — не менее 2 млн рублей при неисполнении не менее 6 месяцев","isCorrect":false},{"label":"Б","text":"Выручка от реализации произведенной или произведенной и переработанной сельхозпродукции составляет не менее 50% общей суммы выручки; размер требований — не менее 3 млн рублей при неисполнении не менее 3 месяцев","isCorrect":true},{"label":"В","text":"Выручка от реализации сельхозпродукции составляет не менее 30% общей суммы выручки; размер требований — не менее 1 млн рублей при неисполнении не менее 1 месяца","isCorrect":false},{"label":"Г","text":"Выручка от реализации сельхозпродукции составляет не менее 90% общей суммы выручки; размер требований — не менее 5 млн рублей при неисполнении не менее 12 месяцев","isCorrect":false}],"explanation":"Слайды 40–41 Лекции 3: сельхозорганизация — юрлицо, у которого выручка от реализации произведенной (и переработанной) сельхозпродукции составляет не менее 50% общей выручки; заявление принимается при требованиях не менее 3 млн руб., не исполненных не менее 3 месяцев."},{"id":131,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 40–41","isFromOriginal40":false,"isMultiSelect":false,"question":"Как учитывается фактор сезонности при введении финансового оздоровления и внешнего управления в сельскохозяйственной организации и на сколько может быть продлено внешнее управление в случае стихийных бедствий или эпизоотий?","options":[{"label":"А","text":"Сезонность не влияет на стандартные сроки процедур, а в случае эпизоотий сельхозпредприятие подлежит немедленной ликвидации в течение 30 дней","isCorrect":false},{"label":"Б","text":"Внешнее управление в сельском хозяйстве вводится строго на 7 месяцев, а при засухе или наводнении продлевается не более чем на 15 дней","isCorrect":false},{"label":"В","text":"Процедуры вводятся на срок до окончания соответствующего периода сельхозработ с учетом времени на реализацию продукции (максимальный срок внешнего управления — 2 года и 3 месяца), а при стихийных бедствиях или эпизоотиях срок внешнего управления может быть продлен еще не более чем на 1 год","isCorrect":true},{"label":"Г","text":"Финансовое оздоровление вводится на 10 лет без графика погашения долгов, а внешнее управление для аграрных предприятий законом запрещено","isCorrect":false}],"explanation":"Слайды 40–41 Лекции 3: при анализе учитываются сезонность и природно-климатические условия; внешнее управление вводится до окончания сельхозработ + время на продажу продукции (предельный срок с учетом этого — до 2 лет 3 мес.), а при падеже скота, стихийных бедствиях и эпизоотиях может быть продлено не более чем на 1 год."},{"id":132,"lectureId":"lec3","lectureTitle":"Лекция 3. Банкротство как институт рыночного хозяйства","slideRef":"Лекция 3, слайды 42–44","isFromOriginal40":false,"isMultiSelect":false,"question":"При каких признаках (срок неисполнения обязательств и минимальная сумма требований) стратегические предприятия и организации (включая предприятия ОПК) считаются неспособными удовлетворить требования кредиторов?","options":[{"label":"А","text":"Если обязательства не исполнены в течение 3 месяцев, а совокупная сумма требований составляет не менее 2 миллионов рублей (как для обычных юрлиц)","isCorrect":false},{"label":"Б","text":"Если обязательства не исполнены в течение 12 месяцев, а совокупная сумма требований превышает 100 миллионов рублей","isCorrect":false},{"label":"В","text":"Если обязательства не исполнены в течение 1 месяца, а совокупная сумма требований составляет не менее 500 тысяч рублей","isCorrect":false},{"label":"Г","text":"Если обязательства не исполнены в течение 6 месяцев с даты, когда они должны были быть исполнены, а совокупная сумма требований составляет не менее 3 миллионов рублей","isCorrect":true}],"explanation":"Слайды 42–43 Лекции 3: стратегическое предприятие считается неспособным удовлетворить требования кредиторов, если обязательства не исполнены в течение 6 месяцев, а сумма требований составляет не менее 3 млн рублей."},{"id":133,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайды 2–5","isFromOriginal40":false,"isMultiSelect":false,"question":"Кто по закону может быть арбитражным управляющим и во скольких саморегулируемых организациях (СРО) он вправе состоять одновременно?","options":[{"label":"А","text":"Любое российское или иностранное юридическое лицо (консалтинговая или аудиторская фирма), аккредитованное одновременно в трех СРО","isCorrect":false},{"label":"Б","text":"Гражданин Российской Федерации, занимающийся частной практикой и являющийся членом только одной саморегулируемой организации арбитражных управляющих","isCorrect":true},{"label":"В","text":"Штатный государственный служащий Федеральной налоговой службы или Росреестра, назначаемый по совместительству без членства в СРО","isCorrect":false},{"label":"Г","text":"Гражданин любого государства ЕАЭС со средним профессиональным образованием, состоящий как минимум в двух региональных СРО","isCorrect":false}],"explanation":"Слайды 2–3 Темы 4: арбитражным управляющим признается гражданин РФ, являющийся членом одной из СРО арбитражных управляющих (может быть членом только одной СРО) и являющийся субъектом профессиональной деятельности (частная практика)."},{"id":134,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайды 3–5","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие минимальные требования к стажу руководящей работы и стажировке в качестве помощника арбитражного управляющего установлены в качестве обязательных условий членства в СРО?","options":[{"label":"А","text":"Наличие стажа работы на руководящих должностях не менее чем 5 лет и стажировки в качестве помощника арбитражного управляющего не менее чем 6 месяцев","isCorrect":false},{"label":"Б","text":"Наличие стажа работы главным бухгалтером не менее чем 3 года без прохождения стажировки в качестве помощника управляющего","isCorrect":false},{"label":"В","text":"Наличие стажа работы на руководящих должностях не менее чем 1 год и стажировки в качестве помощника арбитражного управляющего в деле о банкротстве не менее чем 2 года (если более высокие требования не предусмотрены стандартами СРО)","isCorrect":true},{"label":"Г","text":"Наличие стажа государственной службы не менее чем 2 года и стажировки в качестве помощника судьи арбитражного суда не менее чем 1 год","isCorrect":false}],"explanation":"Слайд 3 Темы 4: обязательные условия членства в СРО включают высшее образование, стаж работы на руководящих должностях не менее чем год и стажировку в качестве помощника АУ в деле о банкротстве не менее чем два года."},{"id":135,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайд 6","isFromOriginal40":false,"isMultiSelect":false,"question":"Каковы правила подготовки и сдачи теоретического экзамена по программе подготовки арбитражных управляющих (Постановление Правительства РФ № 308)?","options":[{"label":"А","text":"Обучение длится 180 дней по 7 модулям; экзамен проводится в форме компьютерного тестирования в ФНС России с порогом прохождения 50% правильных ответов","isCorrect":false},{"label":"Б","text":"Обучение длится 30 дней; экзамен принимается единолично председателем СРО в письменной форме при пороге сдачи 65% правильных ответов","isCorrect":false},{"label":"В","text":"Обучение проводится заочно в течение 14 дней; билеты составляет арбитражный суд субъекта РФ, а проходной балл составляет 95%","isCorrect":false},{"label":"Г","text":"Обучение длится 60 дней по 4 основным частям программы; экзамен проводится устно комиссией с равным представительством Росреестра и вуза, а для успешной сдачи необходимо правильно ответить не менее чем на 80% вопросов","isCorrect":true}],"explanation":"Слайд 6 Темы 4: обучение длится 60 дней и охватывает 4 основные части; комиссия формируется на условиях равного представительства Федеральной регистрационной службы (Росреестра) и вуза; экзамен проводится устно; порог сдачи — не менее 80% правильных ответов."},{"id":136,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайд 9","isFromOriginal40":false,"isMultiSelect":false,"question":"В какой срок сведения о лице включаются в реестр членов СРО после вступления в силу решения о приеме и в какой срок ему выдается документ о членстве?","options":[{"label":"А","text":"Сведения включаются в реестр членов СРО в течение 3 рабочих дней с даты вступления в силу решения о приеме, а документ о членстве выдается в течение 10 рабочих дней","isCorrect":true},{"label":"Б","text":"Сведения включаются в реестр в течение 15 календарных дней, а документ о членстве выдается в течение 30 календарных дней","isCorrect":false},{"label":"В","text":"Сведения включаются в реестр в день подачи заявления, а документ о членстве выдается через 6 месяцев после первой процедуры банкротства","isCorrect":false},{"label":"Г","text":"Сведения включаются в реестр в течение 10 рабочих дней, а документ о членстве выдается в течение 3 рабочих дней","isCorrect":false}],"explanation":"Слайд 9 Темы 4: в течение 3 рабочих дней с даты вступления в силу решения о приеме сведения включаются в реестр членов СРО (с этой даты лицо может утверждаться судом); документ о членстве выдается в течение 10 рабочих дней."},{"id":137,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайд 11","isFromOriginal40":false,"isMultiSelect":false,"question":"Какова приведенная в лекционных материалах статистика численности СРО и арбитражных управляющих в Российской Федерации по данным Росреестра?","options":[{"label":"А","text":"В России действует ровно 10 федеральных СРО, объединяющих 100 000 управляющих, из которых 95 000 ведут активную практику","isCorrect":false},{"label":"Б","text":"В России зарегистрировано свыше 500 СРО и около 2 000 арбитражных управляющих без единого случая дисквалификации","isCorrect":false},{"label":"В","text":"В России насчитывается около 50 СРО, в которых состоит почти 20 000 арбитражных управляющих, однако реально работают около 10 000 человек, а остальные дисквалифицированы","isCorrect":true},{"label":"Г","text":"В России функционирует 5 государственных СРО с фиксированной квотой 5 000 арбитражных управляющих","isCorrect":false}],"explanation":"Слайд 11 Темы 4: в России около 50 СРО, в которых состоит почти 20 000 арбитражных управляющих, но реально работают около 10 000, а остальные по данным Росреестра дисквалифицированы за нарушения."},{"id":138,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайд 16","isFromOriginal40":false,"isMultiSelect":false,"question":"Укажите точные размеры фиксированной суммы вознаграждения для каждого вида арбитражных управляющих согласно закону:","options":[{"label":"А","text":"Временный управляющий — 15 000 руб./мес.; административный — 30 000 руб./мес.; внешний — 30 000 руб./мес.; конкурсный — 45 000 руб./мес.; финансовый управляющий — 25 000 руб./мес.","isCorrect":false},{"label":"Б","text":"Для всех категорий арбитражных управляющих установлена единая фиксированная ставка 50 000 руб./мес. независимо от применяемой процедуры банкротства","isCorrect":false},{"label":"В","text":"Временный и административный управляющие — по 25 000 руб./мес.; внешний и конкурсный управляющие — по 60 000 руб./мес.; финансовый управляющий — 10 000 руб. единовременно","isCorrect":false},{"label":"Г","text":"Временный управляющий — 30 000 руб./мес.; административный — 15 000 руб./мес.; внешний — 45 000 руб./мес.; конкурсный — 30 000 руб./мес.; финансовый управляющий — 25 000 руб. единовременно за проведение процедуры","isCorrect":true}],"explanation":"Слайд 16 Темы 4: временный — 30 000 руб. в месяц; административный — 15 000 руб. в месяц; внешний — 45 000 руб. в месяц; конкурсный — 30 000 руб. в месяц; финансовый управляющий — 25 000 руб. единовременно за процедуру."},{"id":139,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайды 17–20","isFromOriginal40":false,"isMultiSelect":false,"question":"Каков предельный процент стимулирующего вознаграждения арбитражного управляющего от средств, поступивших в конкурсную массу в результате привлечения контролирующих должника лиц к субсидиарной ответственности, и при какой сумме процентов требуется их утверждение арбитражным судом?","options":[{"label":"А","text":"До 30% (включая расходы на выплату вознаграждения лицам, привлеченным управляющим для оказания услуг, способствовавших взысканию); если сумма процентов составляет от 100 000 рублей и более, она утверждается арбитражным судом (менее 100 000 рублей рассчитывается и выплачивается управляющим самостоятельно)","isCorrect":true},{"label":"Б","text":"До 50% сверх расходов на привлеченных юристов; утверждение арбитражным судом требуется при любой сумме процентов начиная с 10 000 рублей","isCorrect":false},{"label":"В","text":"Фиксированно 10% от суммы требований в реестре кредиторов; управляющий выплачивает проценты самостоятельно при сумме до 1 000 000 рублей","isCorrect":false},{"label":"Г","text":"До 15% от балансовой стоимости активов должника; сумма процентов утверждается exclusivamente собранием уполномоченных органов без участия суда","isCorrect":false}],"explanation":"Слайды 17–20 Темы 4: за взыскание по субсидиарной ответственности управляющему может быть установлено до 30% (включая расходы на привлеченных лиц); если сумма процентов менее 100 000 руб. — рассчитывается и выплачивается АУ самостоятельно, если от 100 000 руб. и более — утверждается арбитражным судом."},{"id":140,"lectureId":"lec4","lectureTitle":"Тема 4. Организационные аспекты деятельности арбитражных управляющих","slideRef":"Тема 4, слайды 21–25","isFromOriginal40":false,"isMultiSelect":false,"question":"Каковы обязательные требования закона к минимальной численности членов СРО арбитражных управляющих, минимальному взносу в компенсационный фонд на одного члена и каков федеральный орган надзора за деятельностью СРО?","options":[{"label":"А","text":"Не менее 50 членов и взнос в компенсационный фонд не менее 100 000 рублей на каждого члена; надзор осуществляет Центральный банк РФ","isCorrect":false},{"label":"Б","text":"Не менее 100 членов и формирование компенсационного фонда в размере не менее 50 000 рублей на каждого члена; контроль (надзор) осуществляет Федеральная регистрационная служба (Росреестр)","isCorrect":true},{"label":"В","text":"Не менее 250 членов и взнос в компенсационный фонд не менее 15 000 рублей на каждого члена; надзор осуществляет Министерство финансов РФ","isCorrect":false},{"label":"Г","text":"Не менее 30 членов и взнос в компенсационный фонд не менее 300 000 рублей на каждого члена; надзор осуществляет Федеральная антимонопольная служба","isCorrect":false}],"explanation":"Слайды 22 и 25 Темы 4: некоммерческая организация приобретает статус СРО при наличии не менее 100 членов и формировании компенсационного фонда не менее 50 тыс. руб. на каждого члена; органом по контролю (надзору) является Федеральная регистрационная служба (Росреестр)."},{"id":141,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайд 2","isFromOriginal40":false,"isMultiSelect":false,"question":"На решение каких пяти оперативных направлений направлено оперативное антикризисное управление предприятием с целью максимизации доходов и экономии ресурсов в ограниченном периоде времени?","options":[{"label":"А","text":"Разработка десятилетнего прогноза технологических укладов, фундаментальные НИОКР, строительство новых заводов, покупка зарубежных холдингов, выпуск бессрочных облигаций","isCorrect":false},{"label":"Б","text":"Пересмотр учетной политики за прошлые 5 лет, проведение ребрендинга логотипа, увеличение представительских расходов, расширение штата административного аппарата, выплата промежуточных дивидендов","isCorrect":false},{"label":"В","text":"Обращение в Конституционный Суд РФ, инициирование налоговой проверки контрагентов, заморозка расчетных счетов компании, остановка отгрузки готовой продукции, перевод персонала на сдельную оплату","isCorrect":false},{"label":"Г","text":"Удовлетворение претензий кредиторов и обеспечение текущей платежеспособности, реструктуризация кредиторской задолженности, сокращение расходов по обычным видам деятельности, пополнение фондов денежных средств, проведение быстрых организационных преобразований","isCorrect":true}],"explanation":"Слайд 2 Лекции 5: оперативное АУ направлено на максимизацию доходов и экономию ресурсов в ограниченном времени и решает 5 задач: текущая платежеспособность, реструктуризация кредиторки, сокращение расходов по обычным видам деятельности, пополнение денежных фондов, быстрые оргпреобразования."},{"id":142,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайд 4","isFromOriginal40":false,"isMultiSelect":false,"question":"В какой последовательности выстроены 7 этапов разработки антикризисной стратегии на основе комплексного диагностического анализа?","options":[{"label":"А","text":"1) Анализ макро- и микросреды -> 2) SWOT-анализ -> 3) Сценарный метод развития ситуации -> 4) Анализ и прогноз стратегических показателей -> 5) Оценка переменных конкурентоспособности -> 6) Выводы о сильных и слабых сторонах -> 7) Формулировка стратегических проблем","isCorrect":true},{"label":"Б","text":"1) Формулировка проблем -> 2) Ликвидация подразделений -> 3) Сценарный метод -> 4) SWOT-анализ -> 5) Анализ макросреды -> 6) Оценка конкурентоспособности -> 7) Утверждение мирового соглашения","isCorrect":false},{"label":"В","text":"1) Расчет Z-счета Альтмана -> 2) Подача заявления в суд -> 3) Назначение временного управляющего -> 4) SWOT-анализ -> 5) Инвентаризация -> 6) Конкурсное производство -> 7) Торги","isCorrect":false},{"label":"Г","text":"1) Оценка конкурентоспособности -> 2) Выводы о сильных сторонах -> 3) Анализ макросреды -> 4) Формулировка проблем -> 5) SWOT-анализ -> 6) Прогноз показателей -> 7) Сценарный метод","isCorrect":false}],"explanation":"На слайде 4 Лекции 5 представлена схема из 7 последовательных этапов разработки антикризисной стратегии: от анализа макро- и микросреды и SWOT-анализа до формулировки стратегических проблем."},{"id":143,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайд 6","isFromOriginal40":false,"isMultiSelect":false,"question":"На основании какого пакета документов проводится экспресс-анализ предприятия в рамках оперативной антикризисной диагностики?","options":[{"label":"А","text":"Исключительно первичные кассовые ордера и авансовые отчеты за последние 10 лет в сплошном порядке без изучения бизнес-плана и клиентской базы","isCorrect":false},{"label":"Б","text":"Обобщенные финансовые документы, бизнес-план компании, договоры о сделках, данные о клиентах и поставщиках, а также отчеты о последних событиях в деятельности предприятия","isCorrect":true},{"label":"В","text":"Только судебные определения арбитражного суда и постановления судебных приставов-исполнителей без анализа внутренней отчетности","isCorrect":false},{"label":"Г","text":"Личные дела сотрудников, должностные инструкции и правила внутреннего трудового распорядка без привлечения финансовых и договорных документов","isCorrect":false}],"explanation":"Слайд 6 Лекции 5: экспресс-анализ проводится на основании обобщенных финансовых документов, бизнес-плана компании, договоров о сделках, данных о клиентах и поставщиках, отчетов о последних событиях в деятельности."},{"id":144,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 8–10","isFromOriginal40":false,"isMultiSelect":false,"question":"На какой эмпирической выборке Эдвард Альтман в 1968 году построил свою классическую пятифакторную модель и какова ее заявленная точность прогноза на 1 год и на 2 года?","options":[{"label":"А","text":"Было исследовано 1200 банковских организаций за 1929–1939 гг. и отобрано 7 коэффициентов из 80; точность прогноза на 1 год составляет 70%, на 5 лет — 95%","isCorrect":false},{"label":"Б","text":"Было исследовано 2010 предприятий малого бизнеса США в 1983 году и отобрано 4 коэффициента; точность прогноза составляет 90,9% на горизонте 3 лет","isCorrect":false},{"label":"В","text":"Было исследовано 66 производственных предприятий за период 1946–1965 гг. (33 обанкротившихся и 33 успешных) и отобрано 5 коэффициентов из 22; точность прогноза на 1 год составляет 95%, на 2 года — 83%","isCorrect":true},{"label":"Г","text":"Было исследовано 100 британских акционерных обществ в 1972 году и отобрано 5 коэффициентов; точность прогноза составляет 99% на 1 год и 50% на 2 года","isCorrect":false}],"explanation":"Слайды 9–10 Лекции 5: Альтман исследовал 66 производственных предприятий в 1946–1965 гг. (33 банкрота и 33 оставшихся на плаву), проверил 22 коэффициента и отобрал 5; точность модели на 1 год — 95%, на 2 года — 83%."},{"id":145,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 10–13","isFromOriginal40":false,"isMultiSelect":false,"question":"Как выглядит формула классической 5-факторной модели Альтмана (1968 г.) для компаний, акции которых котируются на бирже, и каковы пороговые значения «красной», «серой» и «зеленой» зон?","options":[{"label":"А","text":"Z = 1,2*X1 + 1,4*X2 + 3,3*X3 + 0,6*X4 + 1,0*X5; при Z < 1,8 — «красная зона» (высокий риск банкротства), при 1,8 < Z < 2,9 — «серая зона» неопределенности, при Z > 2,9 — «зеленая зона» финансовой стабильности","isCorrect":true},{"label":"Б","text":"Z = 0,717*X1 + 0,847*X2 + 3,107*X3 + 0,420*X4 + 0,998*X5; при Z < 0,862 — красная зона, при 0,862 < Z < 1,57 — серая зона, при Z > 1,57 — зеленая зона","isCorrect":false},{"label":"В","text":"Z = 0,53*X1 + 0,13*X2 + 0,18*X3 + 0,16*X4; при Z < 0,2 — красная зона, при 0,2 < Z < 0,3 — серая зона, при Z > 0,3 — зеленая зона","isCorrect":false},{"label":"Г","text":"Z = 8,38*X1 + 1,0*X2 + 0,054*X3 + 0,63*X4; при Z < 0 — красная зона, при 0 < Z < 0,42 — серая зона, при Z > 0,42 — зеленая зона","isCorrect":false}],"explanation":"Слайды 10 и 13 Лекции 5: классическая формула 1968 г. Z = 1,2X1 + 1,4X2 + 3,3X3 + 0,6X4 + 1,0X5; зоны: Z < 1,8 — красная (риск банкротства), 1,8 < Z < 2,9 — серая (неопределенность), Z > 2,9 — зеленая (стабильность)."},{"id":146,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 14–16","isFromOriginal40":false,"isMultiSelect":false,"question":"Чем модифицированная 5-факторная модель Альтмана 1983 года для непубличных компаний (акции которых не торгуются на бирже) отличается от модели 1968 года?","options":[{"label":"А","text":"Из модели полностью исключены показатели рентабельности активов и оборачиваемости, оставлены только 2 коэффициента ликвидности с пороговым значением Z = 0","isCorrect":false},{"label":"Б","text":"В показателе X4 рыночная стоимость акций заменена на балансовую стоимость собственного капитала (деленную на заемный капитал), формула приняла вид Z = 0,717*X1 + 0,847*X2 + 3,107*X3 + 0,420*X4 + 0,998*X5, а граница высокого риска банкротства сместилась к Z < 1,23 (точность на 1 год — 90,9%)","isCorrect":true},{"label":"В","text":"В формулу добавлены два макроэкономических индекса инфляции и ставки ФРС США, а пороговое значение стабильности снижено до Z > 0,037","isCorrect":false},{"label":"Г","text":"Все весовые коэффициенты были увеличены ровно в два раза, а серая зона неопределенности расширена до интервала от 3,0 до 6,0","isCorrect":false}],"explanation":"Слайд 16 Лекции 5: в 1983 г. Альтман модифицировал формулу для компаний, не котирующихся на бирже: Z = 0,717X1 + 0,847X2 + 3,107X3 + 0,420X4 + 0,998X5 (X4 = балансовая стоимость СК / ЗК), зоны: Z < 1,23 — банкротство, 1,23–2,89 — неопределенность, > 2,9 — стабильность."},{"id":147,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 14–15","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие два коэффициента входят в двухфакторную модель Альтмана (Z = -0,3877 - 1,0736*X1 + 0,579*X2) и как интерпретируется полученный результат относительно нуля?","options":[{"label":"А","text":"X1 — рентабельность продаж, X2 — оборачиваемость запасов; при Z > 0 компания абсолютно финансово устойчива, а при Z < 0 признается банкротом","isCorrect":false},{"label":"Б","text":"X1 — коэффициент абсолютной ликвидности, X2 — доля основных средств в активах; пороговым значением служит Z = 1,8","isCorrect":false},{"label":"В","text":"X1 — коэффициент текущей ликвидности (ОА / КО), X2 — коэффициент капитализации ((ДО + КО) / СК); при Z < 0 вероятность банкротства меньше 50%, при Z = 0 равна 50%, при Z > 0 больше 50% и растет с увеличением Z","isCorrect":true},{"label":"Г","text":"X1 — отношение чистой прибыли к выручке, X2 — отношение дебиторской задолженности к кредиторской; при Z = 0 вероятность банкротства отсутствует","isCorrect":false}],"explanation":"Слайды 14–15 Лекции 5: в двухфакторной модели Альтмана X1 — коэффициент текущей ликвидности, X2 — коэффициент капитализации (Заемный капитал / Собственный капитал). При Z < 0 риск меньше 50%, при Z = 0 равен 50%, при Z > 0 превышает 50%."},{"id":148,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 18–19","isFromOriginal40":false,"isMultiSelect":false,"question":"Какова ключевая особенность семифакторной модели ZETA (Альтман, Халдеман, Нараянан, 1977 г.) и логит-модели Альтмана — Сабато (2007 г.)?","options":[{"label":"А","text":"Модель ZETA предназначена исключительно для оценки муниципальных бюджетов на 1 месяц, а модель Альтмана — Сабато применяется только к транснациональным нефтяным корпорациям","isCorrect":false},{"label":"Б","text":"Обе модели отказались от использования данных бухгалтерского баланса и опираются исключительно на динамику котировок государственных облигаций","isCorrect":false},{"label":"В","text":"Модель ZETA использует только два нефинансовых показателя возраста компании, а модель 2007 года рассчитывается без константы и показателей EBITDA","isCorrect":false},{"label":"Г","text":"Семифакторная модель ZETA позволяет прогнозировать банкротство на горизонте 5 лет с точностью до 70%, а логит-модель Альтмана — Сабато (2007 г.) разработана специально для предприятий малого и среднего бизнеса (на выборке 120 банкротов и 2010 небанкротов)","isCorrect":true}],"explanation":"Слайды 18–19 Лекции 5: 7-факторная модель ZETA (1977) дает прогноз на горизонте 5 лет с точностью до 70%, а модель Альтмана и Сабато (2007) создана для предприятий малого и среднего бизнеса США с использованием показателей на базе EBITDA."},{"id":149,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 20–21","isFromOriginal40":false,"isMultiSelect":false,"question":"Каково пороговое значение четырехфакторной модели Лиса (1972 г., Великобритания) и почему при ее применении к российским предприятиям возможны завышенные оценки устойчивости?","options":[{"label":"А","text":"Пороговое значение равно 0,862; модель занижает оценки в РФ из-за чрезмерного веса долгосрочных кредитов и займов","isCorrect":false},{"label":"Б","text":"Пороговое значение равно 0,037 (при Z < 0,037 — высокий риск банкротства); модель дает завышенные оценки в РФ, так как наибольший вес (0,092) имеет прибыль от продаж (K2), без учета высокой налоговой нагрузки на прибыль","isCorrect":true},{"label":"В","text":"Пороговое значение равно 1,57; модель не учитывает оборотный капитал и нераспределенную прибыль организации","isCorrect":false},{"label":"Г","text":"Пороговое значение равно 0,30; модель была разработана для плановой экономики и требует перевода всех статей баланса в фунты стерлингов","isCorrect":false}],"explanation":"Слайды 20–21 Лекции 5: в модели Лиса Z = 0,063K1 + 0,092K2 + 0,057K3 + 0,001K4 предел равен 0,037; она дает завышенные оценки в российских реалиях, так как самое большое влияние оказывает прибыль от продаж без учета налогового режима."},{"id":150,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 22–27","isFromOriginal40":false,"isMultiSelect":false,"question":"В чем состоит методологическая особенность пятифакторной модели Уильяма Бивера и как рассчитывается собственно «коэффициент Бивера» (BR)?","options":[{"label":"А","text":"Все 5 показателей складываются с равными весами по 0,20 в единый индекс, а коэффициент Бивера рассчитывается как отношение выручки от реализации к стоимости внеоборотных активов","isCorrect":false},{"label":"Б","text":"Модель оценивает компанию в 100-балльной шкале по трем классам кредитоспособности, а коэффициент Бивера равен отношению собственного капитала к запасам","isCorrect":false},{"label":"В","text":"В модели Бивера не используются весовые коэффициенты и не вычисляется итоговый интегральный Z-счет — 5 показателей оцениваются в динамике по интервальным таблицам (благополучные, за 5 лет и за 1 год до банкротства), а коэффициент Бивера равен отношению суммы чистой прибыли и амортизации к общей сумме обязательств: (ЧП + Ам) / (ДО + КО)","isCorrect":true},{"label":"Г","text":"Модель предназначена только для прогноза банкротства за 30 дней до дефолта, а коэффициент Бивера равен отношению краткосрочных обязательств к денежным средствам","isCorrect":false}],"explanation":"Слайды 22–27 Лекции 5: в модели У. Бивера весовые коэффициенты не предусмотрены и итоговый коэффициент не рассчитывается — 5 показателей сравниваются с нормативными интервалами (низкий риск, за 5 лет и за 1 год до банкротства); сам коэффициент Бивера BR = (ЧП + Ам) / (ДО + КО)."},{"id":151,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 28–31","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие три коэффициента входят в балльную (скоринговую) модель Дэвида Дюрана (начало 1940-х гг.), каково максимальное число баллов по каждому из них и сколько классов платежеспособности выделяется?","options":[{"label":"А","text":"Коэффициент абсолютной ликвидности (40 баллов), коэффициент оборачиваемости активов (40 баллов) и коэффициент задолженности (20 баллов); выделяется 3 класса риска","isCorrect":false},{"label":"Б","text":"Рентабельность продаж (60 баллов), маневренность собственного капитала (25 баллов) и обеспеченность запасов (15 баллов); выделяется 4 класса устойчивости","isCorrect":false},{"label":"В","text":"Коэффициент Бивера (50 баллов), коэффициент Лиса (25 баллов) и коэффициент Таффлера (25 баллов); выделяется 6 классов кредитоспособности","isCorrect":false},{"label":"Г","text":"Коэффициент рентабельности совокупного капитала (максимум 50 баллов), коэффициент текущей ликвидности (максимум 30 баллов) и коэффициент финансовой независимости / автономии (максимум 20 баллов); по сумме баллов выделяется 5 классов (I класс — 100 баллов и выше, V класс — 0 баллов)","isCorrect":true}],"explanation":"Слайды 28–31 Лекции 5: в модели Д. Дюрана оцениваются 3 показателя: рентабельность совокупного капитала (до 50 баллов), текущая ликвидность (до 30 баллов) и финансовая независимость СК/ВБ (до 20 баллов). Выделяется 5 классов: I (100+), II (65–99), III (35–64), IV (6–34), V (0 баллов)."},{"id":152,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 32–35","isFromOriginal40":false,"isMultiSelect":false,"question":"Какой фактор имеет наибольший весовой коэффициент (0,53) в четырехфакторной модели Таффлера и Тишоу (1977 г.) и каковы граничные значения итогового показателя?","options":[{"label":"А","text":"Наибольший вес (0,53) имеет коэффициент r1 (отношение прибыли от продаж к краткосрочным обязательствам); при значении > 0,3 предприятие стабильно, от 0,2 до 0,3 — «серая зона» нормы, менее 0,2 — высокая вероятность банкротства","isCorrect":true},{"label":"Б","text":"Наибольший вес (0,53) имеет отношение выручки к валюте баланса (r4); при значении > 0,862 компания стабильна, менее 0,862 — банкрот","isCorrect":false},{"label":"В","text":"Наибольший вес (0,53) имеет отношение оборотного капитала к активам; при значении > 2,9 компания стабильна, менее 1,8 — банкрот","isCorrect":false},{"label":"Г","text":"Наибольший вес (0,53) имеет отношение собственного капитала к долгосрочным обязательствам; при значении > 0,42 риск минимален","isCorrect":false}],"explanation":"Слайды 32–35 Лекции 5: в модели Таффлера и Тишоу Z = 0,53*r1 + 0,13*r2 + 0,18*r3 + 0,16*r4 наибольший вес 0,53 у r1 (Прибыль от продаж / Краткосрочные обязательства); > 0,3 — стабильно, 0,2–0,3 — норма, < 0,2 — высокая вероятность банкротства."},{"id":153,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 36–38","isFromOriginal40":false,"isMultiSelect":false,"question":"Как записывается четырехфакторная модель Гордона — Спрингейта и при каком значении Z-счета вероятность банкротства предприятия признается высокой?","options":[{"label":"А","text":"Z = 0,063*X1 + 0,092*X2 + 0,057*X3 + 0,001*X4; при результате меньше 0,037 вероятность банкротства высокая","isCorrect":false},{"label":"Б","text":"Z = 8,38*X1 + 1,0*X2 + 0,054*X3 + 0,63*X4; при результате меньше 0,18 вероятность банкротства высокая","isCorrect":false},{"label":"В","text":"Z = 1,03*X1 + 3,07*X2 + 0,66*X3 + 0,4*X4; при результате меньше 0,862 вероятность банкротства предприятия высокая","isCorrect":true},{"label":"Г","text":"Z = 0,25*X1 + 0,1*X2 + 0,2*X3 + 0,25*X4; при результате больше 1,57 вероятность банкротства высокая","isCorrect":false}],"explanation":"Слайды 36–38 Лекции 5: модель Гордона — Спрингейта имеет вид Z = 1,03X1 + 3,07X2 + 0,66X3 + 0,4X4; критический порог равен 0,862 (если меньше 0,862 — высокая вероятность банкротства)."},{"id":154,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 39–40","isFromOriginal40":false,"isMultiSelect":false,"question":"Как в шестифакторной модели О.П. Зайцевой (K = 0,25*X1 + 0,1*X2 + 0,2*X3 + 0,25*X4 + 0,1*X5 + 0,1*X6) определяется нормативное значение Kнорм и при каком соотношении Kфакт и Kнорм вероятность банкротства велика?","options":[{"label":"А","text":"Kнорм фиксированно равен 2,90 для всех отраслей экономики; если Kфакт < Kнорм, то вероятность банкротства велика","isCorrect":false},{"label":"Б","text":"Kнорм = 0,862 + 0,5 * X1(текущего года); если Kфакт равен нулю, то предприятие признается неплатежеспособным","isCorrect":false},{"label":"В","text":"Kнорм = 0,037 * X3(прошлого года); если Kфакт < 0,32, то вероятность банкротства составляет 90–100%","isCorrect":false},{"label":"Г","text":"Kнорм = 1,57 + 0,1 * X6(прошлого года), где X6 — коэффициент загрузки активов (величина, обратная коэффициенту оборачиваемости активов); если Kфакт > Kнорм, то вероятность банкротства велика","isCorrect":true}],"explanation":"Слайды 39–40 Лекции 5: в модели О.П. Зайцевой фактический коэффициент сравнивается с нормативным Kнорм = 1,57 + 0,1 * X6(прошлого года). Поскольку все факторы X1..X6 отражают негативные нагрузки (убыточность, кредиторку к дебиторке, обратную ликвидность, финлеверидж, обратную оборачиваемость), превышение Kфакт > Kнорм означает высокую вероятность банкротства."},{"id":155,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 41–42","isFromOriginal40":false,"isMultiSelect":false,"question":"Какова формула четырехфакторной модели Беликова — Давыдовой (Иркутской государственной экономической академии) и как градуируется шкала риска банкротства по значению Z?","options":[{"label":"А","text":"Z = 8,38*K1 + 1*K2 + 0,054*K3 + 0,63*K4; при Z < 0 риск максимален (90–100%), от 0 до 0,18 — высокий (60–80%), от 0,18 до 0,32 — средний (35–50%), от 0,32 до 0,42 — низкий (15–20%), при Z >= 0,42 — минимальный","isCorrect":true},{"label":"Б","text":"Z = 1,2*K1 + 1,4*K2 + 3,3*K3 + 0,6*K4; при Z < 1,8 риск максимален, от 1,8 до 2,9 — средний, свыше 2,9 — минимальный","isCorrect":false},{"label":"В","text":"Z = 0,53*K1 + 0,13*K2 + 0,18*K3 + 0,16*K4; при Z < 0,2 риск максимален, от 0,2 до 0,3 — средний, свыше 0,3 — минимальный","isCorrect":false},{"label":"Г","text":"Z = 1,03*K1 + 3,07*K2 + 0,66*K3 + 0,4*K4; при Z < 0,862 риск составляет 100%, свыше 0,862 — риск отсутствует","isCorrect":false}],"explanation":"Слайды 41–42 Лекции 5: в модели Беликова — Давыдовой Z = 8,38K1 + 1K2 + 0,054K3 + 0,63K4 (где K1 — доля оборотного капитала в активах с наибольшим весом 8,38), а шкала риска разбита на 5 интервалов от Z < 0 (90–100%) до Z >= 0,42 (минимальный риск)."},{"id":156,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайд 43","isFromOriginal40":false,"isMultiSelect":false,"question":"С какого отчета начинается пошаговый пятиэтапный алгоритм анализа финансовой отчетности предприятия и какие ориентиры чистой рентабельности приведены в лекции для сферы строительства и инфобизнеса?","options":[{"label":"А","text":"Шаг 1 начинается с аудиторского заключения, а нормативом чистой рентабельности для строительства указаны 50–60% и 5–10% для инфобизнеса","isCorrect":false},{"label":"Б","text":"Шаг 1 начинается с анализа Отчета о движении денежных средств (сальдо денежных потоков и остатки денег), а на Шаге 2 в Отчете о прибылях и убытках ориентиром чистой рентабельности указаны 15–20% для строительства и 50–60% для инфобизнеса","isCorrect":true},{"label":"В","text":"Шаг 1 начинается с Отчета об изменениях капитала, при этом для всех отраслей экономики установлен единый норматив чистой рентабельности 25%","isCorrect":false},{"label":"Г","text":"Шаг 1 начинается с пояснительной записки к балансу, а чистая рентабельность оценивается исключительно по величине уставного капитала","isCorrect":false}],"explanation":"Слайд 43 Лекции 5: Шаг 1 — Анализ Отчета о движении денежных средств; Шаг 2 — Анализ Отчета о прибылях и убытках (чистая рентабельность: для строительства норма 15–20%, для инфобизнеса 50–60%); Шаг 3 — Баланс и 4 коэффициента; Шаг 4 — Рекомендации; Шаг 5 — Презентация собственнику."},{"id":157,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайд 23","isFromOriginal40":false,"isMultiSelect":false,"question":"При каком критическом значении коэффициента Бивера (отношение суммы чистой прибыли и амортизации к заемному капиталу) на протяжении 1,5–2 лет предприятие попадает в зону высокого риска банкротства и какие интервалы этого показателя соответствуют положению за 5 лет и за 1 год до банкротства?","options":[{"label":"А","text":"Если коэффициент превышает 2,0 в течение полугода; интервал за 5 лет до банкротства составляет от 1,0 до 2,0, а за 1 год — менее 1,0","isCorrect":false},{"label":"Б","text":"Если коэффициент держится на уровне 0,8 в течение 3 месяцев; интервал за 5 лет до банкротства составляет от 0,37 до 0,5, а за 1 год — 0,8 и выше","isCorrect":false},{"label":"В","text":"Если коэффициент опускается ниже 1,23; интервал за 5 лет до банкротства составляет от 1,23 до 2,89, а за 1 год — менее 0,037","isCorrect":false},{"label":"Г","text":"Если в течение 1,5–2 лет коэффициент не превышает 0,2, это говорит о высоком риске банкротства; интервал за 5 лет до банкротства составляет от -0,15 до +0,17, а за 1 год до банкротства — менее -0,15 (при норме благополучных компаний 0,17–0,4 и выше)","isCorrect":true}],"explanation":"Слайды 23 и 27 Лекции 5: нежелательной является ситуация, когда в течение 1,5–2 лет коэффициент Бивера не превышает 0,2; нормативные интервалы BR: низкий риск > 0,4 (0,17–0,4), за 5 лет до банкротства от -0,15 до 0,17, за 1 год до банкротства < -0,15."},{"id":158,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайд 27","isFromOriginal40":false,"isMultiSelect":false,"question":"Каковы нормативные значения коэффициента финансового левериджа FL = (ДО + КО) / ВБ и коэффициента покрытия активов собственными оборотными средствами WC = (СК - ВНА) / ВБ для финансово благополучных компаний (низкий риск) в системе У. Бивера?","options":[{"label":"А","text":"Для благополучных предприятий финансовый леверидж составляет менее 0,37 (за 1 год до банкротства >= 0,8), а покрытие активов собственными оборотными средствами — более 0,4 (за 1 год до банкротства < 0,06)","isCorrect":true},{"label":"Б","text":"Для благополучных предприятий финансовый леверидж составляет более 0,8, а покрытие собственными оборотными средствами — менее 0,06","isCorrect":false},{"label":"В","text":"Для благополучных предприятий оба показателя должны находиться строго в диапазоне от 2,0 до 3,2","isCorrect":false},{"label":"Г","text":"Для благополучных предприятий финансовый леверидж равен 1,57, а покрытие собственными оборотными средствами составляет от 0,06 до 0,08","isCorrect":false}],"explanation":"Слайд 27 Лекции 5 (таблица нормативов Бивера): для низкого риска банкротства финансовый леверидж FL < 0,37 (за 5 лет: 0,37–0,5; за 1 год: >= 0,8), а коэффициент покрытия активов СОС WC > 0,4 (за 5 лет: 0,06–0,3; за 1 год: < 0,06)."},{"id":159,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 30–31","isFromOriginal40":false,"isMultiSelect":false,"question":"При каких значениях трех показателей в скоринговой модели Д. Дюрана предприятие получает 0 баллов (V класс — предприятия высочайшего риска, практически несостоятельные)?","options":[{"label":"А","text":"Рентабельность совокупного капитала 30% и выше, коэффициент текущей ликвидности 2,0 и выше, коэффициент финансовой независимости 0,7 и выше","isCorrect":false},{"label":"Б","text":"Рентабельность совокупного капитала менее 1%, коэффициент текущей ликвидности 1,0 и ниже, коэффициент финансовой независимости (автономии) менее 0,2","isCorrect":true},{"label":"В","text":"Рентабельность совокупного капитала от 10% до 19,9%, коэффициент текущей ликвидности от 1,4 до 1,69, коэффициент автономии от 0,3 до 0,44","isCorrect":false},{"label":"Г","text":"Рентабельность совокупного капитала ровно 20%, коэффициент текущей ликвидности ровно 1,7, коэффициент автономии ровно 0,45","isCorrect":false}],"explanation":"Слайды 30–31 Лекции 5: в таблице границ классов модели Дюрана V классу (0 баллов) соответствуют: рентабельность совокупного капитала < 1%, коэффициент текущей ликвидности <= 1,0 и коэффициент финансовой независимости < 0,2."},{"id":160,"lectureId":"lec5","lectureTitle":"Лекция 5. Стратегическое и оперативное антикризисное управление. Модели банкротства","slideRef":"Лекция 5, слайды 39–40","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие шесть коэффициентов входят в модель О.П. Зайцевой (K = 0,25*X1 + 0,1*X2 + 0,2*X3 + 0,25*X4 + 0,1*X5 + 0,1*X6) и какие два из них имеют наибольший весовой коэффициент (по 0,25)?","options":[{"label":"А","text":"Шесть показателей ликвидности и оборачиваемости запасов, из которых наибольший вес по 0,25 имеют коэффициент абсолютной ликвидности и коэффициент автономии","isCorrect":false},{"label":"Б","text":"Шесть показателей рыночной капитализации акций и дивидендной доходности, из которых наибольший вес по 0,25 имеют котировки обыкновенных и привилегированных акций","isCorrect":false},{"label":"В","text":"X1 (Куп — убыточность предприятия к собственному капиталу), X2 (Кз — кредиторская задолженность к дебиторской), X3 (Кс — КО к наиболее ликвидным активам), X4 (Кур — чистый убыток к выручке), X5 (Кфл — ЗК к СК), X6 (Кзаг — активы к выручке); наибольший вес по 0,25 имеют X1 и X4","isCorrect":true},{"label":"Г","text":"Шесть макроэкономических индикаторов отрасли, из которых наибольший вес по 0,25 имеют ключевая ставка ЦБ РФ и уровень инфляции","isCorrect":false}],"explanation":"Слайд 39 Лекции 5: в модель О.П. Зайцевой входят X1 (Куп = убыток / СК, вес 0,25), X2 (Кз = КЗ / ДЗ, вес 0,1), X3 (Кс = КО / наиболее ликвидные активы, вес 0,2), X4 (Кур = чистый убыток / выручка, вес 0,25), X5 (Кфл = ЗК / СК, вес 0,1), X6 (Кзаг = активы / выручка, вес 0,1)."},{"id":161,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайд 2","isFromOriginal40":false,"isMultiSelect":false,"question":"Как в материалах курса определяется сущность финансового оздоровления организации в широком экономическом смысле (помимо формальной судебной процедуры банкротства)?","options":[{"label":"А","text":"Как комплекс мер по восстановлению платежеспособности компании и погашению задолженности перед кредиторами, который также может проводиться компанией самостоятельно как трансформация деятельности для преодоления кризиса без участия суда","isCorrect":true},{"label":"Б","text":"Исключительно как принудительная распродажа имущества должника с открытых торгов с последующим исключением юридического лица из ЕГРЮЛ","isCorrect":false},{"label":"В","text":"Как процедура национализации частного предприятия с безвозмездной передачей всех акций в собственность муниципального образования","isCorrect":false},{"label":"Г","text":"Как одностороннее списание всех налоговых и кредитных обязательств коммерческой организации по решению генерального директора","isCorrect":false}],"explanation":"Слайд 2 Лекции 6: финансовое оздоровление — это как процедура в деле о банкротстве по восстановлению платежеспособности и погашению долгов по графику, так и самостоятельная трансформация деятельности компании в кризисной ситуации без участия суда."},{"id":162,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайды 4–5","isFromOriginal40":false,"isMultiSelect":false,"question":"Каков статус руководителя компании на первом этапе судебной процедуры финансового оздоровления и какие сделки он не вправе совершать без согласия кредиторов?","options":[{"label":"А","text":"Руководитель немедленно увольняется с лишением права подписи, а управление полностью переходит к комитету залоговых кредиторов","isCorrect":false},{"label":"Б","text":"Руководитель продолжает управлять бизнесом в обычном режиме под контролем административного управляющего, но без согласия кредиторов не может проводить реорганизацию и совершать сделки с заинтересованностью (например, купить себе служебный автомобиль)","isCorrect":true},{"label":"В","text":"Руководитель сохраняет абсолютную свободу любых сделок по отчуждению активов и реорганизации без согласования с кем-либо","isCorrect":false},{"label":"Г","text":"Руководитель переводится на должность стажера-помощника арбитражного управляющего без права заключения текущих хозяйственных договоров","isCorrect":false}],"explanation":"Слайд 5 Лекции 6: при финансовом оздоровлении директор остается на месте и управляет бизнесом, но его действия контролирует административный управляющий; без согласия кредиторов директор не может проводить реорганизацию и заключать сделки с заинтересованностью (например, купить себе служебную машину)."},{"id":163,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайд 7","isFromOriginal40":false,"isMultiSelect":false,"question":"За какой срок до окончания процедуры финансового оздоровления компания обязана представить отчет о результатах и какие три варианта решения возможны на третьем этапе (подведение итогов)?","options":[{"label":"А","text":"Отчет подается за 3 дня до окончания срока; единственным возможным исходом является возврат компании на стадию первичного наблюдения","isCorrect":false},{"label":"Б","text":"Отчет подается через 6 месяцев после окончания процедуры; суд может либо продлить финансовое оздоровление еще на 5 лет, либо простить остаток долга","isCorrect":false},{"label":"В","text":"Отчет подается минимум за 1 месяц до окончания срока; возможны 3 исхода: прекращение дела при погашении всех долгов, введение внешнего управления при перспективе восстановления платежеспособности либо признание банкротом и открытие конкурсного производства","isCorrect":true},{"label":"Г","text":"Отчет составляется налоговым органом за 90 дней до окончания срока; возможна только принудительная национализация имущества должника","isCorrect":false}],"explanation":"Слайд 7 Лекции 6: минимум за месяц до окончания срока компания подает отчет. Если все долги погашены — дело прекращается; если не погашены — суд либо вводит внешнее управление (если есть шанс восстановить платежеспособность), либо признает должника банкротом и открывает конкурсное производство."},{"id":164,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайд 9","isFromOriginal40":false,"isMultiSelect":false,"question":"Какова правильная пятишаговая последовательность финансовой стабилизации и оздоровления предприятия, представленная в материалах Лекции 6?","options":[{"label":"А","text":"1) Сокращение заработной платы персонала -> 2) Увольнение топ-менеджмента -> 3) Закрытие всех филиалов -> 4) Получение банковского кредита -> 5) Выплата дивидендов акционерам","isCorrect":false},{"label":"Б","text":"1) Остановка производства -> 2) Продажа дебиторской задолженности -> 3) Заморозка счетов -> 4) Смена юридического адреса -> 5) Ликвидация баланса","isCorrect":false},{"label":"В","text":"1) Повышение отпускных цен в два раза -> 2) Увеличение рекламного бюджета -> 3) Покупка акций конкурентов -> 4) Сокращение производственных рабочих -> 5) Переход на УСН","isCorrect":false},{"label":"Г","text":"1) Устранение внешних факторов несостоятельности -> 2) Локализация и преодоление внутренних причин -> 3) Восстановление финансовой устойчивости (прибыль и рентабельность) -> 4) Обеспечение финансового равновесия в длительном периоде -> 5) Сохранение стабильности и устойчивого роста стоимости","isCorrect":true}],"explanation":"Слайд 9 Лекции 6 содержит 5 последовательных блоков финансовой стабилизации: от устранения внешних факторов несостоятельности и локализации внутренних причин до обеспечения длительного финансового равновесия и устойчивого роста стоимости бизнеса."},{"id":165,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайд 10","isFromOriginal40":false,"isMultiSelect":false,"question":"Какой подход к сокращению затрат на персонал (снижение зарплат и лишение премий) сформулирован в материалах курса при проведении финансового оздоровления?","options":[{"label":"А","text":"Урезание окладов всех сотрудников на 50% и полная отмена премий являются первоочередной мерой в первый же день финансового оздоровления при сохранении представительских расходов руководства","isCorrect":false},{"label":"Б","text":"Сокращение зарплат и лишение премий рассматривается как самый последний шаг, поскольку демотивированный персонал не будет заинтересован в выводе бизнеса из кризиса; начинать следует с бережливого производства, отказа от имиджевых трат, доплат и переезда офиса в более дешевый район","isCorrect":true},{"label":"В","text":"Затраты на обучение, командировки и аренду престижного офиса в центре города сокращать категорически запрещено, чтобы не подорвать деловую репутацию перед банками","isCorrect":false},{"label":"Г","text":"Единственным допустимым способом снижения издержек является переход на закупку самого дорогого импортного сырья при одновременном увольнении половины инженеров","isCorrect":false}],"explanation":"Слайд 10 Лекции 6 прямо подчеркивает: «Сокращение зарплат и лишение премий — последний шаг, на который стоит пойти компании в кризисе. Демотивированный персонал точно не будет заинтересован в том, чтобы вытащить бизнес из кризиса»."},{"id":166,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайд 11","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие четыре практических инструмента рекомендуются в курсе для избавления от убыточных и простаивающих активов, требующих расходов на хранение и обслуживание?","options":[{"label":"А","text":"Переоценка простаивающего оборудования с повышением его балансовой стоимости в три раза для увеличения базы налога на имущество","isCorrect":false},{"label":"Б","text":"Консервация всех складов и цехов на 10 лет с наймом дополнительной вооруженной охраны и сохранением всех коммунальных платежей","isCorrect":false},{"label":"В","text":"Проведение полной инвентаризации имущества, списание безнадежно устаревших активов для экономии на налоге на имущество, продажа неиспользуемого оборудования, а также сдача свободных площадей и техники в аренду","isCorrect":true},{"label":"Г","text":"Безвозмездная передача всех производственных линий зарубежным конкурентам без проведения инвентаризации и бухгалтерского оформления","isCorrect":false}],"explanation":"Слайд 11 Лекции 6 («Избавление от убыточных активов»): 1) провести инвентаризацию; 2) списать устаревшее имущество (экономия на налоге на имущество); 3) продать простаивающее оборудование; 4) сдать неиспользуемое имущество в аренду."},{"id":167,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайды 12–13","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие меры по увеличению выручки и перестройке организационной структуры предлагаются в рамках внутренней программы финансового оздоровления?","options":[{"label":"А","text":"Полный отказ от любых скидок и рекламных акций при увеличении числа иерархических уровней управления и дублирующих департаментов в два раза","isCorrect":false},{"label":"Б","text":"Запрет на выход в новые регионы и прекращение выпуска высокомаржинальных товаров ради сохранения исключительно убыточного ассортимента","isCorrect":false},{"label":"В","text":"Отказ от аутсорсинга любых вспомогательных функций и создание собственных непрофильных служб в каждом подразделении компании","isCorrect":false},{"label":"Г","text":"Стимулирование продаж за счет скидок за объем, пересмотр цен с учетом эластичности спроса, точечная реклама и выход на новые рынки, а при глубоком кризисе — радикальная перестройка вплоть до разрушения старой оргструктуры до нуля и построения новой с объединением отделов и передачей части функций на аутсорсинг","isCorrect":true}],"explanation":"Слайды 12–13 Лекции 6: для роста выручки — скидки за объем, пересмотр цен по эластичности спроса, точечная реклама, выход на новые рынки; в оргструктуре — вплоть до разрушения старой структуры до нуля и построения по новым принципам, объединения отделов и передачи функций на аутсорсинг."},{"id":168,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайды 14–15","isFromOriginal40":false,"isMultiSelect":false,"question":"Чем в соответствии с Налоговым кодексом РФ отсрочка по уплате налогов и взносов отличается от рассрочки, на какой максимальный срок они предоставляются и при каких основаниях бизнес может на них претендовать?","options":[{"label":"А","text":"При отсрочке сумма долга выплачивается единовременно в конце периода, а при рассрочке — постепенно по графику; они предоставляются на срок не более 1 года при ущербе от ЧС, задержке бюджетного финансирования/оплаты госконтракта, угрозе банкротства от единовременной уплаты налогов или сезонном характере деятельности","isCorrect":true},{"label":"Б","text":"При отсрочке налог списывается полностью, а при рассрочке уменьшается вдвое; они предоставляются на срок до 5 лет любому предприятию по устному заявлению без подтверждающих оснований","isCorrect":false},{"label":"В","text":"Отсрочка предполагает ежемесячные платежи, а рассрочка — разовый платеж через 3 года; они предоставляются только компаниям с рентабельностью свыше 50%","isCorrect":false},{"label":"Г","text":"И отсрочка, и рассрочка предоставляются исключительно на 90 дней и только для уплаты государственной пошлины в арбитражный суд","isCorrect":false}],"explanation":"Слайды 14–15 Лекции 6: отсрочка (единовременная выплата в конце периода) и рассрочка (постепенная выплата по графику) по НК РФ даются на срок не более 1 года при наличии оснований: ущерб от стихийных бедствий/ЧС, задержка бюджетного финансирования или оплаты госконтракта, риск банкротства при разовой выплате налогов, сезонность."},{"id":169,"lectureId":"lec6","lectureTitle":"Лекция 6. Финансовое оздоровление организации","slideRef":"Лекция 6, слайды 18–20","isFromOriginal40":false,"isMultiSelect":false,"question":"Каков максимальный законодательный срок процедуры финансового оздоровления, при каком нарушении графика погашения долгов она может быть прекращена досрочно и в чем состоит главная причина редкого применения этой процедуры в российской практике?","options":[{"label":"А","text":"Максимальный срок составляет 7 месяцев; процедура прекращается при просрочке платежа на 1 день; главная проблема — законодательный запрет на применение финансового оздоровления к ООО","isCorrect":false},{"label":"Б","text":"Максимальный срок составляет 5 лет при минимальном сроке 3 года; досрочное прекращение законом не допускается ни при каких обстоятельствах","isCorrect":false},{"label":"В","text":"Максимальный срок составляет 2 года (минимальный не установлен); процедура прекращается досрочно при непредоставлении суду документов об обеспечении либо при нарушении измененного графика погашения задолженности более чем на 15 дней; главная проблема в РФ — слишком позднее обращение в суд, когда долги уже превышают активы","isCorrect":true},{"label":"Г","text":"Максимальный срок составляет 6 месяцев; процедура прекращается при смене главного бухгалтера, а в РФ она применяется в 95% всех дел о банкротстве","isCorrect":false}],"explanation":"Слайды 18–20 Лекции 6: максимальный срок финансового оздоровления по закону — 2 года; досрочное прекращение происходит, если не поданы документы об обеспечении или компания более чем на 15 дней нарушает измененный график погашения долгов (административный управляющий в течение 15 дней созывает собрание кредиторов); главная причина низкой эффективности в РФ — слишком позднее обращение в суд."},{"id":170,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайд 3","isFromOriginal40":false,"isMultiSelect":false,"question":"Какие семь видов государственного антикризисного регулирования выделяются в структуре государственного воздействия на кризисные ситуации?","options":[{"label":"А","text":"Таможенное, дипломатическое, биржевое, страховое, нотариальное, маркетинговое, экологическое регулирование","isCorrect":false},{"label":"Б","text":"Исключительно карательное, фискальное, эмиссионное, конфискационное, цензурное, монопольное, внешнеторговое регулирование","isCorrect":false},{"label":"В","text":"Муниципальное, корпоративное, внутрифирменное, семейное, профсоюзное, благотворительное, кооперативное регулирование","isCorrect":false},{"label":"Г","text":"Правовое, методическое, информационное, экономическое и административное, организационное, социальное, кадровое регулирование","isCorrect":true}],"explanation":"На слайде 3 Лекции 7 перечислены 7 видов государственного антикризисного регулирования: 1) правовое, 2) методическое, 3) информационное, 4) экономическое и административное, 5) организационное, 6) социальное, 7) кадровое."},{"id":171,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайды 4–5","isFromOriginal40":false,"isMultiSelect":false,"question":"В чем заключается фундаментальное различие между рецептами антикризисного государственного регулирования Дж. М. Кейнса и неоконсервативной моделью монетаризма М. Фридмена (1970-е гг.)?","options":[{"label":"А","text":"Кейнс предлагал стимулировать совокупный спрос (снижение налогов, создание рабочих мест в госсекторе, удешевление кредитов), тогда как монетаризм М. Фридмена делает ставку на стимулирование производства через борьбу с инфляцией, снижение вмешательства государства в реальный сектор, сокращение соцрасходов и госаппарата, приватизацию и снижение налогов на прибыль при сохранении госрегулирования финансово-кредитной политики","isCorrect":true},{"label":"Б","text":"Кейнс выступал за полный уход государства из экономики и ликвидацию госсобственности, а М. Фридмен требовал стопроцентной национализации всех предприятий и директивного планирования цен","isCorrect":false},{"label":"В","text":"Оба экономиста предлагали абсолютно идентичную программу повышения налоговых ставок до 90% и запрета частного банковского кредитования в период кризиса","isCorrect":false},{"label":"Г","text":"Кейнс предлагал бороться с кризисом только через сокращение социальных пособий, а М. Фридмен — через массовое расширение штата чиновников и общественных работ","isCorrect":false}],"explanation":"Слайды 4–5 Лекции 7 сопоставляют рецепты Дж. Кейнса (стимулирование совокупного спроса через снижение налогов, рабочие места в госсекторе и снижение ставок по кредитам) и монетаризм М. Фридмена (стимулирование производства, борьба с инфляцией, сокращение госсектора, соцрасходов и бюрократии, приватизация, снижение налогов на прибыль компаний при госрегулировании финансово-кредитной сферы)."},{"id":172,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайд 6","isFromOriginal40":false,"isMultiSelect":false,"question":"Как согласно материалам Лекции 7 различаются меры бюджетно-налоговой (фискальной) политики государства в период экономического спада, в период подъема и в любой период?","options":[{"label":"А","text":"В период спада — резкое повышение всех налогов и прекращение общественных работ; в период подъема — введение чрезвычайных налоговых мораториев и национализация банков","isCorrect":false},{"label":"Б","text":"В период спада — увеличение расходов на общественные работы и программы поддержки; в период подъема — снижение налогов на население и компании для стимулирования спроса и инвестиций; в любой период — налоговые льготы, моратории, заморозка пеней и штрафов, отсрочки и налоговые кредиты","isCorrect":true},{"label":"В","text":"В период спада и подъема государственные расходы замораживаются на нулевом уровне, а налоговые льготы и отсрочки запрещаются Бюджетным кодексом","isCorrect":false},{"label":"Г","text":"В период спада государство отменяет общественные работы, а в период подъема вводит прогрессивные штрафы за рост инвестиционной активности предприятий","isCorrect":false}],"explanation":"Слайд 6 Лекции 7 четко разделяет меры фискальной политики: 1) в период спада — увеличение расходов на общественные работы и программы поддержки; 2) в период подъема — снижение налогов на население и компании; 3) в любой период — налоговые льготы, моратории, заморозка пеней/штрафов, отсрочки, налоговые кредиты."},{"id":173,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайды 7–8","isFromOriginal40":false,"isMultiSelect":false,"question":"В чем состоит дилемма государственного налогового и неналогового регулирования «низкие налоги — высокие бюджетные доходы» в условиях кризиса?","options":[{"label":"А","text":"В полном отказе государства от сбора налогов в федеральный бюджет и переходе на финансирование армии и медицины за счет добровольных пожертвований граждан","isCorrect":false},{"label":"Б","text":"В передаче права эмиссии наличных денег от Центрального банка РФ коммерческим предприятиям малого и среднего бизнеса","isCorrect":false},{"label":"В","text":"В замене всех прямых и косвенных налогов единым таможенным сбором на импорт сельскохозяйственной продукции","isCorrect":false},{"label":"Г","text":"В необходимости выбора приоритета между фискальной и стимулирующей функциями налогообложения (а в неналоговых доходах регионального бюджета — между пополнением бюджета от сдачи госимущества в аренду и поддержкой субъектов МСП через льготную аренду)","isCorrect":true}],"explanation":"Слайды 7–8 Лекции 7 раскрывают дилемму «низкие налоги — высокие бюджетные доходы»: баланс между фискальной и стимулирующей функциями налогов, а по неналоговым доходам — между пополнением регионального бюджета и предоставлением льготной аренды субъектам МСП."},{"id":174,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайд 9","isFromOriginal40":false,"isMultiSelect":false,"question":"Какова пятиступенчатая прогрессивная шкала ставок НДФЛ и пороговых значений годового дохода, введенная в Российской Федерации с 2025 года?","options":[{"label":"А","text":"До 2,4 млн руб. — 13%; от 2,4 до 5 млн руб. — 15%; от 5 до 20 млн руб. — 18%; от 20 до 50 млн руб. — 20%; свыше 50 млн руб. в год — 22%","isCorrect":true},{"label":"Б","text":"До 1 млн руб. — 10%; от 1 до 3 млн руб. — 13%; от 3 до 10 млн руб. — 15%; от 10 до 30 млн руб. — 20%; свыше 30 млн руб. — 25%","isCorrect":false},{"label":"В","text":"До 5 млн руб. — 13%; от 5 до 15 млн руб. — 15%; от 15 до 30 млн руб. — 20%; от 30 до 100 млн руб. — 25%; свыше 100 млн руб. — 30%","isCorrect":false},{"label":"Г","text":"До 2,4 млн руб. — 13%; от 2,4 до 10 млн руб. — 16%; от 10 до 25 млн руб. — 19%; от 25 до 50 млн руб. — 22%; свыше 50 млн руб. — 28%","isCorrect":false}],"explanation":"Слайд 9 Лекции 7 приводит точную шкалу НДФЛ 2025 г.: 0–2,4 млн руб. — 13%; 2,4–5 млн руб. — 15%; 5–20 млн руб. — 18%; 20–50 млн руб. — 20%; свыше 50 млн руб. — 22%."},{"id":175,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайд 10","isFromOriginal40":false,"isMultiSelect":false,"question":"Как с 1 января 2025 года изменилась общая ставка налога на прибыль организаций в РФ и ее распределение между федеральным бюджетом и бюджетами субъектов РФ?","options":[{"label":"А","text":"Общая ставка выросла с 20% до 25%, при этом доля в федеральный бюджет осталась равной 3%, а региональная часть выросла с 17% до 22%","isCorrect":false},{"label":"Б","text":"Общая ставка выросла с 20% до 25%, при этом доля в федеральный бюджет увеличилась с 3% до 8%, а доля в бюджеты субъектов РФ сохранилась на уровне 17%","isCorrect":true},{"label":"В","text":"Общая ставка снизилась с 24% до 18%, распределяемых поровну по 9% между федеральным и региональным бюджетами","isCorrect":false},{"label":"Г","text":"Общая ставка выросла с 18% до 22%, из которых 20% зачисляется в федеральный бюджет и 2% — в местные бюджеты","isCorrect":false}],"explanation":"Слайд 10 Лекции 7: до 01.01.2025 налог на прибыль составлял 20% (3% федеральный + 17% региональный), а с 01.01.2025 вырос до 25% (8% в федеральный бюджет + 17% в бюджеты субъектов РФ)."},{"id":176,"lectureId":"lec7","lectureTitle":"Лекция 7. Государственное регулирование кризисных ситуаций","slideRef":"Лекция 7, слайды 11–12","isFromOriginal40":false,"isMultiSelect":false,"question":"Какова историческая хронология изменения базовой ставки НДС в России с 1992 по 2026 год и какие еще налоговые изменения 2026 года отмечены в Лекции 7?","options":[{"label":"А","text":"Ставка НДС неизменно составляла 18% с 1992 по 2025 год, а с 2026 года снижена до 15% при полном освобождении всех плательщиков УСН и ИТ-компаний от страховых взносов","isCorrect":false},{"label":"Б","text":"Ставка НДС менялась так: 1992 г. — 10%, 1998 г. — 15%, 2010 г. — 20%, 2026 г. — 25%, при этом льготная ставка 10% на продукты питания и лекарства полностью отменена","isCorrect":false},{"label":"В","text":"Ставка НДС менялась так: 1992 г. — 28%, 1993 г. — 20%, 2004 г. — 18%, 2019 г. — 20%, с 1 января 2026 г. — 22% (при сохранении льготной ставки 10% на социально значимые товары); также в 2026 г. существенно снижен порог применения УСН без НДС, отменены льготы по страховым взносам для большинства МСП и повышены взносы для ИТ-компаний","isCorrect":true},{"label":"Г","text":"С 1 января 2026 года НДС в России заменен налогом с продаж по единой ставке 5% без права применения налоговых вычетов","isCorrect":false}],"explanation":"Слайды 11–12 Лекции 7 подробно приводят хронологию НДС: 1992 г. — 28%, 199
